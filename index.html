<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Old Roar — A Snake Island CYOA</title>
<style>
  :root { --paper: #faf6ed; --ink: #2b2419; --warm: #c97a3f; --water: #4a7d8c; --green: #6b8e4e; --gold: #c9a23f; --rule: rgba(43, 36, 25, 0.15); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Charter', 'Georgia', serif; line-height: 1.7; font-size: 18px; min-height: 100vh; }
  .container { max-width: 720px; margin: 0 auto; padding: 28px 24px 80px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
  header .title-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 28px; font-weight: normal; font-style: italic; letter-spacing: 0.5px; }
  header .sub { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--warm); margin-top: 4px; }
  .controls button { background: none; border: 1px solid var(--ink); color: var(--ink); padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 12px; border-radius: 3px; margin-left: 6px; }
  .controls button:hover { background: var(--ink); color: var(--paper); }
  .state-strip { background: rgba(107, 142, 78, 0.08); border: 1px dashed var(--green); padding: 10px 14px; margin: 0 0 24px; font-size: 12px; border-radius: 3px; }
  .state-strip strong { color: var(--green); }
  .state-strip .tag { display: inline-block; background: rgba(107, 142, 78, 0.15); padding: 2px 7px; border-radius: 3px; margin: 0 3px 3px 0; font-size: 11px; }
  .passage-id { font-family: 'Courier New', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--warm); margin-bottom: 4px; }
  .scene-meta { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--water); margin-bottom: 6px; font-style: italic; }
  .scene-title { font-size: 30px; font-weight: normal; margin-bottom: 20px; font-style: italic; line-height: 1.25; }
  .scene-text { font-size: 17px; }
  .scene-text p { margin-bottom: 14px; }
  .scene-text em { color: var(--ink); }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .choices button, .choices a.btn { background: var(--paper); border: 1.5px solid var(--ink); padding: 14px 18px; text-align: left; cursor: pointer; font-family: inherit; font-size: 16px; color: var(--ink); border-radius: 5px; transition: all 0.15s ease; line-height: 1.4; text-decoration: none; display: block; }
  .choices button:hover, .choices a.btn:hover { background: var(--ink); color: var(--paper); transform: translateX(4px); }
  .choices button .sub, .choices a.btn .sub { display: block; font-size: 13px; color: var(--warm); margin-top: 4px; font-style: italic; }
  .choices button:hover .sub, .choices a.btn:hover .sub { color: #f5c587; }
  .choices button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .choices button:disabled:hover { background: var(--paper); color: var(--ink); transform: none; }
  .demo-note { background: rgba(74,125,140,0.08); border-left: 3px solid var(--water); padding: 14px 18px; margin: 0 0 24px; border-radius: 0 4px 4px 0; font-size: 14px; line-height: 1.5; }
  .demo-note strong { color: var(--water); }
  figure.illus { margin: 0 0 28px; }
  figure.illus img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 6px 24px rgba(43,36,25,0.18); }
  figure.illus figcaption { font-size: 12px; color: var(--warm); text-align: center; font-style: italic; margin-top: 8px; letter-spacing: 0.5px; }
  .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 540px) { .hub-grid { grid-template-columns: 1fr; } }
  .hub-grid a.btn { font-size: 15px; padding: 12px 14px; }
  .hub-grid .played { background: rgba(107, 142, 78, 0.12); border-color: var(--green); }
  .hub-grid .played::after { content: " ✓"; color: var(--green); }
  .progress { font-size: 12px; color: rgba(43,36,25,0.5); text-transform: uppercase; letter-spacing: 1px; margin-top: 18px; }
  .small { font-size: 14px; color: rgba(43,36,25,0.6); font-style: italic; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title-row">
      <div>
        <h1>The Old Roar</h1>
        <div class="sub">A Snake Island Choose-Your-Own-Adventure · For the eight cousins</div>
      </div>
      <div class="controls"><button onclick="restart()">Start over</button></div>
    </div>
  </header>
  <div id="state-display"></div>
  <main id="main"></main>
</div>
<script>
const SCENES = {

// ============ FRAMING — ACT 1 ============

start: {
  id: 'START', title: 'The Old Roar',
  meta: 'A choose-your-own-adventure for the cousins of Sun Lakes',
  text: `<figure class="illus"><img src="images/web/jump.jpg" alt="Eight cousins jumping off the dock at sunset"><figcaption>The summer always starts the same way.</figcaption></figure>
<div class="demo-note"><strong>A true CYOA.</strong> You'll meet all eight cousins. You'll choose one to BE. You'll travel into a lake-below-the-lake to earn what you need. Then all eight of you will face the man with the clipboards together. Your choices change the ending.</div>
<p>The truck doors open at the same time. It is the third of July. Eight cousins tumble out into dust and dry grass and the smell of warm rock. Sun Lakes sits below them. The cove is the bluest it has ever been.</p>
<p>Madison (15). Carson (15). Reid (14). Chayten (13). Kellen (12). Keira (10). Ella (10). Aiden (7).</p>
<p>The grown-ups are still in the parking lot arguing about who made the best time. The dock is still there. The summer always starts the same way.</p>`,
  choices: [{ label: 'Run to the dock', target: 'p001' }],
},

p001: {
  id: 'P-001', title: 'The Synchronized Jump', meta: 'Opening ritual',
  text: `<figure class="illus"><img src="images/web/jump.jpg" alt="Eight cousins jumping off the dock, arms up, sunset behind them"><figcaption>Eight bodies hit the water in the same second.</figcaption></figure>
<p>The rule is older than any of them. It has no rule-maker. It just is. When you arrive at Sun Lakes, you put your bag down and you run to the dock and you all jump in at the same time.</p>
<p>Madison hits the dock first. Carson, half a step behind. Reid. Chayten and Kellen at a near-tie. Keira (whose legs are catching up). Ella in her bright pink swimsuit. Aiden, last, the smallest, his bare feet slapping the wood.</p>
<p>This year is different for Aiden. He learned to swim this spring — <em>really</em> learned. Six weekends at the YMCA pool with his mom and now he can do a full lap. He still wears his bright orange life jacket every time he hits the water — Mom's rule, and his rule too. Buckled tight at the chest, leg-strap clipped, the way she showed him. He is going to jump with his cousins. By himself. For the first time.</p>
<p>They line up at the end of the dock. Eight kids in a row. The wood is hot under their feet. A heron stops fishing and looks up like <em>here we go again.</em></p>
<p>They count to three. Eight bodies hit the water in the same second. Carson does a cannonball louder than physics allows — half the cove turns into spray. Madison goes in feet-first, ballet-clean, the way she's done since she was eight. Reid hits the water like a tree falling, shoulders square, no splash where you'd expect one. Chayten and Kellen go in side by side and surface laughing before anyone else does. Keira pulls a half-twist she's been practicing in the deep end at home. Ella jumps with her arms straight up, her crown of pink hair-ties intact. Aiden jumps with his eyes closed, his orange life jacket bright against the cliff shadow, his hand reaching for Chayten's and finding it under the water. The jacket pops him back up first.</p>
<p>They surface together. Eight grins. The lake is exactly the right kind of <em>here.</em></p>
<p>Madison spits water. "We're here."</p>
<p>Aiden, still gripping Chayten's hand: "<em>We're HERE.</em>"</p>`,
  choices: [{ label: 'Continue to morning', target: 'p002' }],
},

p002: {
  id: 'P-002', title: 'The Man with the Clipboards', meta: 'The threat arrives',
  text: `<p>Next morning. A man in a beige shirt is walking the dock with a clipboard. The eight cousins have come down for the dawn swim. They watch him from the lawn.</p>
<p>He is measuring things. He taps the third plank with his shoe — the wobbly one. He writes something. He shakes his head.</p>
<p>His name, they will learn, is <em>Drystone.</em></p>
<p>He sees the kids. He smiles in the way grown-ups smile when they have already decided. "Morning. You kids been swimming off this dock?"</p>
<p>"Every summer of our lives," Madison says.</p>
<p>"Won't be this summer, I'm afraid. The dock's failed inspection. We've got an order from the county. Coming down on Friday."</p>
<p>He says it like he's apologizing about the weather. He says it like he's already past the part where they're allowed to argue.</p>
<p>He hammers a sign into the lawn at the foot of the dock. <em>CLOSED — UNSAFE — REMOVAL PENDING.</em></p>
<p>He walks back up to his truck. The eight of them stand on the lawn looking at the sign and at each other.</p>`,
  choices: [{ label: "Try to do something about it", target: 'p003' }],
},

p003: {
  id: 'P-003', title: 'The Kids Cannot Fix This', meta: 'False starts',
  text: `<p>They try. Of course they try.</p>
<p>Madison goes inside to talk to the moms. The moms are on a phone call with the rental company about an air-conditioning unit and they say <em>not now, sweetie.</em></p>
<p>Carson goes to Uncle Bill, who is on his back under the truck dealing with a leak. "Buddy, that's a county issue. There's nothing we can do."</p>
<p>Reid measures the wobbly plank quietly. He could fix it. He has tools at home. He doesn't have them here.</p>
<p>Aiden sits at the end of the dock with his feet in the water. He is the only one not trying to fix anything because he is seven and he doesn't yet know how being-small feels until later.</p>
<p>Chayten sits down next to him. She knows.</p>
<p>The grown-ups will not save the dock. The kids cannot save the dock. The dock is going to come down on Friday and there is no way around it.</p>
<p>Which is when Aiden notices something through the sunroom window.</p>`,
  choices: [{ label: 'Look through the sunroom window', target: 'p004' }],
},

p004: {
  id: 'P-004', title: 'The Raft Bobbing in No Wind', meta: 'The portal cracks open',
  text: `<figure class="illus"><img src="images/web/sunroom.jpg" alt="The Sun Lakes cabin sunroom at sunset — flamingo float, fairy lights, the cove out the window"><figcaption>The sunroom. The flamingo. The cove out the window.</figcaption></figure>
<p>The big inflatable unicorn raft is in the sunroom, the way she always is — set up between two deck chairs, ready for next summer\'s eight-year-olds. There is no wind in the sunroom. The windows are closed.</p>
<p>The unicorn raft is <em>bobbing.</em></p>
<p>Aiden walks over. He climbs onto her. The bobbing gets stronger. The other seven cousins drift in one by one. Each one finds, against all known physics, a small raft of their own waiting in the sunroom.</p>
<p>Madison: a long flat canoe with a reading-cushion at the back.</p>
<p>Carson: a sturdy wooden boat on wheels.</p>
<p>Reid: a hollowed-out log canoe, smooth from many hands.</p>
<p>Chayten: a small driftwood raft that smells faintly of cedar.</p>
<p>Kellen: a sleek racing canoe with carbon-black sides.</p>
<p>Keira: a flat raft with an easel and jars of paint.</p>
<p>Ella: a small wooden boat with golden trim and a velvet seat.</p>
<p>The grown-ups are still on phone calls. They do not see the sunroom doing this.</p>
<p>Somewhere, a long way away, a deep humming sound starts.</p>`,
  choices: [{ label: 'Listen', target: 'p005' }],
},

p005: {
  id: 'P-005', title: 'The C-130', meta: 'Portal triggers',
  text: `<p>It is the hum of a C-130.</p>
<p>The C-130 is the cargo plane that flies low over Sun Lakes every few summers — military training, dropping into the canyon between Coulee walls. The kids have always loved it. They run to the dock when they hear it and they wave at the pilots and sometimes the pilots wag the wings back.</p>
<p>The hum gets louder. It is closer than the C-130 has ever been. The sunroom windows are rattling.</p>
<p>The C-130 comes over the cove low — so low they can see rivets — and it does the thing it has never done before:</p>
<p>It <em>flies into the lake.</em></p>
<p>The plane angles down and goes UNDER the water like it was diving home. The lake closes over it without a splash. The hum keeps going, faint, underneath them.</p>
<p>The water in the cove turns colors. The sunroom slides. The eight rafts lift gently off the floor.</p>
<p>Aiden, gripping his unicorn raft, says: "I think the lake wants us."</p>
<p>Madison says, "It does."</p>
<p>They go through.</p>`,
  choices: [{ label: 'Go through', target: 'p010' }],
},

p010: {
  id: 'P-010', title: 'Arrival — The Old Roar', meta: 'Eight rafts land in a meadow',
  text: `<p>They land in a meadow that is greener than grass should be. The C-130 hum is gone. The sky is the color of a postcard.</p>
<p>An old man is waiting for them on a flat rock. He looks a little like Uncle Bill but isn't quite. He has a baseball cap with no logo on it and a kind face and a clipboard, but his clipboard is wood and the paper has handwritten lists. He is the kind of person you trust within four seconds.</p>
<p>"You found us," he says. "Took you long enough." He grins.</p>
<p>"I am the Harbor Keeper. I have been keeping this place ready for visitors for a long time. You eight in particular — your dock-above is in trouble and the dock-above is hooked to the dock-below. If we don\'t fix things here, your home up there doesn\'t have a chance."</p>
<p>"Each of you has a region. Each region has a thing only YOU can do. You\'ll come back with something you can carry. Items. Allies. Maybe a friend. When you\'re all back — and you remember each other — we deal with the man with the clipboards."</p>
<p>He looks at all eight of them in turn. He nods at each, like he\'s checking a list he\'s had for a long time.</p>
<p>"Pick which one of you to be first. The lake will sort the rest."</p>`,
  choices: [{ label: 'Choose a cousin to play first', target: 'hub' }],
},

// ============ HUB — REGION PICKER ============

hub: {
  id: 'HUB', title: 'Pick a Cousin', meta: 'Eight regions. Twenty-seven endings each. 216 paths in total.',
  text: `<figure class="illus"><img src="images/web/table.jpg" alt="The eight cousins gathered around a card table at sunset, lake and dock behind them"><figcaption>Eight cousins. Eight regions. Pick whose path to walk first.</figcaption></figure>
<p>The Harbor Keeper steps aside. Eight paths lead away from the meadow. Each one belongs to one of the eight.</p>
<p>Click any cousin\'s name to enter their region as a Choose-Your-Own-Adventure. Each region has <strong>27 different endings</strong>. Whatever you earn — items, allies, flags — carries forward to the SHOWDOWN.</p>
<p>You can play as many cousins as you like. After at least <strong>three regions</strong>, the Showdown unlocks. Play more for stronger endings.</p>`,
  isHub: true, choices: [],
},

// ============ SHOWDOWN ============

showdown_intro: {
  id: 'SHOWDOWN', title: 'Back at the Dock', meta: 'Friday morning',
  text: `<figure class="illus"><img src="images/web/dock_night.jpg" alt="Three cousins sitting on the dock at night under a full moon, fireworks distant across the cove"><figcaption>The night before. The dock they came home to save.</figcaption></figure>
<p>Friday morning. The eight cousins are back at Sun Lakes. They remember everything. The grown-ups remember nothing — the lake-below kept the memory inside them.</p>
<p>Drystone\'s truck is parked at the top of the lawn. Two of his crewmen are unloading a small bulldozer. He is walking down the gravel with his clipboard.</p>
<p>He sees them on the dock. He smiles his apology-smile. "Sorry kids. Time\'s up. We need you to clear the area."</p>
<p>The kids do not move.</p>
<p>Madison says quietly: "We\'re here."</p>
<p>Chayten: "All eight."</p>
<p>Aiden, his hand reaching up for something at his shoulder no other adult will see: "All eight."</p>
<p>Behind Drystone, the impossible begins to arrive — drifting in like weather. Something with feathers settles on the dock-rail. Something with bark wades in the shallows. Something the size of a kitten sits up straight on Aiden\'s shoulder. The basalt of the cliff a quarter-mile up-canyon is humming faintly, the way a hand hums when you press it to a piano lid.</p>
<p>Drystone cannot quite see any of it. He can <em>feel</em> it. The way you feel someone standing behind you in a doorway. His clipboard hand is shaking very slightly.</p>`,
  choices: [{ label: 'Step forward', target: 'showdown_choice' }],
},

showdown_choice: {
  id: 'P-300', title: 'CHOICE — How do you stand?', meta: 'The kids decide',
  text: `<p>Madison turns to the seven others. "How do we want to do this?"</p>`,
  choices: [
    { label: 'All eight step onto the dock together. Block the bulldozer.', target: 'showdown_block', sub: "Physical line. He'll have to physically remove you." },
    { label: 'Madison speaks. The rest of you back her up.', target: 'showdown_speak', sub: "Words first. Make him say the truth out loud." },
    { label: 'Show him what you brought back. Let him see the impossible.', target: 'showdown_reveal', sub: "Magical reveal. The world he can't admit to is standing behind you." },
  ],
},

showdown_block: {
  id: 'P-301', title: 'The Line', meta: 'Eight kids on the boards',
  text: `<p>All eight cousins step onto the dock. They walk to the end. They turn. They face the lawn. Eight kids in a row, the way they jumped together two days ago.</p>
<p>Drystone stops at the foot of the dock.</p>
<p>"Kids. This isn\'t a game. Get off the dock."</p>
<p>Nobody moves.</p>
<p>Carson — the tallest — crosses his arms. Reid does the same, a beat later, the way Reid does everything. Kellen weighs a small flat stone in his palm and doesn\'t throw it. Keira tilts her head once and notices a color in the basalt under the dock that wasn\'t there yesterday. Chayten doesn\'t look at anyone — she puts her hand on Aiden\'s back, between his shoulder blades, the way she always does. Madison\'s face is the face Marigold called <em>the deciding kind.</em> Ella has the same face beside her, two ten-year-olds holding it together like an inside joke.</p>
<p>Behind them, the impossible keeps arriving. A weight on the lawn that wasn\'t there before. A color in the dock pilings that wasn\'t there before. A small voice reading something from a tiny scroll the grown-ups can\'t see. The air feels crowded. Drystone can\'t look at any of it directly.</p>
<p>"What\'s your move?" Madison asks.</p>`,
  choices: [
    { label: 'Wait. Just wait. Let him be the one to act first.', target: 'showdown_wait' },
    { label: 'Read the frog\'s proclamation out loud', target: 'showdown_proclamation' },
    { label: 'Aiden steps forward alone, the way Pegasus said he could', target: 'showdown_aiden' },
  ],
},

showdown_speak: {
  id: 'P-302', title: 'Madison Speaks', meta: 'Words first',
  text: `<p>Madison steps half a step forward. She has the eldest\'s voice and the noticer\'s eye. Drystone is taller than her. She is unimpressed.</p>
<p>"Mr. Drystone. This dock is older than your contract. It has held forty summers of cousins. It will hold forty more if you let it."</p>
<p>"It\'s a SAFETY issue."</p>
<p>"It\'s a budget issue. You get paid by the demolition. We checked." (She did not, but her voice does not flinch. Marigold\'s queen-voice would be proud.)</p>
<p>Carson, beside her, keeps a hand on her shoulder — the way an older brother does when his sister is about to do something hard. He doesn\'t need to say anything; she can feel him there. Drystone sees Carson too, and Carson does not look away.</p>
<p>Drystone\'s mouth opens. Then closes. Then opens.</p>
<p>"How do you want to press this?" Chayten murmurs from the back, just loud enough for Madison to hear. She has a way of asking that sounds like a director giving notes during a play.</p>`,
  choices: [
    { label: 'Press him on the budget. Watch him sputter.', target: 'showdown_budget' },
    { label: 'Reid steps up and says he can fix the wobbly plank himself, today, with his staff', target: 'showdown_reid_fix' },
    { label: 'Show him what you brought back — let the magic do the talking', target: 'showdown_reveal' },
  ],
},

showdown_reveal: {
  id: 'P-303', title: 'The Impossible, Visible', meta: 'Let him see what he is pretending not to',
  text: `<p>The kids step aside.</p>
<p>Drystone is no longer looking at eight cousins. He is looking at the lawn and the dock and the cove and not believing them.</p>
<p>Something the size of a small house has stepped out of the canyon — that one is for Carson. Something twice Drystone\'s height, made of something that should not be wearing leaves, is wading up the shallows — that one is for Reid. Something with a horn is breathing near Aiden\'s ear. There are otters in a line at the shore, organized; Chayten knows their names. There are blue-feathered birds on the dock-rail with their heads tilted the same way; the smallest one trips off the rail and Kellen catches it without looking. There is color in the basalt of the canyon walls that wasn\'t there yesterday; Keira sees it brighten just slightly when she does. There is a small frog in a sash sitting on Ella\'s shoe, reading something quietly to itself. There is a hum underneath the wind that Madison alone can hear in three keys.</p>
<p>Drystone\'s mouth opens. He cannot say any of it out loud. He understands, the way the dreaming understand, that if he tries to name what he is seeing in front of his crewmen he will sound insane. The lake-below\'s rules are quiet but absolute: it is shown only to the ones who already remember it.</p>
<p>He stares at the impossible for three full seconds. The clipboard slips in his hand.</p>`,
  choices: [
    { label: 'Madison: "You see them. We see them. What now?"', target: 'showdown_madison_q' },
    { label: 'Aiden, stepping forward: "Sir. You should leave."', target: 'showdown_aiden' },
    { label: 'Big Coulee trumpets once. The whole lawn shakes.', target: 'showdown_coulee' },
  ],
},

// SHOWDOWN OUTCOMES

showdown_wait: {
  id: 'P-310', title: 'They Wait Him Out', meta: 'Stillness',
  text: `<p>Eight kids do not move. Drystone has been ready for arguing. He has not been ready for SILENCE.</p>
<p>He fidgets. He looks at his clipboard. He looks at the line of eight. He looks at his crewmen, who are pretending very hard not to see what is on the lawn behind the kids.</p>
<p>One full minute passes. Then two. Drystone\'s confidence drains visibly.</p>
<p>He says, finally, the line he was not supposed to say: "I just need to fill the quota for this quarter. The county doesn\'t care. I just need a dock. Yours is — it\'s the easiest one. The owners aren\'t around. I thought — easy paperwork."</p>
<p>Madison says, "We\'re here. The owners\' grandchildren are here. Pick a different dock."</p>
<p>Drystone nods. He walks back up the gravel. The bulldozer reverses.</p>`,
  choices: [{ label: 'Continue', target: 'ending_decide' }],
},

showdown_proclamation: {
  id: 'P-311', title: 'The Frog Reads the Proclamation', meta: 'Bright Water Alliance',
  text: `<p>The frog herald hops to the front of the dock. He unrolls his scroll. Drystone cannot see the frog but the kids and Drystone can both <em>hear</em> the proclamation read aloud — and Drystone is the only adult who hears it without his ears.</p>
<p>"<em>By order of the Queens of the Bright Water Court, Hotel Sun Lakes and its dock are designated ALLIED TERRITORY. Any threat to this dock is a threat to the court of the egg-mother and her chorus. Witnesses include: the basalt giants of The Old Roar, the unicorn of the Unicorn Meadow, the mammoth of the Coulee Plains, the tree-being of Old Speak\'s Wood, the bird champion of Skip-Stone Lake, the otter players of the Driftwood, and the Listen bird of the ancient canopy.</em>"</p>
<p>Drystone\'s clipboard falls out of his hand. He picks it up. He looks at his crewmen. He cannot say anything. He cannot un-hear what only he heard.</p>
<p>"I — I have to go check something at the office."</p>
<p>He walks back up the gravel without looking at the sign in the lawn. The bulldozer reverses.</p>`,
  choices: [{ label: 'Continue', target: 'ending_decide' }],
},

showdown_aiden: {
  id: 'P-312', title: 'Aiden Steps Forward', meta: 'The smallest of them',
  text: `<p>Aiden — seven years old, four feet tall — steps forward. Pegasus walks beside him. Hush sits on his shoulder if you found him.</p>
<p>He looks up at Drystone. His chin barely reaches Drystone\'s belt.</p>
<p>"Sir," Aiden says, with the exactly-right voice Pegasus told him he had, "we are not too small. The world has been wrong about that all of our lives. You are wrong about it today. Please go."</p>
<p>Drystone\'s knees almost buckle. He has been told off by a seven-year-old in front of a unicorn. He cannot say any of it. He cannot un-see any of it.</p>
<p>He turns around. He walks back up the gravel. The bulldozer reverses. He does not return.</p>
<p>Pegasus puts her head against Aiden\'s ear. "Exactly right."</p>`,
  choices: [{ label: 'Continue', target: 'ending_decide' }],
},

showdown_budget: {
  id: 'P-313', title: 'You Press the Budget', meta: 'Madison destroys him on paper',

}; // end SCENES

// ============ STATE MANAGEMENT ============

const REGIONS = [
  { key: 'madison', file: 'madison_demo.html', name: 'Madison (15)', tag: 'The eldest — the Quiet Pool' },
  { key: 'carson',  file: 'carson_demo.html',  name: 'Carson (15)', tag: 'The competitor — the Coulee Plains' },
  { key: 'reid',    file: 'reid_demo.html',    name: 'Reid (14)',   tag: "The quiet worker — Old Speak's Wood" },
  { key: 'chayten', file: 'chayten_demo.html', name: 'Chayten (13)', tag: 'The otter friend — the Driftwood Stage' },
  { key: 'kellen',  file: 'kellen_demo.html',  name: 'Kellen (12)', tag: 'The player whole — Skip-Stone Lake' },
  { key: 'keira',   file: 'keira_demo.html',   name: 'Keira (10)',  tag: 'The artist-climber — the Painted Cliff' },
  { key: 'ella',    file: 'ella_demo.html',    name: 'Ella (10)',   tag: 'The deciding face — the Bright Water Court' },
  { key: 'aiden',   file: 'aiden_demo.html',   name: 'Aiden (7)',   tag: 'The exactly-right — the Unicorn Meadow' },
];

let state = { current: 'start', items: {}, allies: [], flags: [], visited: [], regionsPlayed: [] };

function save() { try { localStorage.setItem('old-roar-state', JSON.stringify(state)); } catch(e){} }
function load() {
  try { const s = localStorage.getItem('old-roar-state'); if (s) state = JSON.parse(s); } catch(e) {}
  // Refresh regionsPlayed from each region's localStorage (in case user played them in another tab)
  refreshRegionsPlayed();
  // Honor ?goto= in the URL so region exits can jump straight to a specific scene
  try {
    const params = new URLSearchParams(location.search);
    const target = params.get('goto');
    if (target && SCENES[target]) {
      state.current = target;
      if (!state.visited.includes(target)) state.visited.push(target);
      save();
      // Clean the URL so a refresh doesn't re-trigger the jump
      history.replaceState({}, '', location.pathname);
    }
  } catch(e){}
  render();
}
function refreshRegionsPlayed() {
  state.regionsPlayed = [];
  REGIONS.forEach(r => {
    try {
      const s = localStorage.getItem(r.key + '-demo-state');
      if (s) {
        const parsed = JSON.parse(s);
        if (parsed && parsed.visited && parsed.visited.includes('exit')) {
          state.regionsPlayed.push(r.key);
        }
      }
    } catch(e){}
  });
  // Merge each region's earned items/allies/flags into the master state
  state.items = {};
  state.allies = [];
  state.flags = [];
  REGIONS.forEach(r => {
    try {
      const s = localStorage.getItem(r.key + '-demo-state');
      if (s) {
        const parsed = JSON.parse(s);
        if (parsed) {
          if (parsed.items) Object.entries(parsed.items).forEach(([k,v]) => { state.items[r.key + '-' + k] = v; });
          if (parsed.allies) parsed.allies.forEach(a => { if (!state.allies.includes(a)) state.allies.push(a); });
          if (parsed.flags) parsed.flags.forEach(f => { if (!state.flags.includes(f)) state.flags.push(f); });
        }
      }
    } catch(e){}
  });
  save();
}

function go(t) {
  state.current = t;
  if (!state.visited.includes(t)) state.visited.push(t);
  save(); window.scrollTo(0, 0); refreshRegionsPlayed(); render();
}

function restart() {
  if (!confirm('Start over from the very beginning? This wipes ALL cousin playthroughs, all earned items, and resets the book completely.')) return;
  // Wipe each cousin demo's saved state
  REGIONS.forEach(r => { try { localStorage.removeItem(r.key + '-demo-state'); } catch(e){} });
  // Wipe master state
  state = { current: 'start', items: {}, allies: [], flags: [], visited: [], regionsPlayed: [] };
  save(); render();
}

// Soft navigation back to hub — keeps your earned state so you can play another cousin
function backToHub() {
  state.current = 'hub';
  save(); window.scrollTo(0, 0); refreshRegionsPlayed(); render();
}

// Kept as an alias for the hub "Reset all" button
function resetAll() { restart(); }

function renderState() {
  const rc = state.regionsPlayed.length;
  const ac = state.allies.length;
  const fc = state.flags.length;
  if (rc === 0 && ac === 0 && fc === 0) return '';
  let h = '<div class="state-strip">';
  h += `<div><strong>Regions completed:</strong> ${rc} of 8 ${REGIONS.filter(r => state.regionsPlayed.includes(r.key)).map(r => `<span class="tag">${r.name.split(' ')[0]}</span>`).join('')}</div>`;
  if (ac) h += `<div style="margin-top:4px;"><strong>Allies gathered:</strong> ${state.allies.slice(0,12).map(a => `<span class="tag">${a}</span>`).join('')}${state.allies.length > 12 ? ` <em>+${state.allies.length-12} more</em>` : ''}</div>`;
  if (fc) h += `<div style="margin-top:4px;"><strong>Carrying:</strong> ${state.flags.slice(0,12).map(f => `<span class="tag">${f}</span>`).join('')}${state.flags.length > 12 ? ` <em>+${state.flags.length-12} more</em>` : ''}</div>`;
  return h + '</div>';
}

function renderHub() {
  const rc = state.regionsPlayed.length;
  let h = '<div class="hub-grid">';
  REGIONS.forEach(r => {
    const played = state.regionsPlayed.includes(r.key);
    h += `<a class="btn ${played ? 'played' : ''}" href="${r.file}"><strong>${r.name}</strong><span class="sub">${r.tag}</span></a>`;
  });
  h += '</div>';
  const tier = endingTierName();
  const tierColor = tier === 'Crown' ? 'var(--gold)' : (tier === 'Silver' ? 'var(--water)' : 'var(--ink)');
  let tierHint = '';
  if (rc === 0) {
    tierHint = 'Play any cousin to start. What you bring back will shape how the book ends.';
  } else if (tier === 'Bronze') {
    tierHint = 'Each region holds more than you found. The deeper paths take longer and ask for harder kindnesses.';
  } else if (tier === 'Silver') {
    tierHint = 'You went past the surface. There is one more layer further in — the cousin\'s region has not given you everything it has yet.';
  } else {
    tierHint = 'You went all the way. Head to the Showdown when ready.';
  }
  h += `<div class="progress">${rc} / 8 regions completed · ending currently tracking: <strong style="color:${tierColor};">${tier}</strong></div>`;
  h += `<div class="progress" style="margin-top:6px;font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;line-height:1.5;">${tierHint}</div>`;
  h += '<div class="choices">';
  if (rc >= 1) {
    h += `<button onclick="go('showdown_intro')" style="background:#2b2419;color:#faf6ed;border-color:#2b2419;"><strong>Head to the Showdown ▸</strong><span class="sub" style="color:#f5c587;">Face Drystone with what you\'ve earned. Your current ending: ${tier}.</span></button>`;
  } else {
    h += `<button disabled><strong>Showdown locked</strong><span class="sub">Play at least 1 cousin's region first, then come back here for the Showdown.</span></button>`;
  }
  h += `<button onclick="resetAll()" style="font-size:13px;opacity:0.7;">Reset all playthroughs</button>`;
  h += '</div>';
  return h;
}

// Ending tier is decided by the DEPTH of the playthrough — what items/allies/flags
// the reader earned in the cousins they played. This matches how the print book
// will work: each cousin's chapter can independently land on Crown, Silver, or Bronze
// based on the choices made within it. No need to track "how many cousins read."
function endingTier() {
  const itemTiers = Object.values(state.items || {});
  const hasFull = itemTiers.includes('full');
  const hasEnhanced = itemTiers.includes('enhanced');
  const allyCount = (state.allies || []).length;
  const flagCount = (state.flags || []).length;
  // Crown: deepest path on at least one cousin (full item + meaningful side-earnings)
  if (hasFull && (allyCount >= 2 || flagCount >= 2)) return 'ending_crown';
  if (hasFull) return 'ending_crown';
  // Silver: a strong middle path — enhanced item OR a base item with several earnings
  if (hasEnhanced) return 'ending_silver';
  if (allyCount >= 2 && flagCount >= 1) return 'ending_silver';
  // Bronze: surface playthrough — base item only, few flags, no allies
  return 'ending_bronze';
}
function endingTierName() {
  const t = endingTier();
  if (t === 'ending_crown') return 'Crown';
  if (t === 'ending_silver') return 'Silver';
  return 'Bronze';
}
function renderEndingDecide() {
  const target = endingTier();
  // auto-route
  setTimeout(() => go(target), 30);
  return '<p style="opacity:0.5;">…</p>';
}

function render() {
  const m = document.getElementById('main');
  document.getElementById('state-display').innerHTML = renderState();
  const s = SCENES[state.current];
  if (!s) { m.innerHTML = `<p>Scene not found: ${state.current}</p>`; return; }
  let h = '';
  if (s.id) h += `<div class="passage-id">${s.id}</div>`;
  if (s.meta) h += `<div class="scene-meta">${s.meta}</div>`;
  h += `<h2 class="scene-title">${s.title}</h2><div class="scene-text">${s.text || ''}</div>`;
  if (s.isHub) {
    h += renderHub();
  } else if (s.isEndingDecide) {
    h += renderEndingDecide();
  } else if (s.choices && s.choices.length > 0) {
    h += '<div class="choices">';
    s.choices.forEach(c => h += `<button onclick="go('${c.target}')">${c.label}${c.sub ? `<span class="sub">${c.sub}</span>` : ''}</button>`);
    h += '</div>';
  } else if (s.isEnd) {
    h += `<div class="choices"><button onclick="backToHub()">← Back to region picker (keep what you earned, try another cousin)</button><button onclick="restart()" style="opacity:0.85;">Start completely over (wipe everything)</button></div>`;
  }
  m.innerHTML = h;
}
load();
</script>
