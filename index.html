of sound you feel in your sternum before your ears catch it. The stones are warming up for something. They are an audience that arrived early.</p><p>She's alone. The others are elsewhere. Aiden is not here. Her stomach pulls toward wherever he is. She is very aware of how loud the Stones' humming is when there's no one beside her to share the sound with. She has not been this alone in a long time. The humming gets bigger when nobody else is there to soak it up.</p><p>On the stage, a dozen otters are running in a panic.</p><p>One of them, old, gray around the muzzle, wearing a velvet cape and a single small bandage wrapped around his whiskers, is sitting in the middle of the stage looking absolutely calm in the way of a man whose world is ending.</p><p>He sees Chayten.</p><p>He stands up very slowly.</p><p>He says, in a voice like an entire theater season ending: \"<em>You.</em> You with the EYES. Get DOWN here.\"</p>", "next": 121, "arrival": "chayten"}, "121": {"id": 121, "title": "The Be-a-kid Moment", "html": "<figure class=\"illus\"><img src=\"images/chayten_region.webp\" alt=\"The Be-a-kid Moment\" loading=\"lazy\"></figure><p>Chayten walks down the grass slope. The wet ones in her sandals squelch.</p><p>The old otter meets her at the foot of the stage. He bows. Then he winces, because bowing tugs his bandaged whiskers.</p><p>\"OTTO,\" he announces. \"Lead actor. Or <em>was</em>. My whiskers betrayed me at the dress rehearsal. The Stones go on in forty minutes.\" He gestures up at the enormous humming audience. \"They have been waiting for this play for <em>eighty years</em>. They will be FURIOUS if it does not happen. You have the EYES. You will play the lead. Yes?\"</p><p>Chayten opens her mouth.</p><p>She is about to say yes, because that's what she does. Saying yes when other people need something is approximately ninety percent of her personality.</p><p>But Otto holds up one paw.</p><p>\"Stop. Wait. Look at me.\"</p><p>Chayten looks at him.</p><p>Otto squints. He tilts his head. He sees, very clearly, the way Chayten has been holding herself, like a chaperone at someone else's party, like a sister who has misplaced her brother for the first time in years.</p><p>\"He is FINE,\" Otto says.</p><p>Chayten says, \"Who?\"</p><p>\"The small one. The one you're missing. <em>He is fine.</em> He is somewhere doing something brave. You can feel him. Yes?\"</p><p>Chayten checks, behind her eyes, the place where she can always feel Aiden.</p><p>He is, in fact, fine.</p><p>He is also, somehow, riding something that is not a horse.</p><p>She lets out a breath she didn't know she was holding.</p><p>\"Good,\" Otto says. \"Now. You are not a sister right now. You are not an oldest. You are not a babysitter. For one hour, you are an <em>actor</em>. Do you accept the demotion?\"</p><p>Chayten laughs. It surprises her.</p><p>\"Yes,\" she says.</p><p>Otto looks at her for one more long second. Then he says, more quietly: \"And child. Before I go. May I just sit here a moment? With you. Not to ask anything.\"</p><p>Chayten blinks. People lean on her. They always have, and she likes that they can. But this is something else, someone wanting to be near her with nothing to ask of her, and it is rare enough that it catches in her chest.</p><p>She nods.</p><p>Otto sits down on the stage beside her. Cross-legged otter style. He doesn't speak. He doesn't perform. He doesn't introduce his troupe or explain the play or check his bandage. He just sits with her, the way a person sits with another person whose company is enough.</p><p>It lasts maybe ten seconds. It is the most important ten seconds Chayten has experienced in a year. It is just not how things usually go for her. Her family loves her so much they always reach for her to <em>do</em> something.</p><p>Otto stands slowly. \"And one more thing, child. You are Chayten the Connector. The one who sits with people because they need someone to sit with them. That is rarer than the world tells you. Remember the name.\"</p><p>\"<em>Excellent.</em> Now. Follow me.\"</p>", "next": 122}, "122": {"id": 122, "title": "Chayten's Choice", "html": "<p>Otto leads her up the driftwood ramp to the stage. The other otters part for her like she's already someone important. One of them tries to hand her a small velvet cape. Another tries to hand her a script.</p><p>Otto waves them all off. He turns to Chayten and says, with great formality:</p><p>\"The play is <em>The Tale of the Lost Brother.</em> The lead is the SISTER. You have forty minutes. How would you like to begin?\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Take the script and start reading", "target": 123}, {"label": "Ask Otto what the play is really about first", "target": 124}, {"label": "Notice a small otter shaking by the wardrobe trunk and go to her first", "target": 125}]}, "123": {"id": 123, "title": "Take the Script", "html": "<p>Chayten takes the script. The paper is soft from a thousand readings. The handwriting is small and looped.</p><p>She reads fast. The play is short, six scenes, maybe twenty minutes of stage time. It is about a young otter girl whose little brother was lost in a storm. She spends the rest of her life singing him home, every night, by the water, until she is old. Then she finds him. That's the ending.</p><p>It is a sad play.</p><p>It is also, Chayten realizes, a beautiful play.</p><p>She gets her lines down in twenty minutes. Otto fits her with the velvet cape. Another otter, a fussy one with a measuring tape, adjusts the hem in three seconds flat and tells her she has \"<em>workable</em>\" shoulders.</p><p>The Stones are humming louder now. The amphitheater is full. From the back, the audience looks like a quarry someone tipped on its side.</p><p>Chayten goes on stage.</p><p>She delivers the lines. She is good. She has always been good at being the center of something. Her voice carries. The Stones hum approval at the climactic line, the sister's promise to her brother, every night, that she will keep singing, and when Chayten finishes the final scene, the stones rumble like distant thunder. Otters in the wings weep. Otto, from off-stage, blots his eye with a corner of his cape.</p><p>The lights (which are not lights, they are floating bioluminescent moss balls) come up.</p><p>Otto walks out on stage and presents Chayten with a small mask carved from driftwood. The mask is shaped like an otter's face but with eyes deliberately too kind. Otto explains that this is the Otter Mask. Whoever wears it speaks with a voice the listener cannot ignore.</p><p>\"You did well,\" Otto says. \"You delivered our play.\"</p><p>A small otter Chayten hasn't met before, tiny, holding a paper bag, comes up and hands her something. It is a small silver fish.</p><p>\"For your brother,\" the small otter says. \"He likes fishing. The fish is for him.\"</p><p>Chayten kneels down. \"How did you know?\"</p><p>The small otter shrugs. \"You said his name when you got nervous.\"</p><p>Chayten tucks the fish in her pocket.</p><p><em>If the reader has played Madison's branch, the small otter pauses and tilts her head toward something far off. \"Did you hear that?\" she whispers. \"Someone is dancing on water.\" Chayten listens. She thinks she hears, very faintly, footsteps on stone, the precise sound a ballerina makes when she lands.</em></p><p>She leaves with the mask in her hands, the fish in her pocket, and the feeling that she did something well.</p><p>It was a good show.</p><p>It was not a great show.</p><p>She is not sure why she feels that.</p><p>She thinks she might know.</p><p>She doesn't quite say it out loud.</p>", "next": 126, "depth": "SILVER"}, "124": {"id": 124, "title": "Ask What the Play Is About", "html": "<p>Chayten doesn't take the script yet.</p><p>She looks Otto in the eye.</p><p>\"What's it really about?\"</p><p>Otto goes very still.</p><p>The other otters, who had been swirling around them with capes and combs and measuring tapes, stop. They all turn slightly to look at Otto. As if they are waiting to see what he says.</p><p>Otto sits down on the stage. He pats the wood next to him. Chayten sits.</p><p>He takes a long breath.</p><p>\"It is about my brother,\" he says. \"Not the brother I had. The brother I <em>chose</em>. We were not born to the same mother. We were not the same kind of otter. He was river. I was lake. We were raised together because his mother died and mine had room. We were brothers anyway. We were not blood. We were better than blood. Do you understand?\"</p><p>Chayten thinks of Aiden, who is her brother by blood.</p><p>Then she thinks of the seven other kids at Sun Lakes. Who are her brothers and sisters in a different way. By choice. By return. By every July for as long as she can remember.</p><p>\"Yes,\" she says.</p><p>Otto nods. \"He was lost in a storm when we were small. The play says the sister sings him home. The truth is, I never sang him home. I just kept singing because I didn't know what else to do.\"</p><p>He looks at her with old wet eyes.</p><p>\"I have played this play seven hundred and twelve times,\" Otto says. \"Every time, I am the brother who comes back at the end. Every time, I think, <em>what if this is the time he hears me.</em>\"</p><p>He laughs at himself. It is a small, soft laugh, the kind that doesn't ask to be joined.</p><p>\"The Stones know,\" he says. \"That's why they hum so loud. The play is real.\"</p><p>Chayten thinks for a moment.</p><p>Then she says, \"Can I change the ending?\"</p><p>Otto blinks. \"Change it?\"</p><p>\"Just one line. At the very end. When the sister finds the brother. Instead of saying <em>you came home</em>, can I say <em>you were always with me</em>?\"</p><p>Otto is quiet for a long time.</p><p>He says, \"I have been playing the wrong ending for seven hundred years.\"</p><p>Then he hugs her. It is the kind of hug only an old otter can give, small, surprisingly strong, and slightly damp around the edges. His whiskers tickle her ear. He smells like cedar and old velvet.</p><p>They rehearse together. He plays the brother. She plays the sister. The new ending makes both of them cry the second time through. By the fourth time they are laughing because they keep crying.</p><p>The performance is beautiful. The Stones hum until the ground shakes. The audience of otters in the front weeps openly. Two of them have to be carried out. One says, \"WORTH it.\"</p><p>After the play, Otto presents Chayten with the Otter Mask, except this version is older, more worn, more loved. \"Mine,\" he says. \"Now yours. Speak with it and the listener cannot pretend not to hear.\"</p><p>He also says, very carefully: \"I will come with you to the lake-up-above. To the dock. I have not left The Old Roar in two hundred years. But I'll come for this. For you. For what you did.\"</p><p>A small otter (Pickle, Chayten learns) gives her a silver fish for Aiden. Pickle is shy and won't quite meet her eye.</p><p>Chayten leaves with the mask, the fish, an old otter shouldering a velvet cape behind her, and a feeling she will not put into words for several days.</p>", "next": 126, "depth": "CROWN"}, "125": {"id": 125, "title": "Notice Pickle First", "html": "<p>Chayten was about to take the script.</p><p>But there's a small otter shaking by the wardrobe trunk.</p><p>She is tiny. Half the size of the other otters. She is holding a costume in both paws, a child-sized brown smock, and she is staring at it like it might bite her.</p><p>Chayten kneels down.</p><p>\"Hey.\"</p><p>The small otter looks up. Her eyes are enormous.</p><p>\"Hey,\" Chayten says again. \"I'm Chayten. What's your name?\"</p><p>\"...Pickle.\"</p><p>\"Pickle. Are you in the play?\"</p><p>Pickle shakes her head fast. Then she nods. Then she shakes her head again. \"I'm, they said I could try out. I tried out. They said I could be the <em>brother</em>. The little brother. Just the early scenes. But I can't, I can't do it, I can't go out there, my legs are, they're not, they don't work, they're wrong, I can't , \"</p><p>Chayten puts a hand on Pickle's shoulder.</p><p>\"Hey. Pickle. Look at me.\"</p><p>Pickle looks.</p><p>Chayten says, \"You don't have to be brave to be useful. You just have to show up.\"</p><p>Pickle blinks twice.</p><p>\"Will you go out there with me?\" Chayten asks. \"I'm playing the sister. You'd be playing my brother. We'd be on stage together the whole time. I won't let go of your paw. Not for one second. Deal?\"</p><p>Pickle says, in a voice so small Chayten has to lean in: \"...Deal.\"</p><p>Chayten stands up and walks back to Otto.</p><p>She says, \"I'll do the play. But I want Pickle as the brother. Both scenes. The young one AND the old one.\"</p><p>Otto frowns. \"Pickle is too small for the older scenes. The brother grows up. We have a, we have a <em>taller</em> otter for that role , \"</p><p>\"Pickle is the brother,\" Chayten says. \"Both halves. Or I won't do it.\"</p><p>The other otters go very quiet.</p><p>Otto looks at Chayten. He looks at Pickle, who has straightened her tiny spine half an inch.</p><p>Otto says, \"I have been mis-casting that role for forty-three years.\"</p><p>He turns and roars at the troupe: \"PICKLE IS THE BROTHER. RESET THE BLOCKING. <em>MOVE.</em>\"</p><p>The troupe moves.</p><p>Chayten and Pickle take the stage holding paws. Chayten does not let go for the entire play. Not once. Pickle delivers her lines in a tiny voice. The big Stones in the back lean forward to hear, Chayten can FEEL them lean, and when Pickle says her one big line (\"I am still here, I am still here, I am still here, I never went away\"), the Stones in the back hum so deep that Chayten's chest vibrates with it.</p><p>The play ends. Pickle is crying. Chayten is crying. Otto, from the wings, has fallen over.</p><p>The Stones hum for a long minute after the curtain.</p><p>Otto comes out and presents Chayten with the Otter Mask, the oldest one, the one his great-grandmother wore. \"Whoever wears it is heard,\" he says. \"But you didn't need it tonight. You were already heard. That is rare.\"</p><p>Pickle climbs up Chayten's side and clings to her shoulder like a small wet stole. \"Can I come with you?\" she whispers. \"I want to come with you.\"</p><p>Chayten says, \"Yes.\"</p><p>Then one of the back-row Stones, the biggest one, the one that hasn't moved in five hundred years, says, in a voice like a quarry waking up: \"<strong>SHE SAW THE SMALL ONE FIRST. THAT IS A REAL THING.</strong>\"</p><p>The whole troupe goes still.</p><p>Otto whispers, \"The Stones haven't <em>spoken</em> in a hundred and twenty years.\"</p><p>Chayten doesn't know what to say.</p><p>So she just bows.</p><p>The Stones hum.</p><p><em>If the reader has played Aiden's branch, the bioluminescent moss-lights above the stage briefly form the shape of a unicorn galloping across the ceiling. Pickle squeaks and points. Chayten looks up. She smiles like she already knew.</em></p><p>Pickle gives her a small silver fish for Aiden. (Pickle had been saving it. She had been waiting for someone like Chayten.)</p><p>Chayten leaves with the mask, the fish, Pickle on her shoulder, and the weird permanent feeling that the biggest Stone in the back was speaking specifically to her.</p>", "next": 126, "depth": "CROWN"}, "126": {"id": 126, "title": "Exit: the Troupe Sees Her Off", "html": "<p>The otters line up to wave her off. They are an enthusiastic farewell committee. The fussy one with the measuring tape demands she stand still for \"<em>one more fitting, in case we need you again.</em>\" The wardrobe-trunk one gives her a small velvet square (\"<em>for emergencies</em>\").</p><p>The Stones hum, low and warm.</p><p>Her boat is waiting in the water below the stage.</p><p>She steps in.</p><p>She has the Otter Mask. She has the silver fish for Aiden. She has, somewhere under her ribs, the new and complicated feeling that a play she helped fix was also somehow a play about her own life.</p><p>She heads back toward wherever Aiden is.</p><p>She always does.</p>", "exit": true, "next": "hub"}, "150": {"id": 150, "title": "Arrival at Skip-stone Lake", "html": "<figure class=\"illus\"><img src=\"images/kellen_region.webp\" alt=\"Arrival at Skip-stone Lake\" loading=\"lazy\"></figure><p>Kellen's raft slides up to the edge of a long flat lake. His raft is now a sleek racing canoe with carbon-black sides. He steps onto the shore and a stone skims past his ear.</p><p>Bounces nine times across the water.</p><p>He turns.</p><p>A flock of bird-creatures stand on the bank, long-legged, blue-feathered, smug. They have piles of stones in front of them and a tiny scoreboard etched into a piece of slate. They are taking turns throwing.</p><p>The biggest one, tall as Kellen's knee, with white markings around her eyes, notices him.</p><p>\"Kid,\" she says. \"This is a CHAMPIONSHIP game. You can watch from over there.\" She points with one wing at a flat rock thirty feet away.</p><p>Just him. He likes it. He always plays better when there's nobody watching him pretend not to think. The lake is enormous. The wind is good. The birds don't know him yet. He can be all of himself before anyone has decided who he is.</p><p>Kellen says, \"I'd like to play.\"</p><p>All the birds laugh.</p><p>The biggest bird says, \"This game requires SKILL. And STRATEGY. Most kids only have one or the other. Possibly neither.\"</p><p>Kellen says, \"I'll take that bet.\"</p><p>The bird looks intrigued. \"It's not a bet. It's a CHALLENGE.\"</p><p>Kellen picks up a stone. He doesn't say anything else. He weighs it in his palm. He turns it over. He checks the flat side against his thumb.</p><p>The biggest bird watches him do this. Her name, Kellen will learn, is Skim. She is the kind of bird who notices a person's hands before their face.</p><p>\"Hmm,\" she says.</p><p>Kellen doesn't look up.</p><p>\"FINE,\" Skim says. \"The game is called Pattern Skip. I call a pattern. You throw a stone that follows it. Three approved skips, two long, a curve, a stop. That kind of thing. Seven approved patterns. We use them in CHAMPIONSHIP order. You miss one, you sit out.\"</p><p>Kellen nods.</p><p>He doesn't say <em>I'll take that bet</em> again. He doesn't need to.</p>", "next": 151, "arrival": "kellen"}, "151": {"id": 151, "title": "The Whole-self Moment", "html": "<p>Skim hops over (it is more of a hop, with her wings folded behind her like a tiny field general). She holds two stones in her beak.</p><p>She sets them in front of Kellen.</p><p>\"Pick the throwing one.\"</p><p>Kellen looks at them. They look identical to anyone else. They are not identical to him. The one on the left is slightly flatter on the bottom, better skip surface. The one on the right is heavier, better distance but worse curve.</p><p>He picks the one on the left.</p><p>Skim nods, once. She picks up the heavier stone and skips it across the lake. Nine bounces, then a curve, then a stop. She does this without looking.</p><p>Then she does something weird. She picks up the <em>flatter</em> stone, the one Kellen would have used, and deliberately throws it badly. The stone skips twice, wobbles, sinks.</p><p>She turns to him.</p><p>\"That's how it goes if I only use my throwing arm. If I forget the rest of me. Did you see?\"</p><p>Kellen did see.</p><p>\"I've been doing this for forty years,\" she says. \"You know what I see most? Kids who hide one of their halves. Athletes pretending they're not smart. Smart kids pretending they're not athletic. They think they have to pick. They think people will tease them if they're both.\"</p><p>She tilts her head at him. \"You're both. I saw your hand on that stone. I saw you read it. Don't hide it. Eyes, hands, thinking, instinct. The whole kid. Yes?\"</p><p>Kellen is quiet for a longer time than he expected to be.</p><p>Skim is the first creature in a year who has looked at him and seen <em>both</em> halves and decided the both was the good part.</p><p>He says, quietly: \"Nobody ever asks for both. The world wants you to pick a lane.\"</p><p>Skim nods, like she expected this. \"I know. The world is wrong. You don't have to pick anything here.\"</p><p>She tilts her head. \"One more thing. A kid doesn't practice a throw forty thousand times in his own head for nothing. You <em>love</em> it. Say that part out loud, the loving part. People who get good at things get so busy being good they forget to say they love it.\"</p><p>Kellen looks out at the far island, the one he's been hitting in his head all day. \"...I love it,\" he says. It comes out smaller and realer than he meant. \"More than almost anything.\"</p><p>Skim's voice softens. \"There he is. That's the whole kid. The arm AND the heart. Don't hide either one.\"</p><p>Kellen swallows.</p><p>\"Yes,\" he says. He means it this time.</p><p>Skim hops back another step. Her voice goes formal. \"You are Kellen the Whole, child. The kid who plays with both halves of himself at once. We do not see many of you. Carry that name.\"</p><p>He picks the throwing stone. He is, for the first time in a year, all the way in his own body.</p>", "next": 152}, "152": {"id": 152, "title": "Kellen's Choice", "html": "<p>Skim raises a tiny wing-flag.</p><p>\"Kid. How do you want to begin?\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Say \"the first approved pattern. Show me,\" and start working through the seven", "target": 153}, {"label": "Say \"Skim, you go first, let me watch how YOU do it,\"", "target": 154}, {"label": "Say \"what happens if I invent a new pattern?\"", "target": 155}]}, "153": {"id": 153, "title": "Play the Seven Patterns", "html": "<p>Kellen says, \"First approved pattern. Show me.\"</p><p>Skim calls it. <em>Three short, two long, one stop.</em></p><p>Kellen throws. The stone goes <em>short short short, long long, stop.</em> It sits on the surface of the water for a moment before sinking.</p><p>The birds blink.</p><p>Skim calls the second. <em>Two long, a curve right, a curve left, two short.</em> Kellen throws. The stone obeys.</p><p>Third. Fourth. Fifth. Sixth.</p><p>By the seventh pattern, the birds are no longer laughing. One of them is taking notes on a slate with a tiny pencil. Two others have their heads tilted in the same direction.</p><p>Kellen plays clean. He doesn't show off. He doesn't add anything that wasn't asked for. He just <em>does the patterns,</em> one after another, exactly the way they're called.</p><p>When he finishes the seventh, the bank is silent.</p><p>Skim hops over. She's holding a flat stone, the color of slate.</p><p>\"This stone,\" she says, \"always skips true. It does what you tell it. Skip on water, dirt, paper, glass, anything flat enough to bounce off of. Don't waste it. Don't throw it because you're bored. Throw it when it matters.\"</p><p>Kellen pockets the stone.</p><p>Skim says, \"And kid, you played with your WHOLE self. You didn't pretend either half wasn't there. That is rare. Most adults have forgotten how to do it.\"</p><p>Kellen says, \"I'll try not to forget.\"</p><p>Skim nods once.</p><p><em>If the reader has played Carson's branch, a baby mammoth thunders past on a distant ridge, briefly visible. Skim follows it with her eyes. \"That one runs because she loves it,\" she says. \"Same as you throw because you love it. Different shape, same thing.\"</em></p><p>Kellen walks back to his raft. The birds part for him without him asking.</p>", "next": 156, "depth": "SILVER"}, "154": {"id": 154, "title": "Ask Skim to Go First", "html": "<p>Kellen says, \"Skim. You go first. Let me watch.\"</p><p>Skim's head tilts. The other birds make small surprised sounds. Skim has been the lead thrower for forty years and nobody has <em>ever</em> asked her to demonstrate first. They have all wanted to prove themselves immediately.</p><p>She likes this kid.</p><p>She steps to the line. She rolls her shoulders. She takes a stone, Kellen notices she chose it on weight, not on look, and throws it in the FIRST pattern. <em>Three short, two long, one stop.</em> The stone behaves perfectly. It is a small, neat demonstration.</p><p>Kellen watches her hand. He watches her hip. He watches where her eyes land before she throws.</p><p>She does pattern two. He watches.</p><p>Pattern three. He watches.</p><p>By pattern four she stops mid-throw and looks at him sharply. \"You're learning faster than I'm teaching.\"</p><p>Kellen shrugs. \"You're a good teacher.\"</p><p>\"I am NOT a teacher. I am a CHAMPION.\"</p><p>\"Then you're a champion who can also teach.\"</p><p>Skim is quiet for a second.</p><p>Then she does something she has not done in front of the flock in twenty years: she compliments a thrower out loud. \"Kid. Throw the patterns. All seven. <em>Your</em> way.\"</p><p>Kellen throws. He does all seven patterns. He uses what he learned from watching her, the weight check, the hip turn, the eye-land. He executes cleanly. He adds nothing flashy.</p><p>The seventh pattern, he places the stone so it ends balanced on its edge on the shore.</p><p>The flock falls silent.</p><p>Skim hops over. Her stone, the slate-grey one, is in her beak. She lays it at Kellen's feet.</p><p>\"I have given this to four throwers in forty years,\" she says. \"Two of them used it well. Two of them lost it. You will use it well. I can already tell.\"</p><p>Kellen pockets the stone. He says, \"Thank you, Skim.\"</p><p>Skim says, \"And kid. The next time you go to the lake-up-above and someone asks you to play a game with rules, there's a man with clipboards, yes? I have been HEARING about him. The next time he comes around, I'll come too. If you want me.\"</p><p>Kellen says, \"I want you.\"</p><p>Skim's flock erupts in tiny dignified bird-cheering. They are all secretly delighted to be invited somewhere.</p><p><em>Far off, a long deep hum rolls across the lake. Skim's wings twitch. \"Standing Stones. They're applauding something. Hasn't happened in a hundred years.\" She does not explain.</em></p><p>Skim flies a small loop above Kellen's head as he walks to his raft. The other birds line the bank like an honor guard. The smallest one trips over its own feet and laughs.</p>", "next": 156, "depth": "CROWN"}, "155": {"id": 155, "title": "Invent a New Pattern", "html": "<p>Kellen says, \"What happens if I invent a new pattern?\"</p><p>The birds laugh, automatic, dismissive. Skim does not laugh.</p><p>Skim says, in a slow voice, \"Nobody has invented a new pattern in three hundred years.\"</p><p>Kellen says, \"Why not?\"</p><p>\"Because the SEVEN are perfect. They are HISTORICAL. They are APPROVED.\"</p><p>\"By who?\"</p><p>The birds open their mouths to answer. Then they close them. Then they look at each other. Then they look at Skim.</p><p>Skim is quiet for a long moment.</p><p>She says, \"I don't actually know. Nobody does. They've just always been the seven.\"</p><p>Kellen nods.</p><p>He picks up a stone. He weighs it. He turns it over. He doesn't say anything for a while.</p><p>Then he says, \"I'm going to call it <em>the mirror.</em>\"</p><p>Skim leans in. \"The what?\"</p><p>\"You throw a pattern. I throw a pattern that mirrors it. Whatever you do, I do reversed. You go three skips and a curve right, I do three skips and a curve left. We make a pattern together that neither of us could make alone. You game?\"</p><p>Skim does not move for ten full seconds.</p><p>Then she says, \"Throw.\"</p><p>She picks her stone. They walk to the line together.</p><p>Skim throws first. <em>Three short, a curve right, a long, a stop.</em></p><p>Kellen throws second. <em>Three short, a curve LEFT, a long, a stop.</em> The stones land beside each other on the same flat patch of water, mirroring across an invisible line.</p><p>Skim trumpets, for a small bird, she has enormous lungs. The flock goes absolutely silent.</p><p>They throw it again. Harder pattern. Mirror. Again. Mirror. Again.</p><p>By the fourth round, Kellen is laughing out loud and Skim is making a sound that is not quite a bird laugh but is close enough.</p><p>The smallest bird in the flock, the one who trips over its own feet, says quietly: \"<em>We have eight patterns now.</em>\"</p><p>The other birds turn slowly toward Kellen.</p><p>Skim says, with the gravity of a coronation: \"Kid. We have <em>eight</em> patterns now. The Mirror is the eighth. It is named after you.\"</p><p>Kellen blushes red to the tips of his ears.</p><p>Skim hops to the pile of slate. She returns with the True-Skipping Stone in her beak. She lays it in his palm. Then, and this surprises the entire flock, she lays a second stone next to it. A smaller one, white-flecked. \"From me. Personally. For when you need a backup.\"</p><p>She says, \"When you go back to that man with the clipboards, I'm coming. <em>We're</em> coming. Whole flock. We owe you a debt and we settle our debts.\"</p><p><em>A small bright shape gallops across the high air above the lake, a unicorn, glimpsed for two seconds, with a small boy on her back. Skim watches it go. \"Oh,\" she says. \"There's another one of those today.\"</em></p><p>The flock lines the bank. They bow as Kellen walks past. The smallest one trips over its own feet again. Kellen catches it gently and sets it upright. The smallest one is in love with him forever.</p>", "next": 156, "depth": "CROWN"}, "156": {"id": 156, "title": "Exit", "html": "<p>The racing canoe is where Kellen left it. The stones in his pocket clack softly against each other.</p><p>He has the stone. He has, somewhere in his chest, the new and weird feeling that he doesn't have to hide either half of himself anymore.</p><p>The flock has flown ahead. The smallest bird circles back to wave once.</p><p>Kellen pushes off. As he paddles, he says it once to himself, out loud, to make sure he doesn't forget:</p><p>\"<em>Played whole. It worked.</em>\"</p><p>That's the line. That's the line he is going to remember when he is fifteen, and twenty, and forty. The line that finally tells him the truth about himself.</p><p>He paddles toward the sound of the C-130, faint and far, somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "160": {"id": 160, "title": "Arrival at the Painted Cliff", "html": "<figure class=\"illus\"><img src=\"images/kiera_region.webp\" alt=\"Arrival at the Painted Cliff\" loading=\"lazy\"></figure><p>Kiera's raft slides up to the foot of an enormous cliff. Her raft is now a flat wooden raft with a small easel bolted to it, brushes in a leather holder, and paints in glass jars. The colors are colors Kiera doesn't have names for. She wants names for them immediately.</p><p>The cliff in front of her is gigantic. Black basalt, columns rising hundreds of feet up. The columns are perfectly hexagonal, the way good basalt always is. The shadows between them are darker than shadows should be.</p><p>She tilts her head.</p><p>The cliff has a face.</p><p>She tilts the other way.</p><p>The cliff is <em>breathing.</em></p><p>Just her and the cliff. Her hands are already itching for a brush. The silence here is a different silence, the silence of something asleep, breathing. She has never been alone in a place this big. She finds, to her own surprise, that she likes it. She has been waiting her whole life to look at something this size without someone telling her to hurry up.</p><p>She steps off her raft. The cliff doesn't move. But she can hear something, a small sound. Like... snoring? But the snore is <em>colored.</em> She can see the color of the snore in the air. Pale blue, with flecks of orange.</p><p>She blinks. She still sees the colors.</p><p>A small voice from somewhere says, \"You're not supposed to be able to see that.\"</p><p>Kiera looks around. There's nobody.</p><p>The voice says, \"I'm UP HERE. Look at the third column from the left.\"</p><p>She looks. The third basalt column has eyes. The eyes are closed.</p><p>The cliff is asleep.</p><p>He has been asleep, she figures out, for a very long time.</p><p>He says (without opening his eyes), \"I haven't had a visitor in five hundred years. Are you a visitor or are you a dream? I get them confused.\"</p><p>Kiera says, \"I'm a visitor.\"</p><p>The cliff says, \"<em>Wonderful.</em> Could you do me a favor? I would very much like to wake up.\"</p><p>Kiera says, \"How?\"</p><p>The cliff says, \"I don't know. I've been trying for centuries. Maybe a fresh perspective.\"</p><p>He yawns. The yawn is purple.</p>", "next": 161, "arrival": "kiera"}, "161": {"id": 161, "title": "The Both-at-once Moment", "html": "<p>Before Kiera even picks up a brush, the cliff opens one eye, just a crack.</p><p>He looks at her. Closes it again.</p><p>\"Huh,\" he says.</p><p>Kiera says, \"What?\"</p><p>\"You have an artist's eye. I can see it. But you ALSO have a climber's body. Long limbs, strong shoulders, hands that already know rock. I can see THAT too. Most visitors are one or the other. You're both. All the way down.\"</p><p>Kiera shrugs. \"I just like to do everything.\"</p><p>\"That is RARE,\" the cliff says. He sounds delighted. \"Most of the world makes you pick. Most of the world tells the artist to stop climbing and the climber to stop painting. <em>You haven't picked.</em> I can tell. Don't ever pick.\"</p><p>Kiera doesn't know what to say. She feels her face get warm in a way that's pleasant.</p><p>People have been telling her she's <em>good for an artist</em> or <em>good for a kid</em> her whole life. The world keeps telling kids to pick one thing and be that. Nobody had told her, until now, that she gets to be everything she is all at once.</p><p>\"Okay,\" she says.</p><p>\"Good,\" the cliff says. \"Now. Please paint me awake. I have been BORED for two hundred of the last five hundred years and I would like to see the sky again.\"</p><p>\"And one more thing, child,\" Cliffy says, his enormous bark face turned toward her. \"You are Kiera Both-at-Once. Artist AND climber. The cliff will remember that you refused to pick. So should you.\"</p><p>He yawns purple.</p><p>Kiera opens her paint jars.</p><p>The paints inside <em>move</em> when she opens them. They lean toward her. They are excited to be used.</p><p>She picks up a brush.</p>", "next": 162}, "162": {"id": 162, "title": "Kiera's Choice", "html": "<p>The cliff yawns one more time. The yawn is now lavender with green flecks. The colors drift.</p><p>He says, \"How would you like to begin?\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Say \"I'll just start painting and see what happens,\"", "target": 163}, {"label": "Say \"what do you want to be painted AS?\"", "target": 164}, {"label": "Say \"I'm going to climb up first, I want to see what you've been dreaming,\"", "target": 165}]}, "163": {"id": 163, "title": "Just Start Painting", "html": "<p>Kiera shrugs and picks up the orange. The orange leaps out of the jar. She catches it with the brush. It is <em>eager.</em></p><p>She paints. Fast. The way she paints when nobody is watching, wide strokes, no plan, the colors deciding their own next move. The orange leads. The blue follows. A green she doesn't recognize joins in halfway through.</p><p>The cliff is purring now. Each stroke wakes him a little more. His snore has stopped. His breathing has slowed.</p><p>She gets to his eyes, they are thirty feet up.</p><p>She climbs.</p><p>This is the part of the chapter that should celebrate Kiera's other half. She's been jumping off the small cliff with the older boys for two summers. She studies the seams in the basalt. She finds the cracks where her fingers will fit. She goes up.</p><p>The mouse with spectacles (a tiny creature who has materialized on a ledge and is keeping notes in a tiny book) watches her with both paws over its mouth.</p><p>She reaches Cliffy's eye. She paints a small ring of color around it. Then a small ring around the other. She perches on his cheekbone.</p><p>She says, \"Okay. Open.\"</p><p>Cliffy opens his eyes.</p><p>The cliff has eyes.</p><p>He looks at her. She looks at him. He smiles. The whole cliff face smiles.</p><p>She climbs down. Slowly. Carefully. She gets to the bottom.</p><p>Cliffy reaches into his basalt chest and pulls out a small brush. The brush is wood, with a tip made of light.</p><p>\"This,\" he says, \"is a Truth Brush. You don't paint with it. You look through it. Anything hidden becomes visible. Lies turn yellow. Truth glows blue.\"</p><p>Kiera takes it. It fits in her pocket.</p><p>The mouse with spectacles writes the climb into the cliff's history book. He is, she will learn later, the official biographer of Cliffy. He has been waiting for something to record for two hundred years.</p><p><em>If the reader has played Reid's branch, the mouse pauses and adds a note: \"tree-being walking, west side.\" He shows it to her. \"He doesn't usually walk,\" the mouse says. \"Big day.\"</em></p><p>She climbs onto her raft. Cliffy waves. The mouse waves. The paints in her jars settle.</p>", "next": 166, "depth": "SILVER"}, "164": {"id": 164, "title": "Ask What He Wants", "html": "<figure class=\"illus\"><img src=\"images/canyon_waking.webp\" alt=\"Ask What He Wants\" loading=\"lazy\"></figure><p>Kiera says, \"What do you want to be painted AS?\"</p><p>Cliffy is quiet for a very long time.</p><p>He says, \"Nobody has ever asked me that.\"</p><p>She waits.</p><p>He says, slowly, \"I don't think I know what I look like. I've been asleep so long. What does the world look like now? What's NEW? What would I want to wear?\"</p><p>Kiera sits down on a flat rock at his foot. She leans against him. He is cool and steady. She thinks.</p><p>\"What about... kindness?\" she says. \"What does kindness look like? I'll paint that.\"</p><p>Cliffy goes very still.</p><p>\"Kindness,\" he says. \"I haven't thought about that in five hundred years. I... think kindness looks like... one hand reaching toward another hand. Yes? Is that right?\"</p><p>Kiera nods. She thinks so. She thinks that's exactly right.</p><p>She paints. Up his basalt forearm, a long curving stroke of warm gold, a hand. Up his other forearm, the other hand, reaching. She paints them so the fingertips don't quite touch. They are reaching, always reaching, never finishing the reach. The reach is the thing.</p><p>When she steps back, Cliffy is crying.</p><p>His tears are pale blue paint. They drip down his basalt face and pool at his feet. He is overwhelmed.</p><p>\"That is the most beautiful thing,\" he whispers, \"that has ever been on me.\"</p><p>She climbs to his eyes. She is not afraid. Her hands know which seams in the basalt will hold and her feet follow. She paints a small ring around each. She perches on his cheekbone.</p><p>\"Open.\"</p><p>He opens his eyes.</p><p>He looks down at his own arms. He sees the hands. He sees them reaching toward each other.</p><p>He cries again. More blue paint.</p><p>He pulls a Truth Brush out of his basalt chest and gives it to her. This one is older, more worn, the wood polished by something Kiera can't quite see.</p><p>\"This is mine. It was my mother's. She was a cliff too. You should have it. You earned it.\"</p><p>Then he says, very quietly: \"I cannot leave this place. I am stone in this ground. But, if you call my name from somewhere with stone, my <em>attention</em> will travel. I will be there in spirit. The basalt around your home will notice. The man with the clipboards, he won't see me. But he will feel watched. That is all I can offer.\"</p><p>Kiera says, \"That's a lot.\"</p><p>Cliffy says, \"It is what I have.\"</p><p><em>Three operatic notes carry across the canyon. Cliffy's whole face turns toward the sound. \"That woman has been singing here for as long as I've been awake,\" he says. \"Wait, I just woke up. As long as I was asleep. She sang to me. I always thought I was dreaming her.\"</em></p><p>She climbs down. He bows slightly. The mouse with spectacles is writing furiously.</p>", "next": 166, "depth": "CROWN"}, "165": {"id": 165, "title": "Climb First", "html": "<p>Kiera looks up the cliff face. Up. Up. Up.</p><p>She says, \"I'm going to climb up first. I want to see what you've been dreaming.\"</p><p>Cliffy makes a sound that is somewhere between a yawn and a laugh.</p><p>\"Climb me? CLIMB me? No one climbs me. I am a CLIFF. I am hundreds of feet tall.\"</p><p>Kiera is already climbing.</p><p>She finds the seams. The basalt is forgiving. The columns are perfectly hexagonal and her fingers know exactly where to wedge. She climbs steadily, not fast, not slow, the way she climbs the rocks at home, the way she climbs the small cliff the older boys jump off.</p><p>She is fifty feet up before Cliffy realizes she is <em>actually doing this.</em></p><p>He goes very still so as not to dislodge her.</p><p>\"Child,\" he says, very carefully. \"What are you doing.\"</p><p>\"Climbing.\"</p><p>\"You are a CHILD.\"</p><p>\"I climb everything at home. Ask anybody.\"</p><p>She keeps going. The mouse with spectacles is at the base of the cliff, biting his tiny knuckles. The paints in their jars are watching her too.</p><p>A hundred feet. Two hundred. Three hundred. She gets to a ledge near his eyes and stops. She sits on it. She catches her breath.</p><p>The view from up here is not the view from below.</p><p>She can see what Cliffy has been dreaming. The canyon, the whole canyon, has color <em>in the rock.</em> Veins of blue. Veins of orange. Streaks of green where the basalt should be black. The color is <em>there,</em> under the surface, invisible from the ground. The cliffs have been dreaming color this whole time and the color is still in them, waiting.</p><p>\"Oh,\" Kiera says. \"Oh.\"</p><p>Cliffy says, quietly, \"You see them.\"</p><p>\"You're SO COLORFUL.\"</p><p>\"I forgot. I'd forgotten. For so long I was just black rock to everyone. I forgot the color was still in me. Even I had stopped seeing it.\"</p><p>Kiera opens a jar of paint she brought up clipped to her belt. She paints around his eyes. She uses the colors she sees in the rock, <em>his</em> colors, the ones he forgot. Blue. Orange. Green.</p><p>\"Open,\" she says.</p><p>He opens his eyes.</p><p>And the canyon WAKES.</p><p>Color floods up the cliff face. Every basalt column from the water to the sky lights up, blue veins, orange streaks, green ribbons. The whole canyon, both walls, miles of basalt, turns colored at once. It is <em>enormous.</em> It is the size of the whole world.</p><p>Kiera can hear, faintly, every basalt cliff in The Old Roar starting to hum. The wakeup is contagious. Cliffs that have been asleep for thousands of years are stretching.</p><p>And then she sees something nobody else will ever see.</p><p>For one second, just one, there is a <em>face</em> in the canyon wall opposite. Made of veins. Blue and orange. A woman's face, the basalt arranged like cheekbones, the orange streaks shaped like an open mouth. The face is singing. Kiera can't hear it from this far, but she can see the shape of the singing, the mouth open, the throat working, the face full of the joy of a person who didn't know anyone was listening.</p><p>The face fades into ordinary colored rock.</p><p>Kiera does not tell anyone. She knows already that this was meant for her. She has the artist's eye. The lake had been waiting for someone with an artist's eye to <em>notice.</em> Someday, maybe at home, maybe at this lake, maybe many summers from now, she will hear that face singing for real. She will know who it is. She will not say.</p><p>The mouse with spectacles drops his pen.</p><p>Cliffy, very slowly, raises a hand to his face and feels his own colored cheekbones.</p><p>He says, \"You woke up the WHOLE CANYON.\"</p><p>Kiera says, \"You were already this colorful. I just looked.\"</p><p>He carries her down, gently, his hand the size of a small house. He sets her on her feet. He pulls a Truth Brush from his chest and hands it to her. The light at the tip is brighter than the other versions. It looks like a small contained sunrise.</p><p>\"I am COMING with you,\" he says. \"I am going to walk to the lake-up-above. I am a CLIFF. This will take many hours. I will be slow. I do not care. I am coming. The basalt around your cove is my family. I want to stand with my family.\"</p><p><em>A small bright shape gallops along a ridge of the freshly-colored canyon, glimpsed for two seconds, a unicorn with a small boy on her back. Cliffy laughs (the laugh is enormous and colored). \"There's the boy who never stopped believing,\" he says. \"He's part of this. Good.\"</em></p><p>Kiera climbs onto her raft. Behind her, miles of basalt are humming in color. The paints in her jars are leaping with joy.</p>", "next": 166, "depth": "CROWN"}, "166": {"id": 166, "title": "Exit", "html": "<p>The raft is waiting. The paints settle. The Truth Brush sits in her pocket warm against her thigh.</p><p>She has the Brush. She has, somewhere behind her ribs, the new and powerful feeling that the world has been more colorful all along than she'd been allowed to see.</p><p>She paddles toward the sound of the C-130, faint and far, somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "170": {"id": 170, "title": "Arrival at the Bright Water Court", "html": "<figure class=\"illus\"><img src=\"images/ella_region.webp\" alt=\"Arrival at the Bright Water Court\" loading=\"lazy\"></figure><p>Ella's raft slides up onto a moss circle. The raft is now a small wooden boat with golden trim and a velvet seat. The velvet is dark green and the gold is real gold. She steps off, very carefully, because the gold trim catches the sun.</p><p>A frog in a tiny crown bows to her.</p><p>\"Princess.\"</p><p>Ella says, \"Princess?\"</p><p>The frog says, \"Your boat has GOLDEN TRIM. Only royalty have golden trim. We've been EXPECTING you.\"</p><p>Ella looks at her boat. It really does have golden trim.</p><p>Just her. She likes it. She likes the silence. She's the youngest, so most days she's the one watching the bigger kids and waiting her turn. Here she gets the turn. (She's also the fastest swimmer of the little ones, first off the dock every morning, never once scared of the cold, though nobody up here knows that yet.) She sits up straight without thinking. She makes her face the deciding face without knowing yet that's what it's called.</p><p>She follows the frog into the glade. There are more frogs. There's a tiny throne in the middle, made of mossy stone. On the throne sits a girl Ella's age, wearing a crown that is slipping over one eye.</p><p>The girl is gripping the arms of the throne. Her knuckles are white.</p><p>The frog announces, \"Princess Ella, daughter of the Lake-Up-Above, attending Her Majesty Queen Marigold of the Bright Water.\"</p><p>Marigold looks up. She is <em>very</em> stressed.</p><p>\"Hi,\" she whispers. \"I've been queen for one week and I am pretty sure I am BAD at it. Please help.\"</p><p>The frogs erupt into argument. They are arguing about whether the new princess (Ella) should sit on the throne. Each frog has a different opinion. Each frog is LOUD. One frog is yelling at another frog about <em>protocol.</em> Two more frogs are yelling about whether the protocol-yelling frog is following protocol.</p><p>Marigold whispers, \"They argue about EVERYTHING.\"</p><p>Ella looks at the frogs.</p><p>Ella has TWO older cousins who do this.</p><p>She knows exactly how to handle it.</p>", "next": 171, "arrival": "ella"}, "171": {"id": 171, "title": "The Not-the-dress Moment", "html": "<p>Marigold scoots over on the throne. There's room for two. Ella sits beside her.</p><p>Then Marigold does something Ella doesn't expect.</p><p>Marigold takes off her crown.</p><p>She holds it out in her cupped hands and looks at it. She is just a frightened girl with stringy hair and a too-big robe. She does not look like a queen. She looks like Ella's friend Maya from the third row of her class, who is usually a little overwhelmed but always tries.</p><p>Marigold puts the crown back on. Now she looks like a queen again.</p><p>Then she takes Ella's hand and puts it on the crown on her head.</p><p>\"Feel that?\"</p><p>Ella feels the crown. It is warm. It is just metal.</p><p>\"That's all it is,\" Marigold says. \"Metal and shine. It's not what makes the queen. Watch.\"</p><p>She takes the crown off again. She sets it on a frog's head. The frog looks ridiculous.</p><p>The frog does not act ridiculous. The frog stands up straighter. The frog clears his throat. The other frogs stop arguing for a second and look at him. He says, in a small uncertain voice, \"...we should, order? Maybe?\"</p><p>It works for about three seconds before the other frogs erupt back into argument.</p><p>Marigold takes the crown back. She puts it on her own head.</p><p>\"See? It almost worked. The crown does <em>some</em> of the work. But only some. The rest is whether the person under it <em>decided.</em> The frog hadn't decided. Most adults haven't decided. That's why crowns mostly don't work.\"</p><p>She looks at Ella.</p><p>\"I think <em>you</em> decide. That's why I knew you were a princess before you stepped off your boat.\"</p><p>Ella sits up straighter.</p><p>Marigold lowers her voice. \"And, child, you are Ella the Deciding Face. The crown is just the proof. People listen because of the face, not because of the metal. Remember that name.\"</p><p>\"The fox is coming. Now you'll see.\"</p>", "next": 172}, "172": {"id": 172, "title": "Ella's Choice", "html": "<p>The double-doors of the court (which are really two large lily pads on hinges) slam open.</p><p>A fox-creature strides in. He is much bigger than the frogs. He is carrying a scroll. He looks confident.</p><p>Behind him, hiding under a fern, is a tiny water-creature, round, soft, frightened, with a clutch of small eggs huddled at her feet. The egg-mother. She is shaking.</p><p>Marigold says, \"Oh no.\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Take the throne and give Marigold advice from the royal chair", "target": 173}, {"label": "Stand up, walk past Marigold, and step between the fox and the fern", "target": 174}, {"label": "Tell Marigold \"you don't have to do this alone, I'll be queen WITH you,\"", "target": 175}]}, "173": {"id": 173, "title": "Give Advice", "html": "<p>Ella takes the throne next to Marigold.</p><p>She whispers advice. Marigold listens. The fox unrolls his scroll and starts reading territorial claims in a smooth confident voice. Marigold counters him, using Ella's words, and the fox's claims wobble. The court frogs jump back and forth, taking notes, occasionally yelling about a misplaced clause.</p><p>Ella does well. She's smart in court. She knows when to push and when to soften. She helps Marigold get through the case.</p><p>In the end, the fox loses his bid (mostly because Ella spotted a forged seal at the bottom of his scroll) and bows out grumpily. The egg-mother is safe. The frogs cheer. Marigold thanks Ella with both hands clasped.</p><p>Marigold takes off the crown and produces another from her pocket. \"It's our court tradition. The queen always carries two, one to give, when the right person comes. You are the right person.\"</p><p>She places the crown on Ella's head. It fits perfectly. The crown becomes invisible the moment it's settled, only Ella can see it (and Marigold, and anyone who deserves to).</p><p>Marigold says, \"Now you're a Queen of the Bright Water too. If you ever need us, call my name. We will hear it across worlds.\"</p><p>Ella curtseys. Marigold curtseys back. The frogs erupt in tiny ceremonious clapping.</p><p><em>If the reader has played Carson's branch, a small mammoth baby's trumpet carries faintly from somewhere across the plains. The smallest frog says, \"Was that, Tuft?\" The other frogs argue about whether it was Tuft or Tumble. They argue about this for the rest of the day.</em></p><p>Ella walks back to her boat. She is wearing an invisible crown that she alone can see. It feels exactly right on her head.</p>", "next": 176, "depth": "SILVER"}, "174": {"id": 174, "title": "Step Between the Fox and the Fern", "html": "<p>Ella stands up.</p><p>She walks down the throne steps. She steps between the fox and the fern.</p><p>She is small. The fox is twice her size.</p><p>The fox tilts his head and smiles a smooth fox smile. \"Move along, little princess. The grown-ups are talking.\"</p><p>Ella does not move.</p><p>She says, in a voice that is small but is also <em>exact:</em> \"You will NOT take her home.\"</p><p>Three things happen at once.</p><p>The water in the moss circle goes flat. Not still, <em>flat,</em> like a lid was pressed onto it from above.</p><p>The frogs in the court, every last one, even the loudest, even the protocol-yelling ones, stop arguing. They all turn at the same time and face Ella. They are no longer her audience. They are now her <em>court.</em></p><p>And the egg-mother under the fern, who has been afraid all morning, takes the smallest deep breath she has taken in days. It is the breath of a creature who has just heard somebody, <em>finally,</em> say the thing she could not say for herself.</p><p>The fox blinks. He starts to laugh. The laugh stops in his throat because Ella is <em>not blinking back</em> and because everything in the room has just decided to be on her side.</p><p>Behind her, Ella hears the smallest sound from the egg-mother, a tiny relieved breath.</p><p>The fox tries again. \"Princess, the scroll is LEGAL. It is signed. It is BINDING.\"</p><p>Ella says, \"Show me where it's signed.\"</p><p>The fox shows her. He shows her the bottom of the scroll. The signature is florid and large.</p><p>Ella looks at it. She has a little cousin who forges his name on permission slips and she knows exactly what forged ink looks like, the way the pen lingers at the start of the curve, the way the loops are too perfect. This scroll has been forged.</p><p>She says, loudly enough for the court to hear: \"This is a fake. The signature was added later. Look at the way the ink sits ON TOP of the seal instead of UNDER it. He drew it after the seal was already pressed.\"</p><p>The frogs lean in. They all look. They all see it now.</p><p>The fox starts to back up.</p><p>Ella says, still not blinking, \"You will leave. You will not come back. You will not bother the egg-mother again. If you do, the Bright Water Court will know, and I will know, and we will FIND you.\"</p><p>The fox bows. He drops the scroll. He leaves so fast his tail bumps a frog in the head.</p><p>The frogs cheer.</p><p>The egg-mother comes out from under the fern. She is much smaller than the fox made her seem, a creature about the size of Ella's two palms together, with kind soft eyes and a chorus of tiny round eggs clinging to her back. She bows so low her forehead touches the moss.</p><p>\"Princess. Thank you.\"</p><p>Ella kneels (which is hard in golden boat-trim shoes but she manages it) and says, \"You can come home. Nobody else is taking it. I promise.\"</p><p>The egg-mother says, very softly, \"If you ever need us. Anywhere. The whole egg-chorus and I will sing for you. We sing one note all at once. It is, it is quite something. People stop and listen.\"</p><p>Marigold has been silent on the throne, watching all of this. Now she stands.</p><p>\"Princess Ella. You have just protected the Bright Water. You are no longer a guest in this court. You are a Queen of the Bright Water.\" She steps down. She places a second crown on Ella's head. \"And the egg-mother and her chorus go with you. As does my royal herald. The full strength of the court is yours.\"</p><p>The frog herald (a small dignified frog in a sash) bows.</p><p><em>A long ribbon of color drifts across the sky above the court, blue, orange, green, that hadn't been there before. The egg-mother looks up. \"The painter girl. She's been at the cliff. The basalt is waking up. We have not seen the basalt wake up in a hundred years.\"</em></p><p>Ella walks back toward her boat. The herald hops along beside her. The egg-mother (and twelve tiny rolling eggs) follow.</p>", "next": 176, "depth": "CROWN"}, "175": {"id": 175, "title": "Co-rule", "html": "<p>Before the fox can finish his bow, Ella turns to Marigold.</p><p>\"You don't have to do this alone.\"</p><p>Marigold looks at her sideways.</p><p>Ella says, \"I'll be queen WITH you. Both of us. Two queens. The fox can't talk circles around two of us at once.\"</p><p>Marigold blinks. Her crown slides a little further over her eye.</p><p>\"...Can you DO that?\" she whispers.</p><p>Ella shrugs. \"Why not. It's your court. You make the rule.\"</p><p>Marigold sits up straight for the first time all day.</p><p>She looks at the court. She looks at the herald. She announces, in a voice she has not used before: \"<em>Court of the Bright Water. From this hour forward, Princess Ella is named Co-Queen. We rule together.</em>\"</p><p>The frogs go absolutely silent.</p><p>Then they erupt in argument. Six frogs argue about whether co-rule is in the precedents. Three frogs argue about whether the announcement was properly worded. One frog faints from excitement.</p><p>The fox tries to interrupt.</p><p>Both queens turn to him at once.</p><p>The fox stops talking.</p><p>Marigold and Ella handle the case together. They sit on the throne side by side, there's barely room, and they tag-team the fox. Marigold knows the law. Ella knows the lying. The fox crumples under both at once. He bows out faster than he came in.</p><p>The egg-mother is safe. The court is calm. The frogs are still arguing but they're now arguing about <em>whether</em> to applaud, which is at least an upgrade.</p><p>Marigold turns to Ella. She is smiling like she hasn't smiled in a week.</p><p>\"That was the best court session in the history of the Bright Water.\"</p><p>She reaches under the throne and pulls out a small wooden box. Inside is the second crown. She places it on Ella's head and Ella places her own (she'd been wearing a small Sun Lakes hair ornament) onto Marigold's. They've traded.</p><p>Marigold stands.</p><p>\"I declare the Bright Water Court allied to Hotel Sun Lakes. Forever. Any threat to the cove is a threat to us. We will send our herald immediately if a man with clipboards ever sets foot on that dock.\"</p><p>She turns to the frog herald. \"<em>Go. To the lake-up-above. Bring the alliance proclamation. Stand with Co-Queen Ella when she needs you.</em>\"</p><p>The frog herald produces a tiny scroll, bows three times, and hops off into a small pool that turns out to lead, somehow, to the world above.</p><p>Marigold gives Ella the formal queen-greeting (a kiss on each cheek). The frogs do their best to cheer. The smallest frog faints again.</p><p><em>If the reader has played Aiden's branch, a small bright shape passes through the glade for a moment, a unicorn with a small boy on her back. Marigold sees it. \"He's a friend of yours?\" she asks. \"He looks like he believes in things.\"</em></p><p>Ella walks back to her boat. The crown on her head is invisible to most. The egg-mother and her chorus, somehow, have also decided to come.</p>", "next": 176, "depth": "CROWN"}, "176": {"id": 176, "title": "Exit", "html": "<p>The boat with the gold trim is waiting in the rushes.</p><p>She has the Crown. She has, on her head, a weight that feels less like decoration and more like <em>deciding.</em></p><p>She practices it as she pushes off, the deciding face. She tries it once in the reflection of the water. There it is. She did not have it this morning. She has it now.</p><p>She knows what her face is.</p><p>That's the line she'll remember. <em>She knows what her face is.</em> No one can take that from her now, and nothing she meets at the dock-up-above will be bigger than the new thing she just learned about herself.</p><p>She paddles toward the sound of the C-130, faint and far, somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "180": {"id": 180, "title": "Arrival in the Unicorn Meadow", "html": "<figure class=\"illus\"><img src=\"images/aiden_region.webp\" alt=\"Arrival in the Unicorn Meadow\" loading=\"lazy\"></figure><p>Aiden's raft is the unicorn raft.</p><p>He climbed on in the sunroom. Now he is flying.</p><p>The big plastic unicorn is not plastic anymore. She is real. Her mane is a rainbow. Her hooves do not quite touch the ground.</p><p>She turns her big head. She looks at him over her shoulder.</p><p>\"LOOK AT THIS!\" she says. She points her horn at a cloud. The cloud looks like a fish.</p><p>Aiden says, \"Yeah!\"</p><p>\"AND LOOK AT THIS!\" she says. Now she points at a rainbow. The rainbow is growing sideways.</p><p>Aiden says, \"Wow!\"</p><p>She lands soft in a meadow. The grass is so green. Aiden slides off her back.</p><p>Just him. He should be scared. He is not. Chayten is somewhere else. Carson is somewhere else. Even Madison is somewhere else. He is alone on a green meadow with a real unicorn. He thinks one thing. <em>Someone trusted me with this.</em> He is the youngest, so the big jobs have always gone to the bigger kids. Today one is his, and only his. He stands up a little taller.</p><p>Pegasus bows her head. They are eye to eye.</p><p>\"I have waited a long time,\" she says. \"Two hundred years. Do you know why? No one was the right size. The other riders were too big. Too tall. Too old. Some of them did not believe in unicorns enough. Then today, I felt a small boy climb on me in a sunroom. And I thought, <em>oh. There he is.</em>\"</p><p>She tells him her name. She has never said it out loud before.</p><p>\"Pegasus.\"</p><p>Aiden says, \"But Pegasus is a HORSE not a UNICORN.\"</p><p>Pegasus says, \"I picked it MYSELF.\"</p><p>Aiden laughs. Pegasus is so happy.</p>", "next": 181, "arrival": "aiden"}, "181": {"id": 181, "title": "The Exactly-right Moment", "html": "<p>Then Pegasus gets serious. As serious as a unicorn with a color-changing mane can get.</p><p>\"Aiden,\" she says. \"I need to tell you a thing. Sit down.\"</p><p>Aiden sits in the grass.</p><p>Pegasus folds her legs. She lies down across from him. Her horn glows a little.</p><p>\"You are Aiden the Exactly-Right,\" she says. \"EXACTLY RIGHT.\"</p><p>Aiden says, \"For what?\"</p><p>\"For me. For this. For today. You are not too small. You are not too young. You are the right boy. The world will tell you you are too little. The world will be wrong. <em>I picked you.</em> Out of everyone. Because you fit.\"</p><p>Aiden's chin lifts a little.</p><p>Then Pegasus boops his nose with her horn.</p><p>The horn is warm. A little tickly.</p><p>Aiden laughs.</p><p>Pegasus says, \"Now. There is a problem. A baby otter fell into a magic hole. Only a unicorn can save her. But I am too young to save her by myself. I need a rider. Will you ride with me?\"</p><p>Aiden does not stop to think.</p><p>\"Yes.\"</p><p>Pegasus stands up. She flicks her rainbow mane. She bows. He climbs on.</p>", "next": 182}, "182": {"id": 182, "title": "Aiden's Choice", "html": "<p>Pegasus says, \"The hole is in one of three places. I know it is in one of them. I do not know which one. Where do you want to go first?\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Say \"the Meadow of Bells,\"", "target": 183}, {"label": "Say \"the Cliffside,\"", "target": 184}, {"label": "Say \"the River's Bend,\"", "target": 185}]}, "183": {"id": 183, "title": "the Meadow of Bells", "html": "<p>Pegasus flies them to the Meadow of Bells. The name is just right. Every flower is a tiny bell. When the wind blows, the meadow rings.</p><p>Aiden gasps. It is so pretty.</p><p>The magic hole is under a big bell-flower. They find it fast. The flower lifts up out of the way. The hole goes down into the ground.</p><p>They hear a baby otter cry.</p><p>\"Hold on tight,\" Pegasus says.</p><p>Aiden grips her mane. Pegasus folds her wings. They dive.</p><p>Down they go. The hole opens into a shiny cave. Crystals glow on the walls. In the middle sits Ripple the otter. Three weeks old. Soft. Scared. Small enough to fit in Aiden's two hands.</p><p>She has cried for a long time.</p><p>Aiden slides off Pegasus. He walks over. He kneels down.</p><p>\"Hi,\" he says. \"I am Aiden. We came to get you.\"</p><p>Ripple sniffs his hand. Then she climbs into his pocket and stays there.</p><p>Pegasus lifts her horn. It glows. Four doors are at the back of the cave. One door glows back. That is the way out.</p><p>They fly up. They come out in the meadow. Ripple's mother is waiting. She cries. Then she squeaks with joy. She touches her nose to Aiden's nose.</p><p>\"You saved her,\" she says. \"Thank you.\"</p><p><em>If you have read Reid's chapter, the bells of the meadow ring once together. Like a chord. Pegasus tilts her head. \"Trees walking,\" she says. \"A big tree-man is moving today. The bells know him.\"</em></p><p>Aiden hands Ripple to her mother. Ripple chirps a small goodbye in his hand.</p><p>Pegasus says, \"Time to go home, friend.\"</p><p>Aiden climbs on. He says, \"Will you come with me? To the lake-up-above?\"</p><p>Pegasus thinks. (She thinks fast.) \"Yes.\"</p><p>He says, \"Will it be scary?\"</p><p>She says, \"Yes. But you will be there. And Madison. And Chayten. And the others.\"</p><p>Aiden nods. He grips her mane.</p><p>They fly back toward the C-130. The sound is soft and far. Somewhere up in the world above.</p><p>\"LOOK AT THIS!\" Pegasus says. She points at a cloud that looks like a sandwich.</p><p>Aiden laughs all the way home.</p>", "next": 186, "depth": "SILVER"}, "184": {"id": 184, "title": "the Cliffside", "html": "<p>Pegasus flies them to the cliff. The cliff is steep. The rock is dark. The hole is at the bottom. They land on a small ledge. They walk to the door.</p><p>Inside, Ripple is crying. But another sound is there too. A small one. Under the crying.</p><p>Pegasus folds her wings small. Aiden walks beside her. Her horn glows just enough to see.</p><p>The cave opens up. Four doors at the back. Ripple sits in the middle. In front of one door sits a very small, very grumpy thing.</p><p>He is the size of a kitten. He has spikes that are not pointy. He looks more sad than scary.</p><p>\"Do not go through my door. It is MY door. I LIVE here.\"</p><p>Aiden kneels. \"Hi. What is your name?\"</p><p>\"Hush.\"</p><p>\"Hush. I am Aiden. We need to go through your door. Ripple's mom is waiting.\"</p><p>Hush starts to cry. His tears are tiny and glowing.</p><p>\"Everyone wants to go through my door. No one ever just SITS with me. I have been here for FIVE HUNDRED YEARS. No one has ever sat with me.\"</p><p>Aiden sits down. He looks at Pegasus. Pegasus nods.</p><p>\"I will sit with you. Will you sit with me?\"</p><p>Hush stops crying mid-sob. \"...Yes? Yes. <em>Yes.</em>\"</p><p>Aiden opens his arms. Hush climbs into his lap. He weighs almost nothing. He smells like cave moss. He puts his small grumpy face on Aiden's chest. He shakes.</p><p>They sit. Ripple watches from the middle of the cave. Quiet.</p><p>Then Pegasus says a thing Aiden did not see coming.</p><p>\"Aiden. Listen. The Hush has been alone for five hundred years. <em>Five hundred.</em> He cannot come back with us. He is tied to this cave. The door only opens because <em>he</em> opens it. If he leaves, the door closes for good. The cave seals up. No lost creature will ever be found again.\"</p><p>Aiden looks down at Hush. Hush is so quiet on his chest.</p><p>\"But.\" Pegasus says it soft. \"He could come if <em>I</em> stay.\"</p><p>Aiden looks up.</p><p>\"A unicorn for a doorkeeper. Magic for magic. The cave would stay open. The Hush would get to come with you. But I would have to stay.\"</p><p>Aiden's eyes fill up. He does not want to pick. He wanted Pegasus to come home so much. He has not let himself think about anything else for an hour.</p><p>Pegasus lowers her head. \"It is your choice, friend. I will be glad with either one.\"</p><p>The cave is very quiet.</p><p>Aiden looks at Hush. He looks at Pegasus. He looks at Ripple in the middle.</p><p>He thinks for a long minute. Longer than a small boy usually thinks about a thing.</p><p>Then he says, quiet: \"Pegasus, you said I was exactly right. I think being exactly right means I do not get to keep you just for me today.\"</p><p>Pegasus closes her eyes.</p><p>Aiden says, \"But, can I think one more second?\"</p><p>Pegasus says, \"Take all the seconds.\"</p><p>Aiden thinks. He looks at Hush. Then he says: \"Hush. Could you come for one day? Just one? To help us at the dock-up-above? And then come back? Would that work?\"</p><p>Hush sits up. He looks at Pegasus. Pegasus looks surprised. Then <em>happy.</em></p><p>\"You, you could leave for ONE DAY?\" Pegasus asks Hush. \"Not for good?\"</p><p>Hush thinks. \"One day is a lot less than five hundred years. I can do one day.\"</p><p>Pegasus says, \"Then the door stays open for that day. Magic lets a visit. It does not let a move.\"</p><p>Aiden laughs. He fixed a problem that was not supposed to be fixed.</p><p>Hush climbs to Aiden's shoulder. He has gone from sad to <em>brave</em> in about three minutes. He sits taller on Aiden's shoulder than he has sat in five hundred years. He even tries a small spike-stretch. He has never done that before. He wants to look a little tougher.</p><p>\"Look,\" he whispers to Aiden. He sounds wowed at himself. \"I am, I am DOING things. I never DO things. You made me do things.\"</p><p>Aiden says, like it is plain fact, \"You did. You were always going to. You just needed someone to ask.\"</p><p>Hush thinks about that for a long moment. It is the kind of moment a small creature has when something inside him moves over for good.</p><p>Pegasus bumps Aiden's head with her horn.</p><p>\"You found the third way,\" she says. \"Most grown-ups can't. Most kids can. You just did. And look. You made him brave by treating him like he was brave already.\"</p><p>Aiden grins. He did not think he had made anyone brave. But he had.</p><p><em>Above the cliff, a small flat stone skips across the sky in a clean pattern. Hush tilts his small grumpy head. \"Some things fly here that should not. I never ask why.\"</em></p><p>They come up in the meadow. Ripple's mother cries. Hush rides Aiden's shoulder. Pegasus flies them home.</p>", "next": 186, "depth": "CROWN", "aidenDeep": true}, "185": {"id": 185, "title": "the River's Bend", "html": "<p>Pegasus flies them to the River's Bend. The river is wide and warm. The otters have been waiting.</p><p>A tea party on a flat rock in the middle of the river. A tiny driftwood table. A tea pot the size of a thimble. Ripple's mother is there. Calm. The otters have kept her company.</p><p>\"We knew you would come. Have tea. Then we rescue her.\"</p><p>Aiden looks at Pegasus. Pegasus shrugs. \"We have a few minutes.\"</p><p>The head otter is small. Grey on her face. She wears a kelp necklace. Her name is Aunt Stream. She does not look like she is here for small talk.</p><p>\"Child. Before we start. There is something you need to know about the river. The rescue is not free.\"</p><p>Aiden sets his thimble of tea down.</p><p>\"To open the hole, someone has to give the river something that matters. Not gold. Not magic. <em>Something that matters to you.</em> That is the river's price.\"</p><p>Aiden looks at Pegasus. Pegasus is very still.</p><p>\"What do I have that matters?\"</p><p>Aunt Stream looks at him kind. \"You have the unicorn.\"</p><p>Aiden's chin starts to wobble.</p><p>\"No. Not her staying. Not her belonging to you. The river will not take a creature. The river takes a <em>promise.</em> Pegasus is a unicorn. Unicorns belong to the whole world. Not to one boy. If you bring her home, you have to promise that she gets to come back. Not just to visit. She gets to come <em>back</em>. When the work at your lake is done. She does not stay with you for good.\"</p><p>Aiden looks at Pegasus. Pegasus is looking back at him.</p><p>He says, in a very small voice, \"When does she come back?\"</p><p>\"When she is ready. Maybe a year. Maybe ten. Maybe when you are a grown-up. The river does not say. The river just asks for the promise.\"</p><p>Aiden thinks about this for a long time. The otters are quiet. Ripple's mother is quiet. The river is louder than it was.</p><p>He says, \"I will promise.\"</p><p>Pegasus says, \"Aiden.\"</p><p>\"It is right. You belong to everyone. You are a UNICORN. You waited two hundred years for me. I can wait some years for someone else to need you next. You should get to find them.\"</p><p>Pegasus puts her horn on his head. Her eyes are wet.</p><p>Aunt Stream says, \"Good. The river takes it.\"</p><p>The river hums. The rescue hole opens itself under them.</p><p>Then Aunt Stream gets a little quieter. \"Child. While we have you. Do you ever hear singing? At night? At your lake-up-above?\"</p><p>Aiden thinks. \"Yes. Two summers ago. A LADY was singing. We never knew who. Mom said it was nobody.\"</p><p>Aunt Stream nods, slow. \"It was <em>somebody.</em> One of your aunts. The one with the big voice she only uses when she's sure no one's awake. She's more shy than she lets on. Pass it on. But gently. The singer should know we heard her. When the time is right. Not yet.\"</p><p>Aiden tucks that away in the part of his brain that holds important things.</p><p>They dive. They find Ripple. They carry her up.</p><p>Pegasus and Aiden fly home.</p><p>On the way back, Pegasus says: \"Aiden. You did the bravest thing of all eight of you today. You let me go before I went.\"</p><p>Aiden, quiet: \"I did not let you go. I let you visit other people. That is different.\"</p><p>Pegasus laughs the loudest unicorn laugh in two hundred years.</p><p><em>Above the river, the basalt cliffs are streaked with color. Blue. Orange. Green. The colors were not there an hour ago. \"The painter girl woke them,\" Aunt Stream says. \"Big day.\"</em></p>", "next": 186, "depth": "CROWN", "aidenDeep": true}, "186": {"id": 186, "title": "Exit", "html": "<p>The sky is purple and gold. The C-130 is rumbling up ahead. It is calling them home.</p><p>He has Pegasus. He may have a friend on his shoulder. He may have a song in his ears. He may have just a unicorn at his back.</p><p>He always has Pegasus.</p><p>Pegasus says, \"LOOK AT THIS!\"</p><p>She is pointing at the sun coming through the canyon.</p><p>Aiden says, \"Yeah.\"</p>", "exit": true, "next": "hub"}, "400": {"id": 400, "title": "All Eight Come Back to the Meadow", "html": "<p>The rafts come back to the meadow one at a time.</p><p>Madison's canoe lands first, because Madison is always first. Branch the beaver is sitting in the bow with his bow tie still on, looking around like a man who has not been outside in a long time and intends to make the most of it.</p><p>Carson's wheeled boat rolls in next, kicking up dust. Big Coulee is not with him. She is too big to leave The Old Roar. A small flower from her crown is clipped to his shirt.</p><p>Reid's log canoe slides in quietly. He is paddling on one side, then the other, the way he always paddles. The staff is laid across his knees.</p><p>Chayten arrives with Pickle the otter on her shoulder. Pickle is chewing on Chayten's hair. Chayten does not stop her.</p><p>Kellen lands skimming, his racing canoe coming in flat the way a perfect skip-stone comes in flat. The smallest Skip-Stone bird is perched on his head like a hat.</p><p>Kiera's painter's raft arrives last among the older kids, because she stopped on the way to sketch the light.</p><p>Ella's small gold-trim boat arrives at exactly the moment she meant it to. The frog herald is folded in her pocket with his scroll.</p><p>Aiden's unicorn raft does not land. Aiden is riding on Pegasus's back now. Pegasus walks down onto the meadow grass with him, hooves making no sound at all, because unicorns walk like that.</p><p>The Harbor Keeper is on his log. He has not moved.</p><p>He looks them over. Eight kids. Eight earned things. Some allies. Some empty-handed friends. He smiles the smile that is exactly Uncle Bill's smile, and only Reid notices it again.</p><p>He says, \"Good work, lake family. Good <em>good</em> work.\"</p><p>He stands up. His knees crack.</p><p>\"Time to go back. Your dock is waiting. Stand close to your raft. Hold what you brought. Don't let go of each other.\"</p><p>They do.</p><p>The Harbor Keeper raises one hand. Far up the canyon, the sound starts. Low. Big. Getting closer.</p><p>The C-130 is coming back through.</p><p>It comes through louder than the first time. The meadow shakes. The waterfall thunders. The kids feel the sound in their chests. The grass goes flat.</p><p>The plane passes. The walls of the sunroom resolve back around them.</p><p>They are home.</p>", "next": 500}, "500": {"id": 500, "title": "Return to the Sunroom", "html": "<figure class=\"illus\"><img src=\"images/pegasus_sunroom.webp\" alt=\"Return to the Sunroom\" loading=\"lazy\"></figure><p>The kids land in the sunroom one by one. The rafts come to rest. The walls of the sunroom resolve back into walls. The smell of brisket comes through the cracked door. The plastic of the inflatables is warm.</p><p>Pegasus walks in last, hooves clicking on the wood floor. She is real. She is also, apparently, taller than the doorway. She ducks. The other seven kids stare. None of them are surprised, exactly. None of them are not surprised, either.</p><p>Aiden grins like he's been keeping the best secret in the world.</p><p>They show each other what they have.</p><p>Madison opens her cookie tin. The map inside is rolled tight. The tin glows faintly.</p><p>Chayten pulls the otter mask from her pocket. It is small and warm.</p><p>Carson lifts the tusk-charm. It is smooth and humming.</p><p>Reid holds the staff. The wood is the color of wet basalt and a low hum runs through it whenever his palm touches the grain.</p><p>Kellen pats the stone in his pocket. It is heavier than it looks.</p><p>Kiera tucks the Truth Brush behind her ear. It glows.</p><p>Ella has the crown. Nobody sees it but the kids and (later) Drystone.</p><p>Aiden has Pegasus.</p><p>Pegasus says, \"Is THIS the lake-up-above?\"</p><p>The kids look at each other and start laughing.</p><p>Outside, the C-130 thunders past for the second time today. The construction kickoff is in fifteen minutes.</p><p>They walk down to the dock together.</p>", "next": 501}, "501": {"id": 501, "title": "Walk to the Dock", "html": "<p>Eight kids walk down the gravel path to the dock.</p><p>A unicorn walks behind them, invisible to anyone over eighteen.</p><p>The brisket smell follows them. A C-130 had thundered overhead the night before. Another would do so this afternoon. That is how 4th of July week works at Sun Lakes.</p><p>The dock is set up for a construction kickoff. Small platform at the end of the dock. Folding chairs (mostly empty). A bulldozer parked on the dirt road, engine off. A banner stretched between two poles:</p><blockquote class=\"banner\">DRIEDMORE DATA CENTER, WEST CASCADIA HUB<br>GROUNDBREAKING JULY 4, NOON</blockquote><p>A modest crowd has gathered. Some adults from town. A few hotel guests. The kids' parents off to one side, talking quietly. They look worried. They look like adults who have been told there's no other option and have started believing it.</p><p>The kids' parents have not seen the kids yet.</p><p>Mr. Drystone is at the platform, mid-speech. He has three clipboards balanced on the lectern and a fourth tucked inside his jacket. He keeps glancing at his tablet.</p><p>He has not seen the kids either.</p><p>That is about to change.</p>", "next": 502}, "502": {"id": 502, "title": "Drystone Mid-Speech", "html": "<figure class=\"illus\"><img src=\"images/showdown.webp\" alt=\"Drystone Mid-Speech\" loading=\"lazy\"></figure><p>\"...premium server inf
