rastructure,\" Drystone is saying. \"Echo-system improvement. Fiscal opportunity for the cove. Driedmore Properties is delighted to bring a class-A facility to this region. We anticipate the build phase will commence , \"</p><p>He sees the kids.</p><p>He sighs the sigh of a man who has been interrupted by children at a corporate function.</p><p>\"Kids,\" he says, \"this is a GROWN-UP event. Run along.\"</p><p>The crowd laughs nervously.</p><p>Madison steps forward.</p><p>She does not run along.</p>", "next": 510}, "510": {"id": 510, "title": "Beat 1: Madison", "beat": "madison", "played": "<p>Madison opens her cookie tin on the platform railing.</p><p>The tin glows. Faintly, but it glows.</p><p>She unrolls the map. She lays it flat on the railing so the crowd can see it. The map is water-warped at the edges and the ink shimmers in a way that ink usually doesn't.</p><p>She doesn't shout. She doesn't have to.</p><p>\"Mr. Drystone,\" she says, \"this is a copy of your real plans. Not the public sign. The real ones. They show the water draw rate. The drainage path. The wrong permit you filed.\"</p><p>Drystone stutters. \"Where did you GET that.\"</p><p>Madison says, \"From a friend who lives in the lake.\"</p><p>Drystone laughs the dismissive laugh of a man whose career is about to end. \"From a friend who LIVES in the LAKE. Right.\"</p><p>The crowd half-laughs with him. They're not sure yet.</p><p><em>Branch the beaver waddles up onto the platform. He is wearing a small bow tie. He says, in a creaky beaver voice, \"I live in the lake.\" The crowd goes very quiet. Only the kids and Drystone see Branch clearly. The adults see a... blur. A small dark shape. A very specific small dark shape with what appears to be formalwear. They cannot quite focus.</em></p><p>Madison continues. She names the water draw, millions of gallons a day, every day, forever. She names the bank: Driedmore owns it, the appraisal was rigged. She names the wrong permit. She points to each on the map.</p><p><em>Madison's tin is glowing brighter. The full map shows everything, including a small handwritten note in the margin that Drystone did not know was on his own paperwork. Madison reads it out: an internal memo about how to \"manage local sentiment.\" The crowd stops laughing.</em></p><p>Some of the parents start listening. They had been told this was the only way. They had not been told it would mean draining the lake.</p><p>Drystone is sweating.</p>", "skipped": "<p>Madison doesn't have the map. She has a tin of cookies.</p><p>She opens it. She walks down off the platform. She doesn't say a word.</p><p>She offers a cookie to each adult in the crowd. The cookies are chocolate-chip with a small amount of cinnamon she put in last night, when she was sitting at her grandmother's kitchen counter listening to her mother on the phone, talking quietly about \"the situation.\" She heard every word. She has heard every word every night for two weeks.</p><p>The adults take the cookies. They eat them. The cookies are warm. The cookies are exactly the kind of cookie a kid who has been paying attention makes when she wants to bring something real to a place she loves.</p><p>While they eat, Madison talks.</p><p>\"My mom has been on the phone every night for two weeks. I've heard the calls. I know what the bank is asking. I know the rate they're offering. I know what we'd all lose if this place got sold. I have been listening. I made these cookies last night, in case it helped today.\"</p><p>She gets back on the platform. She looks at Drystone.</p><p>\"You assumed I wasn't paying attention. None of you grown-ups noticed I was listening. I was. I always am. So when you say this place has no other way out and Driedmore is the only buyer, I know it isn't true. I heard my mom say so on the phone four nights ago.\"</p><p>The adults are very quiet. Several are still chewing. One, Reid's mother, has tears in her eyes that don't have anything to do with the cookies.</p><p>Madison hasn't won the beat with evidence. She has won it by being the one person in the cove who was actually <em>listening</em> the whole time.</p>", "html": "", "next": 520}, "520": {"id": 520, "title": "Beat 2: Chayten", "beat": "chayten", "played": "<p>Chayten steps to the edge of the platform. She doesn't take the lectern from Drystone. She doesn't need it.</p><p>She slips the otter mask out of her pocket and presses it to her face for one second. Then she tucks it back.</p><p>The crowd doesn't see the mask. They feel something change in the air.</p><p>Chayten says, \"Listen to her.\"</p><p>Three words. The crowd STOPS shifting. Stops fidgeting. Every eye locks on Chayten.</p><p>She says, \"Listen to all of us. We have something to say. It is the truth and you should hear it.\"</p><p><em>Otto the otter, bandaged whiskers, velvet cape over one shoulder, pads onto the platform behind her. The adults see... not quite an otter. A small dignified dark shape they cannot quite name. Drystone sees him plainly. Drystone starts to ask \"what IS that\" and Otto bows formally to him, which makes it worse.</em></p><p><em>Pickle is perched on Chayten's shoulder, no bigger than a teacup. She hisses at Drystone. Drystone is the only adult who hears it. He flinches.</em></p><p><em>One of the Standing Stones, somewhere far below in The Old Roar, hums a single deep note. The dock vibrates. Three glasses on a folding table shatter. A child in the crowd points at the lake and says \"Mom did the lake just THRUM?\" Nobody can answer.</em></p><p>Behind Chayten, in the back of the crowd, Aiden holds the silver fish Pickle gave him. He smiles at his sister. She smiles back. Her voice carries because it's hers, full and steady, the same voice that has held a stage for an entire troupe of otters. The mask just lets the crowd hear what she always sounded like.</p><p>Madison continues from where she left off. She names the data center plan. She names what it would cost the lake. She names what the family was going to lose.</p><p>The crowd is listening.</p><p>Drystone tries to interrupt.</p><p>The crowd looks at him with a kind of annoyance he hasn't experienced from a crowd before.</p><p>He shuts up.</p>", "skipped": "<p>Chayten doesn't have the mask. So she does what she does at home when a room won't settle.</p><p>She walks to the small group of adults standing nearest the platform. She looks at one of the dads, a man she's known her whole life, who fishes off the back dock with her brother, and she says, very quietly, just to him: \"Mr. Halverson. Will you sit down? I want to tell you something.\"</p><p>He sits down. Cross-legged. On the dock. In his work clothes.</p><p>She walks to the next adult. \"Mrs. Bell. Sit down.\" Mrs. Bell sits.</p><p>She walks the crowd. One at a time. Not asking the crowd to listen. Asking <em>each person</em> to sit. They do. Because it's Chayten, and Chayten is the kid who always remembered their dog's name, and the kid who let your toddler tag along on the paddle board last summer, and the kid who you have been seeing for years and have always assumed was good without ever having to wonder.</p><p>Within two minutes, every adult in the crowd is sitting on the dock. Cross-legged. Looking up.</p><p>Madison delivers her cookie speech (or her map). The crowd cannot fidget because they have committed to sitting. They cannot leave because nobody wants to be the first one to stand up.</p><p>Drystone tries to keep speaking from the platform. He looks down at twenty grown adults sitting on a dock listening to the quietest kid in the cove. He sounds, suddenly, ridiculous.</p><p>He stops talking.</p><p>Chayten hasn't won the beat with magic. She has won it by knowing that grown-ups will do almost anything a calm kid asks them to do, if the kid asks them by name, one at a time.</p>", "html": "", "next": 530}, "530": {"id": 530, "title": "Beat 3: Carson", "beat": "carson", "played": "<p>Drystone has had enough. He says, \"This is RIDICULOUS. I'm starting the bulldozer.\"</p><p>He stomps off the platform toward the bulldozer.</p><p>Carson steps in front of it.</p><p>He doesn't say anything.</p><p>Reid lines up beside him. Then Kellen. Then Kiera. Then Ella. Then Madison and Chayten and Aiden. Pegasus shoulders in behind Aiden, head down, horn glowing.</p><p>Eight kids in a line in front of a bulldozer. (Nine, if you count the unicorn. The adults don't.)</p><p>The tusk-charm at Carson's neck glows. The other kids feel it, a warm hum in their own chests, but the line was forming because Carson was already there, not because of the charm. The charm just makes the bond visible.</p><p><em>Big Coulee thunders down the dock road, flower crown still tilted over one eye, narrating her own approach: \"AND BIG COULEE arrives, looking STRONG, looking READY, looking like the AUNTIE these KIDS NEED.\" She skids to a stop behind the kids. The crowd of adults sees... nothing. The dock shakes. Several adults look around for what just made the dock shake. They cannot quite focus on the enormous wooly mammoth standing behind a row of children. Drystone, however, sees her perfectly. He has stopped walking.</em></p><p><em>Two baby mammoths trot forward and sit, one on either side of Carson, their tiny trunks resting on his shoulders.</em></p><p>Drystone says, \"I am calling the police.\"</p><p>Carson says, his voice steady, \"Go ahead. Call them. Show them your real plans.\"</p><p>Drystone starts to dial. The crowd watches. Carson does not move. None of the kids move.</p><p>After a moment, Drystone lowers the phone.</p><p>He cannot, in fact, call the police on eight children standing in front of a bulldozer.</p><p>The dock holds.</p>", "skipped": "<p>Drystone stomps toward the bulldozer.</p><p>Carson is not at the front of the line. He's at the back.</p><p>He has, all morning, been standing at the back of the kids, that's where he always stands, behind Aiden, hands ready, scanning. The competitive cousin who wants to win at everything has spent the entire showdown so far as the rear guard. Nobody noticed. That's how good he is at it.</p><p>When Drystone makes for the bulldozer, Carson moves up through the line of cousins. He puts his hand on Aiden's shoulder as he passes, a small \"I see you\" squeeze, then on Ella's, then on Kiera's. Then he steps to the front.</p><p>He doesn't block the bulldozer. He turns <em>around</em> and faces the other seven kids.</p><p>\"We do this together.\"</p><p>It is not a command. It is a reminder. He has been the cousin who reminds people of things for as long as anyone can remember.</p><p>The other seven kids look at him. They look at each other.</p><p>They all step forward, together. Not in a line. In a <em>clump.</em> Aiden's hand finds Madison's. Reid puts his hand on Ella's shoulder, the way Carson did. Kellen grabs Kiera's elbow. Chayten gets behind Aiden, hand on his other shoulder.</p><p>By the time Drystone turns from the bulldozer, the kids are a single thing. A tangle. Eight bodies arranged so that none of them could move forward without all of them moving forward.</p><p>Drystone cannot drive over a tangle of eight children any more than he can drive over a line of eight.</p><p>Carson hasn't rallied the kids with the charm. He has rallied them by being the one who knows how to <em>gather</em> without leading.</p>", "html": "", "next": 540}, "540": {"id": 540, "title": "Beat 4: Reid", "beat": "reid", "played": "<p>Drystone climbs into the bulldozer. He starts the engine. It roars.</p><p>The kids don't move.</p><p>Reid steps forward, calm as he always is, and plants the staff in the dirt directly in front of the bulldozer's tracks.</p><p>The staff stands on its own. The wood hums, a low slow note.</p><p><em>The staff visibly takes root. The wood at its base sends pale tendrils into the soil. The kids can see them. The adults cannot. Drystone can.</em></p><p>The bulldozer rolls forward.</p><p>It hits the staff.</p><p>The staff doesn't move.</p><p>The bulldozer's tracks SPIN. Smoke comes off them. The bulldozer doesn't go anywhere.</p><p>Drystone revs the engine harder. The tracks dig grooves into the road. The staff stays exactly where it is.</p><p>Reid has not said one word since they walked down to the dock. He has been holding it, the way he holds everything, until the moment it will land. He says four words now, calm and flat: \"It's not going to move.\"</p><p>They land.</p><p>The crowd actually laughs. The bulldozer keeps spinning. Drystone is sweating through his hard hat. After thirty long seconds he gives up and turns off the engine.</p><p><em>A thicket of trees that wasn't there an hour ago is now standing at the edge of the dock. The trees are tall and quiet. They lean slightly toward Drystone. The kids' parents look at the trees and try to remember if those trees were always there. They cannot remember. Old Speak, in his slow tree-being way, raises one bark-bristled hand. He waves.</em></p><p>Drystone climbs down. His hard hat falls off.</p><blockquote class=\"banner\"><strong>Continue to Drystone's pushback.</strong></blockquote>", "skipped": "<p>Reid doesn't have the staff.</p><p>He has a pocket knife and a piece of cottonwood he picked up on the walk down.</p><p>While Drystone is climbing into the bulldozer, Reid sits down. Cross-legged. On the dock. Right in front of the bulldozer's tracks. And he starts to whittle.</p><p>Drystone stares at him.</p><p>Reid doesn't look up.</p><p>He whittles. He has been whittling since he was small. His hands know what to do without his eyes. The cottonwood is soft. The shape inside is already there. He works.</p><p>The bulldozer engine starts. Reid does not look up.</p><p>The engine revs. Reid does not look up.</p><p>The bulldozer rolls forward six inches. The driver, Drystone, sees that the kid is not moving and is not even <em>looking.</em> The kid is just whittling, the way you whittle at home on the back porch on a hot afternoon when you've got nothing else to do and nowhere else to be.</p><p>You cannot run a bulldozer over a kid who is whittling.</p><p>The bulldozer stops.</p><p>Reid keeps whittling.</p><p>A full minute passes. Then another. The whole crowd watches a boy patiently shaping a piece of cottonwood. He is not performing. He is not trying. He is just <em>whittling,</em> with the calm of someone who knows the world will reorganize itself around him if he waits long enough.</p><p>Drystone shuts off the engine. The crowd realizes only then that they have all been holding their breath.</p><p>Reid looks up for the first time. He holds up what he's carved. It is a small wooden fish. He hands it to Aiden, who has been watching from the side.</p><p>\"Here. For your pole.\"</p><p>Reid hasn't won the beat with the staff. He has won it by being exactly the kid he always is, with exactly the calm he always has, the kind of will that doesn't raise its voice because it doesn't need to, in front of a man who has never met anyone like that in his life.</p><blockquote class=\"banner\"><strong>Continue to Drystone's pushback.</strong></blockquote>", "html": "", "next": 550}, "550": {"id": 550, "title": "Drystone'S PUSHBACK: THE BANK OFFER", "html": "<p>Drystone climbs out of the bulldozer. He's furious. He grabs his three clipboards. He looks at the crowd. He looks at the kids. He looks at the kids' parents.</p><p>He plays his ace.</p><p>He pulls out a fourth piece of paper, a SIGNED OFFER LETTER from the bank that holds the hotel's loan.</p><p>\"This hotel,\" Drystone says, \"is BROKE. The dock's foundation is GONE. The water is eating it out from under the whole place. The owners cannot AFFORD the geological work. The bank is calling the loan. Driedmore is the ONLY buyer. We are RESCUING this cove.\"</p><p>Some of the adults in the crowd nod. Some of the parents close their eyes. This is the part they've been afraid of all morning.</p><p>The kids freeze.</p><p>This is the real fight. Not the bulldozer. Not the sign. The MONEY. Nobody's family is rich and nobody's family is poor, that was never the point. None of them own the place. The grown-ups had been told there was no other way to save it and they had believed it, because the dock IS falling apart. They could SEE it falling apart all week.</p><p>Drystone sees the kids' faces. He smiles a thin, mean smile.</p><p>\"I'm sorry, kids,\" he says, even though he isn't. \"Sometimes the world doesn't work out the way you want. Sometimes the GROWN-UPS have to make the hard call.\"</p><p>Aiden's hand tightens on Pegasus's mane.</p><p>Pegasus, invisible behind the platform, leans her unicorn head against Aiden's shoulder. Aiden's chin lifts.</p><p>But then Drystone sees something.</p><p>He sees that some of the kids look like the other kids' parents and some of the kids do <em>not</em> look like the other kids' parents. He has been studying property records all week. He thinks he knows who is related to whom.</p><p>He smiles wider.</p><p>He plays his second ace.</p>", "next": 551}, "551": {"id": 551, "title": "★ the Chosen-family Pivot ★", "html": "<p>Drystone walks slowly along the line of kids.</p><p>\"You know,\" he says, conversational, \"I've been doing my homework. Four families. Some of you are blood. Some of you aren't. These two,\" (he gestures at Reid and Ella) \"brother and sister. And these two,\" (he gestures at Carson and Kiera) \"brother and sister too, and cousins to the first pair. Four kids, one bloodline, been coming to this cove since before they could walk. Real family. But you,\" (he gestures at Madison and Kellen) \"your mom is just a <em>friend</em> of theirs. From college. A long time ago. Not blood. And you two,\" (he gestures at Aiden and Chayten) \"same thing. Your mom is a <em>friend</em> of a <em>friend</em>. Did you know that, sweetheart? Did you know half of you aren't really part of this family at all? You just tag along every summer. You're guests. You've ALWAYS been guests.\"</p><p>He turns to the kids' parents.</p><p>\"Maybe the <em>blood</em> family doesn't need the <em>guests</em> speaking for them. Just an idea.\"</p><p>The parents look at each other. The chosen-family moms look first at the blood-family moms. There is a silence Drystone is hoping to grow.</p><p>Aiden whispers, \"Chayten. Are we GUESTS?\"</p><p>Chayten goes still.</p><p>So does Madison. So does Kellen.</p><p>The chosen-family kids are looking at their cousins. The cousins are looking back at them.</p><p>Drystone is smiling.</p><p>This is the part he is best at, finding the seam and pulling on it.</p><p>He waits.</p>", "next": 552}, "552": {"id": 552, "title": "A Kid Takes It Apart", "html": "<p>Carson is the one who moves first.</p><p>He doesn't say it loud. He says it the way he says things to Aiden when Aiden is scared.</p><p>He says, \"You don't know what family is. You also don't know what <em>belonging</em> is.\"</p><p>Drystone says, \"Excuse me?\"</p><p>Carson says, \"You looked at a property record. You think family is who's on a deed. You think belonging is who pays a mortgage. NONE of us own this place. NONE of our families own it. We're all renters. We rent the same condos every July. We have been renting them since before any of us were born. The cove doesn't belong to us. But WE belong to the cove. And that's something you can't put on a clipboard.\"</p><p>He walks down the line. He doesn't take Drystone's hand. He doesn't gesture dramatically. He just walks along the line of cousins, putting his hand briefly on each kid's shoulder as he passes.</p><p>\"This is Kiera. My sister.\" (Hand on Kiera's shoulder.) \"This is Reid. This is Ella. Our cousins. We share a grandmother. You got that part right, it's on paper, fine. But this is also Madison.\" (Hand on Madison's shoulder.) \"She's not on our paper. She's been my family every July since I can remember. She taught me to swim. She made me cookies the summer my dog died. She is MY family. Not because of paper. Because she SHOWED UP.\"</p><p>He keeps walking.</p><p>\"This is Chayten. Not blood. She braided my hair when I broke my arm. This is Kellen. Not blood. He carried me on his back the summer I sprained my ankle. This is Aiden. The youngest of us. He is my COUSIN in EVERY WAY THAT MATTERS. Don't you stand there and tell us who our family is.\"</p><p>He turns back to Drystone.</p><p>He is much smaller than Drystone. He is not afraid.</p><p>\"We chose each other. They chose us. That's stronger than blood. It's stronger because we have to do it again every summer and we ALWAYS DO.\"</p><p>Kiera steps up beside her brother. Then Madison. Then Reid. Then Ella. The blood-family kids and the chosen-family kids are now physically tangled together, arms over shoulders, hands held.</p><p>Aiden says, very small, very clear: \"We are NOT guests.\"</p><p>Pegasus, behind him, makes a sound that is very close to a unicorn cheering.</p><p>Drystone's smile dies on his face.</p><p>His attempt to split the family has done the opposite of what he wanted. The kids' <em>parents</em> are now also stepping closer to each other. The chosen-family moms and the blood-family moms are standing shoulder to shoulder.</p><p>Drystone realizes too late that he has just <em>cemented</em> them.</p>", "next": 560}, "560": {"id": 560, "title": "Beat 5: Kellen", "beat": "kellen", "played": "<p>Drystone gathers himself. He says, \"That's all very SWEET. But the bank offer STANDS. The family, chosen or blood, whatever, still can't AFFORD the geological work. You all line up however you want. The dock will still fall down.\"</p><p>Kellen steps forward.</p><p>He has been watching Drystone's posture all morning. He watched where Drystone's hand kept drifting. He watched the way Drystone's left jacket lapel sat slightly heavier than the right.</p><p>He has the stone in his palm.</p><p>He says, \"Mr. Drystone. There's a piece of paper inside your jacket. You touch your lapel every two minutes. I've been counting. Will you take it out?\"</p><p>Drystone says, \"No.\"</p><p>Kellen says, \"Okay.\"</p><p>He throws the stone.</p><p>The stone skips off the wood of the dock. Bounces off a railing. Skips up the steps of Drystone's platform. Lands on Drystone's inside jacket pocket, through the FABRIC, somehow, the stone went around, and balances on the edge of a hidden fourth clipboard.</p><p>The clipboard tips out. It hits the wood. It falls open.</p><p><em>Skim and her flock fly in like a small precision air force. They skip stones in formation onto every other piece of paper Drystone has hidden, under his hard hat, in his back pocket, taped to the underside of the bulldozer's steering wheel. Total exposure. Within thirty seconds, every hidden document Drystone owns is in plain sight on the platform.</em></p><p>The crowd reads. The contents of the fourth clipboard are Driedmore's internal memo about the bank. About the lowballed appraisal. About a list of three other small hotels Driedmore is doing the same thing to.</p><p>The kids' parents are now VERY interested.</p><p>Drystone has stopped sweating because his body is no longer producing sweat. His face is the color of paper.</p>", "skipped": "<p>Kellen doesn't have the stone. He has the baseball that has been in his pocket since the third of July, the one he was taking shadow swings with when Drystone first arrived, the one he has spent the whole week imagining sending across the cove to the far-off island.</p><p>He pulls it out. He bounces it once on the dock, <em>thock</em>, and Drystone flinches at the sound. Just a small flinch. But Kellen sees it.</p><p>Kellen has been watching Drystone's posture all morning. The shoulder twitch. The lapel pat. The way Drystone's eyes go to the bulldozer when he's lying and to the platform when he's truthful. Kellen has been throwing things into and out of lakes for as long as he can remember; his eyes know what bodies do.</p><p>He says, conversationally, \"Catch.\"</p><p>He throws the baseball at Drystone. Underhand. Slow.</p><p>Drystone catches it automatically. With his left hand. He has been keeping his right hand free all morning to touch the inside lapel of his jacket, the lapel that sits half an inch lower than the other one, because there is something in that pocket he is not supposed to forget about.</p><p>Kellen says, \"Throw it back.\"</p><p>Drystone does. With his left hand again.</p><p>Kellen says, \"Now throw it back with your right.\"</p><p>Drystone does. The thing inside his jacket falls slightly. The lapel shifts. The corner of a fourth clipboard becomes visible.</p><p>Madison's mother steps forward.</p><p>Kellen has not won the beat by throwing a magical stone. He has won it by understanding what a body looks like when it's hiding something, and by setting up the simplest possible test to expose it.</p><p>The baseball rolls off the platform. Aiden grabs it. He's been wanting that baseball back since the first day.</p>", "html": "", "next": 570}, "570": {"id": 570, "title": "Beat 6: Kiera", "beat": "kiera", "played": "<p>Drystone tries to recover. He says he doesn't know how those papers got in his pocket. He says someone must have PLANTED them. He says the kids are LIARS.</p><p>Kiera pulls the Truth Brush from behind her ear. She holds it up to her eye. She looks through it at Drystone.</p><p>She sees what nobody else sees.</p><p>Drystone is bright YELLOW. His clipboards are YELLOW. His permits are YELLOW.</p><p>Madison's map glows BLUE.</p><p>Kiera says, simply, \"He's lying.\"</p><p><em>The Truth Brush flares brighter. Kiera sees more. She sees a small thread of GREY around Drystone's chest, old grey, decades-deep, a part of him that wanted, once, to do a different kind of work. She doesn't mention this. It is not relevant to the immediate problem. She files it away as something Drystone might know about himself someday.</em></p><p>She says it small but everyone hears it.</p><p>A grown-up in the crowd says, \"Wait, can you see something we can't?\"</p><p>Kiera says, \"Yes. He's lying. I can see it.\"</p><p>The crowd believes her. They believe her because she's clearly telling the truth herself.</p><p><em>Drystone glances up at the basalt cliffs that ring the cove. He feels watched. The hairs on his neck stand up. He doesn't know why.</em></p><p><em>Drystone glances up and sees, standing in the cove water up to his shoulders, an enormous basalt giant. The basalt giant is looking back at him. The other adults see nothing. Drystone forgets how to breathe.</em></p>", "skipped": "<p>Kiera doesn't have the brush. She has her sketchbook.</p><p>She has been drawing the whole time. The whole showdown. Since they walked down to the dock. She has not said a word. Nobody has noticed she's drawing, they've all been watching the kids who are talking.</p><p>She has filled six pages.</p><p>She walks up to the platform with her sketchbook open. She holds it up so the crowd can see. Then she flips through it, fast, like a flipbook.</p><p>The pages are Drystone. Drystone at the speech. Drystone when Madison started talking. Drystone when Chayten said <em>listen.</em> Drystone when the kids lined up in front of the bulldozer. Drystone when he pulled out the bank offer. Drystone when he tried to peel the families apart. Drystone when Carson took it apart.</p><p>In every drawing, Drystone's left eye is narrower than his right.</p><p>Every single drawing.</p><p>It is not a coincidence. It is a tell. Kiera has been watching for it all morning the same way she watches a cliff face for the seam where she can put her hand.</p><p>She holds up one of the drawings, the bank-offer one, and points at his left eye in the sketch.</p><p>\"He does this when he's lying. Look.\"</p><p>The crowd looks at Drystone.</p><p>Drystone is, at this exact moment, lying about something. The eye is doing it. Three different adults notice. Then five. Then everyone.</p><p>Drystone realizes too late that his face has been broadcasting to the kid with the sketchbook for forty minutes.</p><p>Kiera hasn't won the beat with the truth brush. She has won it by drawing what was in front of her, carefully, the same way she always does. She just had a sketchbook.</p>", "html": "", "next": 580}, "580": {"id": 580, "title": "Beat 7: Ella", "beat": "ella", "played": "<p>Drystone is purple in the face. He shouts, \"I HAVE A PERMIT. THE PERMIT IS LEGAL. I AM PROCEEDING.\"</p><p>Ella steps in front of him. She is smaller than him by half.</p><p>The invisible crown on her head becomes visible to him for one full second. He sees it. He doesn't know what he's seeing. The crown is small and gold and exactly the right size for a child queen.</p><p>Ella does the thing Marigold taught her. She makes her face the deciding face.</p><p>She says, \"I am Queen Ella of the Bright Water. And the answer is NO.\"</p><p>Drystone's mouth opens.</p><p>His mouth closes.</p><p>He cannot find a single word.</p><p>The crowd applauds. They don't see the crown. They see Ella's face, and they see Drystone's face, and they don't need to see the crown to know what just happened.</p><p><em>The egg-mother and her chorus appear at the edge of the dock. Twelve small soft creatures hum a single, low note all at once. The note is in everyone's chest. Drystone staggers. The other adults look around for the source of the sound and cannot find it.</em></p><p><em>A frog in tiny royal regalia hops onto the platform. He bows. He produces a small scroll. He reads, in a voice clearer than most grown-ups: \"By order of Her Majesty Queen Marigold of the Bright Water, and in joint authority with Co-Queen Ella of the Bright Water, Hotel Sun Lakes is hereby declared Protected Territory of the Realm. Any party who attempts to alter this cove will answer to the Bright Water Court.\" He bows again. He hops back into the lake. The kids' parents have no idea what just happened. They saw a frog. They cannot quite remember what the frog did.</em></p>", "skipped": "<p>Ella doesn't have a crown. She has a sketchbook.</p><p>She pulls a small sketchbook from her pocket. She also pulls out a pencil. She does not explain why she has these. She just does. She finishes the drawing she was working on. She does not stop finishing her own drawing to handle the most dangerous man on her dock.</p><p>The crowd, which had been expecting something dramatic, watches her draw.</p><p>Drystone says, \"Little girl, MOVE.\"</p><p>Ella, still shading the bottom of the page: \"Just a second.\"</p><p>She finishes. She closes the sketchbook. She puts the pencil behind her ear. She looks up.</p><p>She walks directly toward Drystone. She does not stop two feet away, the polite distance. She walks until her toes are six inches from his shoes. She is exactly half his height. She has to tilt her head all the way back to look him in the face.</p><p>\"No.\"</p><p>That's the word.</p><p>The drawing was the message. The message was: <em>I am not afraid of you. I do not even consider you important enough to interrupt my own work for. I will finish my own business before I deal with yours.</em></p><p>Drystone has spent his career intimidating people who treated him as serious. He has no idea how to handle a kid who treats him as a chore.</p><p>He steps back.</p><p>The crowd applauds. Ella's father, in the back, laughs out loud once and says, \"<em>That's</em> my kid.\"</p><p>Ella has not won the beat with a crown. She has won it by being so completely Ella that no amount of Drystone could disturb her.</p>", "html": "", "next": 590}, "590": {"id": 590, "title": "Beat 8: Aiden", "beat": "aiden", "played": "<p>Drystone makes one last try. He is desperate now. He shouts, \"I want PROOF this is REAL MAGIC. PROVE TO ME magic exists. Otherwise this is all a child's TANTRUM.\"</p><p>Aiden walks forward. He's been at the back the whole time, holding Pegasus's mane.</p><p>His BELIEF is what makes Pegasus visible to Drystone specifically. Adults can't normally see her. But when Aiden looks Drystone in the eye and BELIEVES, fully, without hedging, that there is a real unicorn standing on the dock, his belief is strong enough to make her real for Drystone. Just for Drystone. Just for that moment.</p><p>That is the youngest one's superpower. He believes harder than any adult ever could.</p><p>He whistles.</p><p>Pegasus walks up the dock. Hooves clicking on the wood. Mane rainbow.</p><p>Aiden looks Drystone dead in the eye.</p><p>Drystone sees her.</p><p>Just Drystone.</p><p>The other adults don't see her. But Drystone sees a real, talking, rainbow-maned unicorn standing three feet away from him, breathing steadily, looking at him with patient unicorn eyes.</p><p>His clipboards drop. His hard hat falls off. His face goes white.</p><p>Aiden says, \"Mr. Drystone. This is Pegasus. She's a unicorn.\"</p><p>Pegasus says, \"HI!\"</p><p>She trots up to Drystone and sniffs him.</p><p>Drystone opens his mouth.</p><p>He almost says \"There's a unicorn.\" He stops. He realizes, in real time, that if he says that, the other adults will think HE'S lost his mind. The other adults are all looking at him with concern. They see Drystone staring at thin air.</p><p>He has to choose, second by second, between admitting the magic and his career.</p><p>He chooses his career.</p><p>He whispers, \"I... can't... I can't put a unicorn on a permit.\"</p><p>Aiden says, \"We know.\"</p><p><em>The Hush, a small grumpy thing with non-pointy spikes, is riding on Aiden's shoe. He looks up at Drystone and says nothing. Drystone sees him too. Drystone's eyes get larger.</em></p><p><em>Drystone's vision is becoming unmanageable. He sees the unicorn. He sees the mammoth. He sees the otter in the velvet cape. He sees the beaver in the bow tie. He sees the basalt giant standing in the cove water. He sees the small grumpy spike-thing on the boy's shoe. He sees the frog herald. He sees twelve small egg-creatures humming. He sees the thicket of trees that wasn't there before. The other adults see NONE of these things. They see Drystone's face. Drystone has begun to make a small sound. The sound is mostly air.</em></p><p>The crowd can't see what broke him, but they can see Drystone, white-faced, sweating, beaten. He drops the offer letter on the dock. It flutters down.</p><p>The deal is dead.</p><p>Pegasus says, \"LOOK AT ALL OF THEM!\"</p>", "skipped": "<p>Aiden has no unicorn. He has the fishing rod from the back dock, the one he carried down to the showdown without telling anyone why. It is in his hand. He holds it up.</p><p>He walks forward. The fish is in his pocket. He pulls it out and holds it up.</p><p>\"Mr. Drystone. This is a fish from a place you've never been. My sister brought it back for me from a play she was in. The play was about a brother and a sister and how the sister never stopped looking for the brother. She got to be the sister in the play. And then she brought me this fish because she knows I like fishing. You don't have anyone who would do that for you. That's what's wrong with you.\"</p><p>The crowd goes very quiet.</p><p>The smallest kid talking about love can stop a room faster than a unicorn can.</p><p>Drystone tries to recover. \"...kid, you don't understand the situation , \"</p><p>\"I do understand. You don't have anyone who would bring you a fish. That's why you keep counting things. People who have someone who would bring them a fish don't have to count.\"</p><p>The crowd does not laugh. The crowd does not applaud. The crowd just listens to the small clear voice of the smallest kid on the dock telling the biggest grown-up the actual truth about him.</p><p>Drystone opens his mouth. Closes it. He has no answer to the smallest kid's verdict on his entire life.</p><p>He sags.</p><p>It is not the magic moment. It is a smaller, realer moment. The smallest kid looking a wrong adult in the face and saying <em>I see what you actually are, and it isn't enough.</em></p><p>It is enough.</p>", "html": "", "next": 595}, "595": {"id": 595, "title": "The C-130 Returns", "html": "<figure class=\"illus\"><img src=\"images/c130_diving.webp\" alt=\"The C-130 Returns\" loading=\"lazy\"></figure><p>The C-130 thunders overhead. Mid-week flyover, right on schedule.</p><p>Every adult and every kid on the dock looks up. The plane comes through the canyon huge and low. The dock vibrates. The windows of the bulldozer rattle. The trees on the bank shake.</p><p>Pegasus rears up onto her hind legs. She watches the plane. The plane is louder than she has ever heard anything be.</p><p>When it passes, Pegasus says, \"<em>ANOTHER one!</em>\"</p><p>Aiden says, \"There's another one tomorrow.\"</p><p>Pegasus is delighted.</p><p><em>Big Coulee trumpets back at the C-130. The sound carries across the lake. Three water-skiers on the far shore wonder what just made that noise.</em></p><p><em>Old Speak waves a leafy hand at the plane. The plane does not wave back. Old Speak is undeterred.</em></p><p>The kids' parents look at the kids. Then at the dock. Then back at the kids. They don't know what just happened. They know SOMETHING just happened.</p><p>Madison walks over to her parents.</p><p>She says, \"We figured it out. The dock is going to be okay.\"</p><p>Her parents look at each other.</p><p>They look at the dock.</p><p>They want to ask. They don't know how.</p>", "next": 596}, "596": {"id": 596, "title": "Drystone BREAKS", "html": "<p>Drystone gathers what's left of his clipboards. His tablet is dead, at some point during the showdown the battery died, which is the kind of thing that has never happened to him before.</p><p>He says, very quietly, \"I'll be in my truck.\"</p><p>Nobody stops him. He walks down the dock road. He climbs into his truck. He sits in the driver's seat for ten minutes without starting the engine.</p><p>Eventually he drives away.</p><p>He does not look back.</p><p>The Driedmore Data Center, West Cascadia Hub, does not break ground on July 4th.</p><p>It does not break ground on July 5th.</p><p>It will, several months from now, be quietly canceled.</p><p>The bank that made the rescue offer will be investigated, and the lake will not be drained, and the cove will stay a cove.</p>", "next": 597}, "597": {"id": 597, "title": "The Final Choice", "html": "<p>Each cousin's chapter ended with that cousin's own <strong>Silver</strong> or <strong>Crown</strong> ending. Eight cousins, sixteen possible endings between them. Now the book picks its own final ending.</p><p>Aiden is the keystone. The unicorn came home with him no matter which path he took, but the kind of unicorn the world gets to keep depends on how deep he went.</p>", "finalChoice": true}, "598": {"id": 598, "title": "Crown Ending: the Dock Heals Overnight", "html": "<figure class=\"illus\"><img src=\"images/dock_night.webp\" alt=\"Crown Ending: the Dock Heals Overnight\" loading=\"lazy\"></figure><p>That night.</p><p>Sparklers and snap-its on the dock. Brisket gone. Lake dark. Stars coming up. The bats are out, one swoops just overhead to eat the mosquitoes and Aiden flinches and laughs at the same time.</p><p>Madison shares a cookie with Aiden. Aiden gives one to Pegasus, hidden in the sunroom (the unicorn is staying for the rest of the trip, she'll go back to The Old Roar after the kids leave, but she's invited back any time).</p><p>Reid is whittling.</p><p>Kellen is throwing something into the lake.</p><p>Kiera is sketching the sunset.</p><p>Ella is wearing her invisible crown.</p><p>Carson is hyping a mini-golf rematch for tomorrow.</p><p>Chayten is on the back dock with Aiden's fishing rod, casting in the dim light. Pickle is on her shoulder.</p><p>Across the lake, faintly, music is drifting from the campground. Tonight it's a guitar. Last night, in The Old Roar, it had been opera. Aiden hums along under his breath. He has been told to wait. He is waiting. He is also paying attention.</p><p>After the sparklers burn down, the eight kids walk to the end of the dock. They look at each other. Nobody has to say it.</p><p>They jump.</p><p>All eight, at the same time, in the same way they jumped on the first day of the trip. Splash. Eight at once. The sound is the same. The lake holds them up the same.</p><p>Pegasus, in the sunroom, can hear them. She makes a sound that is the unicorn version of <em>good.</em></p><p>Aiden surfaces first. On his own. No hand reaching for Chayten's. No one waiting to grab the back of his suit. He spits water and laughs the way he laughed on the first day of the trip, when he jumped in by himself for the first time, when <em>he was sure.</em></p><p>The others come up around him. Eight heads bobbing.</p><p>And then, just for a second, only Aiden sees this, and he won't tell anyone for years, there's a figure on the far shore of the cove. Standing on a rock that wasn't there a moment ago. Beard the color of cedar bark. Suspenders. Beat-up canvas hat pushed back on his head.</p><p>He waves.</p><p>Aiden waves back, one small hand up out of the water, his orange life jacket holding him bobbing.</p><p>The figure tips his hat. He turns. He walks into the trees on the far bank. The rock is gone. The trees close behind him.</p><p>Aiden doesn't say anything. He just holds the moment in his chest the way you hold a small bird you don't want to scare.</p><p>In the morning, the dock will be a little stronger. The lake will still be a lake. Drystone will be gone. The data center will be canceled. Sun Lakes will hold for another summer.</p><p>And another after that. And another. As long as the kids keep coming back.</p>", "next": 601}, "599": {"id": 599, "title": "Silver Ending: Come Back Next Summer", "html": "<p>That night.</p><p>Sparklers and snap-its on the dock. Brisket gone. Lake dark. Stars coming up.</p><p>The kids are quieter than they were at the start of the day. Something happened. They beat Drystone. They sent him home with his tablet dead and his clipboards scattered.</p><p>But they didn't get everything. They missed some pieces. There were corners of The Old Roar they never reached.</p><p>The dock foundation is still wobbling. The third piling still tilts. Madison's parents and Reid's parents have been talking quietly all evening about what to do.</p><p>But here's the thing: they're talking <em>together.</em> Chosen family and blood family, side by side. Drystone's attempt to split them did the opposite. Whatever happens to Sun Lakes now, they will figure it out together.</p><p>Aiden, on the back dock, says quietly to Chayten: \"We have to come back. There's stuff we didn't see.\"</p><p>Chayten says, \"We will. We always do.\"</p><p>Pegasus stays in the sunroom, hidden, visible only to the kids. She'll be there when they come back next summer. She has promised.</p><p>After the sparklers burn down, the eight kids walk to the end of the dock. They look at each other. Nobody has to say it.</p><p>They jump.</p><p>All eight, at the same time, in the same way they jumped on the first day. Splash. Eight at once. The sound is the same. The lake holds them up the same. They are aware, this time, of what they almost lost, and of what is still uncertain.</p><p>But the lake still holds. The chosen family still chose. Drystone is gone. The summer is not over.</p><p>Aiden surfaces first. On his own. The way he had on day one, that thing they will never take away from him, no matter what happens to the cove next year. He surfaced first this time, too. The smallest kid, swimming alone, completely fine.</p><p>Madison surfaces second, this time. She wipes water out of her eyes. She looks at her cousins, every one of them, blood and chosen, none of it mattering for the sorting.</p><p>\"We're coming back next year,\" she says.</p><p>It is not a question. Nobody says no.</p><p>And then, just for a second, only Aiden sees this, and he won't tell anyone for years, there's a figure on the far shore of the cove. Standing on a rock that wasn't there a moment ago. Beard the color of cedar bark. Beat-up canvas hat pushed back on his head.</p><p>The figure tips his hat. He waits a beat, as if he's saying <em>I'll see you next summer, friend. There's more here to find.</em> Then he turns and walks into the trees. The rock is gone.</p><p>Aiden tucks the moment away with all the other important things.</p>", "next": 602}, "601": {"id": 601, "title": "The Crown Ending", "html": "<figure class=\"illus\"><img src=\"images/crown_ending.webp\" alt=\"The Crown Ending\" loading=\"lazy\"></figure><p>You went deep. You found the FULL version of what your cousin came to The Old Roar to find. You made the bravest choice when the lake offered it. You came home with an ally, an item that hums, and at least one secret tucked somewhere only you would know how to find.</p><p>The dock is safe, not just for this summer. <em>Forever.</em> The magic that came home with you doesn't fade. It quietly lives in the boards now.</p><p>Reid the Noticer's staff has rooted in the lake-bed and the third piling is now part of the lake itself. Kiera Both-at-Once's cliff, Cliffy, is across the cove, half-watching the cabin every minute of every day, his colors still visible if you tilt your head right. Carson the Trustworthy's mammoth, Big Coulee, has a worn track up the back canyon her family uses every summer that the grown-ups will never explain. Ella the Deciding Face's Bright Water frogs live under the dock now, and the kids will sometimes see the herald at dusk with a tiny scroll he's still trying to deliver. Kellen the Whole's Skip-Stone flock comes through every July, the smallest of them perched on his shoulder for a week before flying on. Chayten the Connector's otters, Otto, Pickle, and the Driftwood Players, leave small smooth things on the rocks at dawn, one for each cousin, never explained. Madison the Dancer's Canyon Singer turns out to be Madison and Kellen's own mother, who has a big voice she only ever used in the dark, sure no one was awake. The summer the kids let her know they heard her all along, she stops hiding it, and sings from the back deck, out loud, where everyone can hear. Pegasus visits Aiden in the sunroom every full moon and goes back to the world to find her next rider.</p><p>The cousins are the keepers of a secret bigger than the cabin. They will be the keepers of it for the rest of their lives. When the youngest of them is forty, they will still gather on the third of July, jump from the dock at the same instant, surface together, look at each other, and silently confirm: <em>we remember. We were there. It was real.</em></p><p>Every summer their own children will run to the dock and jump in at the same instant, not knowing yet what is holding the boards up.</p><p>The summer always starts the same way. And the summer always will.</p>", "ending": true}, "602": {"id": 602, "title": "The Silver Ending", "html": "<p>You went somewhere in the middle. Some of the cousins came back with the deeper version of what they needed. Some came back with the simpler one. A couple of allies walked back with you. The choices were generous but not as deep as they could have been.</p><p>The dock stands. Drystone has been chased off. The wobbly third plank is fixed (mostly). The cove is safe this summer.</p><p>Some of the magic stayed asleep. The deepest secrets in the cousin's region didn't open for you this time. The creature you met there will dream of <em>you</em> for years, wondering what would have happened if you had gone one choice further. You will dream of them, too.</p><p>But the cousins all remember. They will, every summer, jump from the dock at the same instant. They will, every summer, swim across to the cliff face and touch it. They will, every summer, leave a small thing on the rocks for the otters, a piece of cookie, a stone, a piece of driftwood, and they will never tell anyone why.</p><p>One day, maybe next summer, one of them will go back into The Old Roar and find the path they missed. The dock will hold until they do.</p>", "ending": true}};
const COUSINS = {"madison": "Madison — the Quiet Pool", "carson": "Carson — the Coulee Plains", "reid": "Reid — Old Speak's Wood", "chayten": "Chayten — the Driftwood Stage", "kellen": "Kellen — Skip-Stone Lake", "kiera": "Kiera — the Painted Cliff", "ella": "Ella — the Bright Water Court", "aiden": "Aiden — the Unicorn Meadow"};
const ARRIVAL = {"madison": 110, "chayten": 120, "carson": 130, "reid": 140, "kellen": 150, "kiera": 160, "ella": 170, "aiden": 180};          // cousin -> arrival passage number
const ORDER = ["madison","carson","reid","chayten","kellen","kiera","ella","aiden"];

let state;
function fresh(){ return { current:"cover", visited:[], played:{}, aidenCrown:false }; }
function save(){ try{ localStorage.setItem("old-roar", JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem("old-roar"); state = s?JSON.parse(s):fresh(); }catch(e){ state=fresh(); } if(!state.played) state.played={}; }
function restart(){ state=fresh(); save(); render(); }

function go(t){
  state.current = t;
  const n = parseInt(t,10);
  if(SCENES[n] && SCENES[n].arrival){ state.played[SCENES[n].arrival]=true; }
  if(SCENES[n] && SCENES[n].aidenDeep){ state.aidenCrown=true; }
  if(!state.visited.includes(t)) state.visited.push(t);
  save(); window.scrollTo(0,0); render();
}

function playedCount(){ return ORDER.filter(c=>state.played[c]).length; }

function renderProgress(){
  if(state.current==="cover") return "";
  const pc = playedCount();
  let h = '<div class="progress-strip"><strong>Cousins visited:</strong> '+pc+' of 8 ';
  h += ORDER.filter(c=>state.played[c]).map(c=>'<span class="tag">'+c.charAt(0).toUpperCase()+c.slice(1)+'</span>').join('');
  h += '</div>';
  return h;
}

function btn(target,label,sub,cls){
  return '<button class="'+(cls||'')+'" onclick="go(\''+target+'\')">'+label+(sub?'<span class="sub">'+sub+'</span>':'')+'</button>';
}

function renderCover(){
  return '<figure class="illus"><img src="images/cover.webp" alt="The Old Roar, book cover"></figure>'
    + '<div class="scene-text">'
    + '<p>Eight cousins. One cove. A man with clipboards who wants to drain the lake and build a data center on the dry bed.</p>'
    + '<p>Read the opening straight through. Then follow the cousins into <em>The Old Roar</em>, the world that lives under the lake, in any order you like. When you have walked as many of their paths as you want, everyone meets again at the dock.</p>'
    + '</div>'
    + '<div class="choices">'
    + btn("1","Begin reading \u25B8","Passage 1 \u2014 the synchronized jump")
    + '</div>';
}

function renderHub(){
  const pc = playedCount();
  let h = '<figure class="illus"><img src="images/table.webp" alt="The eight cousins gathered"></figure>'
    + '<div class="scene-text">'
    + '<p>The Harbor Keeper steps aside. Eight paths lead away from the meadow, one shaped for each cousin.</p>'
    + '<p>Follow any cousin into their region. Read them in any order, as many as you like. When you are ready, bring everyone home to the dock for the showdown.</p>'
    + '</div><div class="choices"><div class="hub-grid">';
  ORDER.forEach(c=>{
    const pl = state.played[c] ? 'played' : '';
    h += btn(String(ARRIVAL[c]), COUSINS[c], '', 'hub-grid-btn '+pl).replace('class="hub-grid-btn '+pl+'"','class="'+pl+'"');
  });
  h += '</div>';
  const sub = pc<8 ? 'Best after you have visited everyone, but you can go whenever you like.' : 'All eight visited. Go finish it.';
  h += btn("400","Bring everyone home to the dock \u25B8", sub, "dock-btn");
  h += '</div>';
  return h;
}

function sceneBody(sc){
  let body = sc.html || "";
  if(sc.beat){
    body += state.played[sc.beat] ? sc.played : sc.skipped;
  }
  return body;
}

function render(){
  const m = document.getElementById("main");
  document.getElementById("progress").innerHTML = renderProgress();

  if(state.current==="cover"){ m.innerHTML = renderCover(); return; }
  if(state.current==="hub"){ m.innerHTML = renderHub(); return; }

  const num = parseInt(state.current,10);
  const sc = SCENES[num];
  if(!sc){ m.innerHTML = "<p>Lost the path. <button onclick=\"restart()\">Start over</button></p>"; return; }

  let h = '<div class="scene-meta">Passage '+num+'</div>';
  h += '<div class="scene-title">'+sc.title+'</div>';
  h += '<div class="scene-text">'+sceneBody(sc)+'</div>';
  h += '<div class="choices">';

  if(sc.choices){
    sc.choices.forEach(c=> h += btn(String(c.target), c.label));
  } else if(sc.finalChoice){
    const crown = state.played["aiden"] && state.aidenCrown;
    h += btn(crown?"598":"599","Turn the page \u25B8","See how it ends");
  } else if(sc.ending){
    h += '</div><div class="endcap">\u2726 The End \u2726</div><div class="choices">';
    h += btn("cover","Read it again \u25B8");
  } else if(sc.exit){
    h += btn("hub","Back to the meadow \u25B8","Pick another cousin, or head to the dock");
  } else if(sc.next!==undefined && sc.next!==null){
    h += btn(String(sc.next),"Continue \u25B8");
  }
  h += '</div>';
  m.innerHTML = h;
}

load(); render();
</script>
</body>
</html>
