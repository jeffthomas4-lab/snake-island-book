<script>
const SCENES = {"1": {"id": 1, "title": "The Synchronized Jump", "html": "<figure class=\"illus\"><img src=\"images/jump.webp\" alt=\"The Synchronized Jump\" loading=\"lazy\"></figure><p>The truck doors open at the same time.</p><p>It is the third of July. The drive from the western side of the state took most of the day. The last twenty minutes was the long winding downhill road, narrow, no shoulder, dropping into the canyon, and you'd miss the turn entirely except for the dented unmarked mailbox at the top of it. Every year somebody in the lead car panics that they've gone past. They haven't. There it is.</p><p>The dirt parking lot is at the bottom of the hill. Eight kids tumble out of four cars, into dust and dry grass and the smell of warm rock. Sun Lakes sits below them. The cove is the bluest it's ever been.</p><p>The grown-ups are still in the parking lot arguing about who made the best time. (The mom from Madison and Kellen's car insists she did. The dad from Carson and Kiera's car disagrees on principle. Uncle Bill, putting his boat in the water, is refereeing badly across the parking lot.) They are also arguing about what time to start the pizza for tonight. Pizza is the first-night dinner. It has been the first-night dinner for as long as any of them can remember. The argument isn't about whether, it's about <em>when</em> to put the first one in the oven, which depends on how hungry the kids are, which depends on how cold the lake is, which depends on a thousand things nobody is going to actually figure out before someone just goes ahead and turns on the oven.</p><p>The dock is still there. (Reid checks. He always checks. He noticed last summer that the third plank wobbles. This summer the wobble is a little worse. He doesn't tell anyone. He never does. He just files it away with everything else he notices and never mentions.)</p><p>The kids run. Not toward the condos. Not toward the bags. Toward the dock.</p><p>This is the rule. The rule is older than any of them. The rule has no rule-maker. It just is.</p><p>When you arrive at Sun Lakes, you put your bag down and you run to the dock and you all jump in at the same time.</p><p>Madison hits the dock first, because she's the oldest and her legs are longest. She kicks her sandals off as she runs and they land in the grass behind her. Carson is next, a half-step behind. Then Reid, then Chayten and Kellen at a near-tie, then Kiera (whose legs are catching up to the older kids each year and who is going to be faster than all of them in two more summers), then Ella in her bright pink swimsuit, then Aiden, last, the smallest, his bare feet slapping the wood.</p><p>This year is different for Aiden. He learned to swim this spring. <em>Really</em> learned. He spent six weekends at the local pool with his mom and now he can do an entire lap. He still wears his bright orange life jacket every time he hits the water, Mom's rule, and his rule too. Buckled tight at the chest, leg-strap clipped, the way she showed him. Last summer he was the kid the grown-ups had to bring in, careful, double-checked, with the jacket on backwards because nobody had shown him yet. This year he knows how to buckle it himself, and he is running to the end of the dock with the rest of them, and nobody is reaching for him because nobody has to. He is going to jump in with his cousins. By himself. For the first time. And nobody is going to ask if he's sure.</p><p>He is sure.</p><p>They line up at the end of the dock. Eight kids in a row. The wood is hot under their feet. The water is so clear they can see the brown shadow of the dock pilings underneath. A heron stops fishing in the shallows and looks up at them like <em>here we go again.</em></p><p>Madison says, \"Ready.\"</p><p>Reid says, \"Ready.\"</p><p>Carson says, \"READY.\"</p><p>Chayten says, \"Ready.\"</p><p>Kellen says, \"Ready.\"</p><p>Kiera says, \"Ready.\"</p><p>Ella says, \"Ready.\"</p><p>Aiden says, \"Ready.\"</p><p>They count to three out loud, all together.</p><p>ONE.</p><p>TWO.</p><p><em>THREE.</em></p><p>Eight kids jump at once.</p><p>The splash is enormous. Eight bodies hit the water in the same second. Carson does a cannonball that is louder than physics allows. Madison goes in feet-first, a clean hard line, all core and control, the body of someone who trains. Reid hits the water like a tree falling. Kellen knifes in, and Chayten throws a flip off the end of the dock and goes in right beside him, no hesitation. Kiera does a half-twist she's been practicing. Ella goes in like a dart, fearless, and comes up with her crown of pink hair-ties somehow still intact. Aiden jumps with his eyes closed and his hand reaching for Chayten's, finding it under the water.</p><p>They surface together. Eight heads bobbing. Eight grins. The lake is exactly as cold as it always is, exactly as warm at the surface, exactly the right kind of <em>here</em> that means the trip has started.</p><p>Madison spits water. \"We're here.\"</p><p>Aiden, breathing through his nose because his sister's hand is still around his and he refuses to let go, says, \"<em>We're HERE.</em>\"</p><p>The grown-ups are walking down the path now, carrying bags, still arguing about coolers and pizza times. They look up and they see eight kids in the water and they smile at each other in the specific way grown-ups smile when they have done one thing right.</p><p>Tonight is pizza night. The big house won't smell of brisket until tomorrow, or the night after, the dads' BBQ does its slow work for the middle of the trip (two of them tend it, the ones who care about brisket the way other people care about cars). But the porch and the side yard still hold the <em>ghost</em> of brisket from years past. The wood is soaked in it. The siding is. The cushions on the deck chairs are. Even after a year of rain and snow and canyon wind, the place still smells faintly of every brisket the dads have ever cooked here. Memory has a smell. So does Sun Lakes.</p><p>The bats are not yet out. They will be, tonight, after sunset, swooping low to eat the canyon mosquitoes. The wind is not yet howling. It will, after dark, when the canyon breathes the cold air down from Grand Coulee Dam.</p><p>But for now: just water. Just sun. Just eight kids in the cove on the third of July, exactly where they belong.</p><p>The summer has started.</p><p>The summer always starts this way.</p>", "next": 2}, "2": {"id": 2, "title": "Drystone Arrives", "html": "<figure class=\"illus\"><img src=\"images/drystone.webp\" alt=\"Drystone Arrives\" loading=\"lazy\"></figure><p>It happens later in the afternoon.</p><p>The kids have done the things kids do at Sun Lakes in the first hours: unpacked into the same condos they always have (each family has the same condo every year; nobody decided this, it just is), grabbed snacks from the cooler, and scattered. The pizza dough is rising on the counter in the big house. The grown-ups are still in there laughing at something none of the kids will ever know.</p><p>Madison is reading on the grass with a tin of cookies beside her. She always brings cookies on the first day, or, some years, makes them during the trip. This was a bring-them year. She made them last night. They are chocolate-chip and they have a small amount of cinnamon in them that nobody but Aiden ever names.</p><p>Chayten is paddle-boarding back from the back dock with Aiden, who is sitting cross-legged on the front of the board holding a fishing rod and talking to it.</p><p>Reid is at the edge of the main dock, whittling a stick.</p><p>Kellen is in the grass taking shadow swings with a baseball bat. He is not hitting anything. He is doing the thing where you look out at the far-off island on the other side of the lake and you visualize the perfect arc, pitch in, weight back, hips through, contact, follow-through, the ball sailing all the way across the cove and landing on that island. He has hit that island in his head about forty times today. He is going to keep hitting it.</p><p>Carson is on the grass with a putter, hyping a mini-golf game for later in the week, a morning round before the heat beats down.</p><p>Kiera is sketching the lake in a notebook with a small soft pencil.</p><p>Ella is sitting on the porch with her chin on her hands. She is just sitting. She is not putting on makeup, not playing a game, not doing anything in particular. She is <em>with her cousins.</em> All week. No school. Nothing she has to do and nowhere she has to be. She is thinking about exactly nothing, and it is the best kind of nothing there is.</p><p>Aiden is, as established, talking to his fishing rod. (\"Wait. <em>Wait.</em> Fish are in WATER. How am I going to fish? I can't fish from the dock. I have to be IN the water. But if I'm in the water I'll scare the fish. This is, Chayten. CHAYTEN. How do people FISH.\")</p><p>The man arrives in a white pickup truck.</p><p>He pulls into the dirt parking lot. He gets out. He is wearing a hard hat. In a wide open dirt parking lot. That is the first weird thing. He has three clipboards under one arm and a tablet in his other hand. He walks down to the dock without looking up from the tablet.</p><p>Carson sees him first.</p><p>Carson says, \"Uh.\"</p><p>The man does not introduce himself. He pulls out a sign on a metal stake and hammers the stake into the grass at the head of the dock. He uses a small mallet. He hits the stake four times. He does not look up.</p><p>The sign reads:</p><blockquote class=\"banner\">COMING SOON<br>DRIEDMORE DATA CENTER, WEST CASCADIA HUB<br>GROUNDBREAKING JULY 4, 12:00 NOON<br>THIS COVE IS UNDER CONTRACT TO DRIEDMORE PROPERTIES</blockquote><p>Madison sets her book down. She walks over. She reads it twice. She knows what a data center is. She knows what they need.</p><p>Carson asks. Madison says, \"They use a LOT of water. Cooling. They want to drain the lake.\"</p><p>Aiden, paddle-boarding back, says, \"But we can't have a lake if there's no water.\"</p><p>Madison says, \"That's the whole point.\"</p><p>The man finally looks up. He sees a small group of kids standing around his sign. He sighs.</p><p>\"Don't TOUCH the sign, kids. This here is a malfeasance of zoning. I am Mr. Drystone of Driedmore Properties.\" He pronounces <em>ecosystem</em> \"echo-system\" without noticing.</p><p>Reid says, quietly, \"My family has come here for years. Why are the other people selling?\"</p><p>Drystone laughs. \"Selling? Sweetheart, the people who own this place have a dock with NO foundation. The water's eaten the ground out from under it. They can't AFFORD the geological work. Driedmore is RESCUING them. We're the good guys here.\"</p><p>(The rental families who come every summer, Madison's family, Reid's, Chayten's, Carson's, Kiera's, Ella's, Aiden's, Kellen's, don't own a square inch of Sun Lakes. They have rented the condos every July for as long as the kids have been alive. The cove belongs to the family who runs it. The rental families just <em>belong</em> to the cove. There's a difference. There's not really a difference.)</p><p>He scans something on his tablet. He does not look at any of the kids' faces.</p><p>He leaves.</p>", "next": 3}, "3": {"id": 3, "title": "The Kids Can't Fix This", "html": "<p>The kids stand around the sign for a long minute.</p><p>Reid looks at the dock. The third plank is wobbling under his weight more than it did even last summer. He bends down. He looks at the pilings underneath. He can see, in the clear water, the way the dirt around them is being pulled by the current. The dock foundation IS being eroded. Drystone is right about that part.</p><p>The kids try the obvious things.</p><p>Madison wants to find the adults. The adults are inside, finishing the lunch dishes and starting prep for tonight's brisket. Uncle Bill is out back, telling somebody a long story about the boat. Madison does not interrupt him. She also realizes, as she's standing outside the door, that her own mother has been talking about \"the situation\" all week on the phone. The grown-ups already KNOW about Driedmore. They have been talking about it for weeks. They have been quietly afraid the owners would sell, because everyone can see the dock is failing.</p><p>Reid suggests pulling the sign down. Carson says no, that's not how you win. That just makes them put up another sign and now you also have a vandalism charge.</p><p>Kellen suggests calling somebody. Kiera points out they don't know who.</p><p>Aiden, very quietly, says, \"Can we just ask the lake to stop it?\"</p><p>There is a pause. Several of the older kids laugh, but the laugh is not unkind. Madison doesn't laugh at all. She looks at Aiden. Then she looks past him.</p><p>She looks at the sunroom.</p><p>The door is half-open. Inside, the rafts are piled up against the wall, drying from the arrival-jump a few hours ago. The big inflatable unicorn is on top of the pile.</p><p>The unicorn is bobbing.</p><p>There's no wind.</p>", "next": 4}, "4": {"id": 4, "title": "Drift to the Sunroom", "html": "<figure class=\"illus\"><img src=\"images/sunroom.webp\" alt=\"Drift to the Sunroom\" loading=\"lazy\"></figure><p>The kids drift toward the main house.</p><p>The sunroom door is half-open. The big inflated unicorn is still bobbing.</p><p>Aiden walks in first. Aiden is the youngest and has not yet learned to be afraid of weird things.</p><p>The other seven follow.</p><p>The sunroom is warm, warmer than the rest of the house. The sun has been on it all afternoon and the wall of windows has trapped the heat. The plastic of the inflatables is warm against the skin. The smell is the specific smell of Sun Lakes in July: the deep-soaked brisket-memory of the side yard, sunscreen on the kids' shoulders, lake water still on their suits, warm plastic, the faint sourdough smell of pizza dough rising in the kitchen, and one other smell that nobody can name, cold and wet and faintly green, like cave water on a hot day, even though there is no cave water in the sunroom.</p><p>Madison says, \"Is that smell new?\"</p><p>Reid says, \"It feels new.\"</p><p>Chayten sets the paddle board against the wall. Kellen leans the baseball bat against the doorframe. Carson pockets his putter. Kiera closes her sketchbook. Ella stands up from where she's been sitting.</p><p>Eight kids are now standing in the sunroom, surrounded by inflatables, with no clear plan.</p><p>Aiden walks up to the unicorn raft. He places one small hand on its plastic side.</p><p>The unicorn raft is warm.</p><p>The unicorn raft tilts its big inflatable head toward him.</p><p>Aiden does not flinch. He just nods, like the unicorn raft has confirmed something he already suspected.</p><p>Outside, somewhere up the canyon, a sound begins. It is far off and getting closer. The sound is enormous and low and the kids feel it in their chests before their ears catch it.</p><p>The C-130.</p><p>It comes through the canyon a couple of times during their week here. Not every day. Just a handful of times during the trip, the giant gray cargo plane swinging low between the cliffs because the canyon is the perfect training run. The kids look forward to it. The grown-ups also look forward to it. The grown-ups pretend they don't, but they do, every single one of them. When somebody yells <em>PLANE!</em> every kid in earshot drops what they're doing and runs to the deck to watch, and every grown-up in earshot drifts to the same deck a few seconds later, all of them with the same dumb happy face when the plane comes around the bend.</p><p>But today is different. Today the sunroom is <em>humming.</em></p>", "next": 5}, "5": {"id": 5, "title": "The C-130", "html": "<figure class=\"illus\"><img src=\"images/c130.webp\" alt=\"The C-130\" loading=\"lazy\"></figure><p>The C-130 thunders past.</p><p>It is so loud the windows rattle. The frame of the sunroom shakes. The pile of inflatables shifts. Aiden grabs Chayten's hand. Reid grins. Carson covers his ears and laughs. Kiera instinctively shields her sketchbook even though it's already closed. Ella's hand mirror falls off the windowsill and onto the carpet without breaking.</p><p>The plane is huge. Through the sunroom windows, the kids can see it for a full second, gray and low and almost stupidly close to the cliffs, and then it is past, the sound trailing behind it as it disappears around the bend.</p><p>The sunroom is still humming.</p><p>The pile of inflatables is no longer a pile.</p><p>The rafts have moved.</p><p>The unicorn raft is on the floor in front of Aiden. The canoe-shaped raft is in front of Madison. A long log-shaped raft is in front of Reid. A sturdy wheeled-boat raft is in front of Carson. A racing canoe is in front of Kellen. A flat painter's raft is in front of Kiera. A small boat with golden trim is in front of Ella. A driftwood-bowed boat is in front of Chayten.</p><p>Each kid is standing in front of a raft.</p><p>Each raft was waiting for them.</p><p>Nobody says anything for a moment.</p><p>Then Aiden climbs onto the unicorn raft.</p><p>He doesn't think about it. He just does.</p><p>The unicorn raft lifts off the floor.</p><p>The walls of the sunroom go away.</p><p>The lake outside is no longer the lake outside. There is a bigger water. A <em>louder</em> water. Madison can hear it, a big sound, far off, like a waterfall. Like the BIGGEST waterfall.</p><p>Each raft starts to slide off in a different direction. The kids try to call to each other but the wind is loud. Aiden, on his unicorn, is laughing. Madison, in her canoe, is shouting instructions. Reid is calmly steering. Carson is whooping. Kellen is grinning. Kiera is open-mouthed. Ella is sitting perfectly straight with her hands folded in her lap as if she has been waiting for a royal carriage and one has finally arrived.</p><p>The last thing each kid hears is Madison's voice, far off: \"WHATEVER YOU DO, STAY ON YOUR RAFT UNTIL IT LANDS.\"</p><p>(Madison is the oldest. She always knows.)</p><p>The rafts pull them through. The sunroom is far behind them. The bigger water is below them. The C-130 is somewhere far away in a world they have just, briefly, left.</p>", "next": 10}, "10": {"id": 10, "title": "Eight Rafts Land in the Meadow", "html": "<p>The rafts land together.</p><p>Not where they were heading separately, somewhere new. A green meadow under a sky that is the color of green water seen from underneath. The grass is the brightest green any of the kids have ever seen. The air smells like rain that has not happened.</p><p>They climb off their rafts. They stand in a loose group. They check that everyone is here. Madison counts heads. Eight. Good.</p><p>A roaring sound is filling the meadow from every direction. It is the sound Madison heard from her canoe, bigger, louder, more present. It is a waterfall. It is <em>every</em> waterfall.</p><p>In front of them, where the meadow falls away, they can see why.</p><p>Dry Falls is wet.</p><p>Dry Falls, the enormous cliff at the head of the canyon, the one that is in every school field trip the kids have ever taken in this part of the state, the one that has been a <em>dry</em> falls for fifteen thousand years, is <em>roaring.</em> Water coming over the lip in a sheet a thousand feet wide. The sound is the sound of geology happening.</p><p>Aiden whispers, \"<em>Oh.</em>\"</p><p>Carson whispers, \"<em>Whoa.</em>\"</p><p>Madison says, \"Where are we?\"</p><p>A voice from behind them, warm and low and amused, says, \"Lake family. <em>Good.</em> Been too quiet around here.\"</p><p>The eight kids turn.</p>", "next": 11}, "11": {"id": 11, "title": "The Harbor Keeper", "html": "<figure class=\"illus\"><img src=\"images/harbor_keeper.webp\" alt=\"The Harbor Keeper\" loading=\"lazy\"></figure><p>He is sitting on a log at the edge of the meadow.</p><p>He is large. Not big-as-a-tree-being large, not big-as-a-mammoth large. Just <em>human</em> large, broad shouldered, a little stooped, the size of a grown-up uncle who has spent a lifetime carrying things. He has a beard the color of cedar bark. He is wearing what looks like a faded denim shirt and suspenders. He has work boots. He has a beat-up canvas hat pushed back on his head.</p><p>He is whittling.</p><p>A small pile of wood shavings has gathered at his feet.</p><p>He looks up as the kids turn.</p><p>He smiles.</p><p>The smile is <em>specifically familiar.</em></p><p>Reid notices it first, in the part of his brain that notices things without telling anyone. The smile is Uncle Bill's smile. The exact one Uncle Bill uses when he is about to give them a small job to do and is going to enjoy watching them do it. Reid does not say so out loud. He just keeps watching the Harbor Keeper's hands.</p><p>The man says, \"Sit down, sit down. Don't stand around looking like you got off a bus.\"</p><p>He gestures to a half-circle of flat stones around the log. They are the perfect height for sitting. They were not there a second ago.</p><p>The kids sit.</p><p>The man keeps whittling. He does not introduce himself for a while. He just works. The shavings curl off his knife in long thin spirals. Aiden watches with the kind of attention Aiden gives to things that are mysterious and excellent.</p><p>After a long minute, the man says, \"You can call me the Harbor Keeper. That's the name I have on this side. I have had others. Last visitor I had, a long time ago, called me something else. I don't remember what. I have a bad memory for what people call me. I have a <em>good</em> memory for the people themselves.\"</p><p>Madison says, \"What... what is this place?\"</p><p>The Harbor Keeper looks up. \"You're in The Old Roar. That's the name for what's underneath your cove. Underneath every place that gets loved enough, long enough, by the same families coming back year after year. The Old Roar is the memory of the land. It is the <em>attention</em> the land remembers being given. Your families have been giving this lake attention for a long time. The lake remembers. So do I.\"</p><p>He puts the whittling down. He looks at each of the kids in turn.</p><p>He says, \"Madison. Carson. Chayten. Reid. Kellen. Kiera. Ella. Aiden.\"</p><p>Nobody told him their names.</p><p>The kids do not react the way kids in movies do. They do not gasp. They just sit there and absorb it. Aiden, characteristically, just nods like he already suspected.</p><p>The Harbor Keeper says, \"There is a problem at your dock. I know about it. The lake knows about it. The Old Roar is connected to your cove and what happens up there happens down here. If your lake gets drained, this world ends. So. We need to fix it.\"</p><p>He stands up. He stretches. His knees crack like old wood.</p><p>\"Each of you can earn something here. Something that will help up there. There are eight things to find, one per kid. None of you can earn another kid's thing. Each one is shaped for you specifically. The Old Roar already knows what you need. You'll find it because the world will lead you to it.\"</p><p>He turns and gestures across the meadow. The grass behind him opens out into eight different regions, visible all at once, a quiet pool, a driftwood stage, a wide grassy plain, a rocky woodland, a long flat lake, a basalt cliff, a moss circle, a meadow with a sideways-growing rainbow.</p><p>The Harbor Keeper says, \"Each region is shaped for one of you. The Pool is for Madison. The Plains are for Carson. The Wood is for Reid. The Stage is for Chayten. The Skipping Lake is for Kellen. The Painted Cliff is for Kiera. The Bright Water Court is for Ella. The Meadow is for Aiden.\"</p><p>He looks at each kid as he says their name. The grass paths to the eight regions glow, faintly, one at a time.</p><p>\"You'll each go to your own. The world will lead you. When you've earned what you came for, the way home will find you. We'll all meet back here when it's time.\"</p><p>He picks his whittling back up. He gives them a small nod.</p><p>\"Off you go, then. The lake is waiting.\"</p><blockquote class=\"banner\"><strong>Reader: pick a cousin to follow first. Each cousin's chapter starts on its own page. When that cousin's chapter is done, the book will tell you where to go next. You can read them in any order. When you've read as many as you want, the Showdown is waiting at Passage 500.</strong><br><br>Madison at the Quiet Pool — turn to Passage 110.<br>Carson at the Coulee Plains — turn to Passage 130.<br>Reid at Old Speak's Wood — turn to Passage 140.<br>Chayten at the Driftwood Stage — turn to Passage 120.<br>Kellen at Skip-Stone Lake — turn to Passage 150.<br>Kiera at the Painted Cliff — turn to Passage 160.<br>Ella at the Bright Water Court — turn to Passage 170.<br>Aiden at the</blockquote>", "next": "hub"}, "110": {"id": 110, "title": "Arrival at the Quiet Pool", "html": "<figure class=\"illus\"><img src=\"images/madison_region.webp\" alt=\"Arrival at the Quiet Pool\" loading=\"lazy\"></figure><p>Madison's raft slides to a stop on the shore of a pool so still you could roll a coin across it.</p><p>The raft is a wooden canoe now, with her name carved into the side: <strong>MADISON</strong>. The tin of cookies she was holding in the sunroom is still in her lap. None of them are crushed. (She checks.)</p><p>The pool is shaped like a heart, if a heart had been drawn by someone who'd never seen one. Rocks at the edge. Cottonwoods leaning over the water. A heron standing on one leg in the shallows, looking at her like she's late.</p><p>She's alone. The other seven landed somewhere else. The silence is bigger than she expected. She steadies herself. Oldest kid. She knows what she's doing.</p><p>Three heads pop up out of the water.</p><p>Three girls. One her age. One younger. One small.</p><p>Their hair drips upward instead of down.</p><p>The oldest one tilts her head. \"Are you the cookie-bringer?\"</p><p>The middle one says, \"She IS the cookie-bringer.\"</p><p>The youngest one is already chewing on something.</p><p>The oldest climbs out. Her feet leave wet prints that turn into flowers. \"I'm Pip. That one's Lark. The one chewing is Wren. Wren, what are you eating.\"</p><p>Wren opens both hands. They're full of pondweed she's mashed into the shape of a cookie. It is the saddest cookie Madison has ever seen.</p><p>\"It's my OWN recipe,\" Wren says.</p><p>\"It's TERRIBLE,\" Pip says.</p><p>Madison opens her tin. The cookies inside smell like brown sugar and brisket smoke and home.</p><p>She is about to share them.</p><p>Then Lark says: \"Wait. First, sit down.\"</p>", "next": 111, "arrival": "madison"}, "111": {"id": 111, "title": "The Cared-for Moment", "html": "<figure class=\"illus\"><img src=\"images/lake_sisters.webp\" alt=\"The Cared-for Moment\" loading=\"lazy\"></figure><p>\"Wait. Don't sit. STAND. We have been watching you walk down the bank.\"</p><p>Madison blinks. \"Why?\"</p><p>Pip steps closer. \"You're a DANCER. We can tell from how you walk. The way your feet land. The way your spine moves with your head. We have been HOPING for a dancer for a very long time.\"</p><p>Lark says, \"We knew one of you would be. Pools know. We have been WAITING.\"</p><p>Madison is a little surprised. She knows she's a good dancer, her teacher has told her, her family has told her, she has the trophies and the placements in her room that say so. But she has never met an audience this hungry for a dancer. The Sisters are looking at her the way people look at something they've been hoping to see for years.</p><p>Wren tugs her hand. \"Can we see you do something? Please? We've been thinking about it for so long.\"</p><p>Pip raises one small wet hand. Three flat stones lift from the pool and hover an inch above the surface, forming a small triangular stage just within Madison's reach. The water around them goes glassy.</p><p>Madison thinks for one second. Then she picks the adagio, the one her teacher built FOR her last semester. The hardest one she does in studio. The long arabesque. The turn that took her three months to clean.</p><p>She steps onto the first stone. Her body knows what to do.</p><p>She dances three measures. They are very good measures. The arabesque is exactly as long as it should be. The turn lands clean. People think dance is softness. It is not. It is strength held so well it looks like floating, every line powered by legs and a core she has trained until they could hold a building steady. She has danced this same sequence a hundred times. She has never danced it with this much attention from an audience.</p><p>The three Sisters do not clap. They do not whistle. They WATCH the way an audience that has been waiting for years watches when the wait is finally over, with their full faces, with their breath held, with the quiet that says <em>please don't let this end</em>.</p><p>When she steps off the last stone, the pool ripples in a pattern around the three stones that looks, faintly, like a standing ovation made of water.</p><p>Pip whispers: \"Thank you, Madison. That was BEAUTIFUL.\"</p><p>Lark wipes a Sister-tear that goes up. \"We don't get dancers. People don't dance for a pool. They dance for other people. You danced for us anyway.\"</p><p>Madison feels something specific in her chest. Not surprise, she knew she could do it. Not the warmth of being praised, she gets praised, that's familiar. Something newer than that: the warmth of having SHARED something she loves with an audience that genuinely, specifically needed to see it. Her grace went somewhere today that it has never gone before. Three small water-girls had been waiting for years for it. She brought it.</p><p>She sits down on the bank. Her hair drips upward, just a little. She catches sight of herself in the pool's reflection, breath steady, all three Sisters still beaming at her, and laughs out loud. The laugh of someone who brought a gift and discovered the gift was exactly the right one.</p><p>Pip puts a small wet hand on Madison's knee. \"And one more thing, before you go. You are Madison the Dancer, who shares her grace with audiences who deserve to see it. The pool will remember that name. You should too.\"</p><p>Pip nods. \"Go back to your cousins now. We will remember today for a very long time. You were exactly what we had been hoping for.\"</p><p>Madison laughs. It's a real laugh, the kind that surprises her on its way out.</p><p>The Sisters wait. They've done their part. The rest is hers.</p><p>Pip says, \"We have something to tell you. About the lake-up-above. About the man with the clipboards.\"</p><p>Madison sits forward.</p><p>She is, in fact, ready now.</p>", "next": 112}, "112": {"id": 112, "title": "Madison's Choice", "html": "<p>Pip tells her the rest fast.</p><p>The Lake Sisters have been watching the lake-up-above for years. They've seen Mr. Drystone's boats. They've seen him drop papers into the water, papers they were never meant to read. The papers sank. The Sisters caught them. They have them now.</p><p>But the papers are in three pieces, and only one piece is here at the pool. The other two are elsewhere.</p><p>Pip is holding the first piece. It glints in her hand.</p><p>\"How do you want to do this?\" Pip asks.</p><p>Madison thinks for a second.</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Take the piece Pip has and head back to the others", "target": 113}, {"label": "Ask the Sisters what they need from YOU first", "target": 114}, {"label": "Notice that Wren has gone quiet and ask her what's wrong", "target": 115}]}, "113": {"id": 113, "title": "Share the Cookies, Take the Piece", "html": "<p>Madison opens her tin and shares the cookies fairly. One for Pip. One for Lark. The biggest one for Wren, because Wren is smallest.</p><p>(Wren cries with joy. Lark and Pip do not comment. They've seen Wren cry over a particularly good rock.)</p><p>The Sisters eat their cookies the way creatures eat who have never had anything baked before. Pip nibbles. Lark inhales hers in two bites. Wren tries to make her cookie last by licking it.</p><p>When they're done, Pip looks at her sisters. The three of them nod at each other in the way of people who have just received something and now have to give something back. (That's how exchanges work in the Old Roar. You bring something. They bring something. That is the whole agreement.)</p><p>Lark slips back into the pool and comes up holding a small, perfectly round, lavender-colored stone. It is warm in her hand. It is glowing very faintly, the way a smooth river rock looks when a kid pulls it out of shallow water and holds it up to the sun.</p><p>\"For you,\" she says. \"It's a <em>quiet stone.</em> Hold it when a place is too loud. It pulls the noise into itself and gives you back about ten seconds of quiet. Sisters made it. It only works if you got it from a sister.\"</p><p>Madison closes her hand around it. It is exactly the kind of thing she did not know she needed and has needed her whole life.</p><p>Wren hands her something next. It is a small pondweed-and-pebble bracelet she has clearly been making during the cookie sharing. It is, like Wren's cookie, the saddest bracelet ever assembled.</p><p>\"I MADE it,\" Wren says, very proud.</p><p>\"It's beautiful,\" Madison says. And means it.</p><p>(She slips it on her wrist. It tickles. She does not take it off.)</p><p>Then Pip hands Madison the paper.</p><p>It is a single sheet, water-warped at the edges, the ink swimming a little but readable. It shows the cove. It shows the data center building Drystone plans to put on the dry lakebed once the water is gone. It shows the drainage path, straight down the canyon, into the river system, away forever.</p><p>It does NOT show the bank fraud. It does NOT show the lowballed appraisal. Those pieces are elsewhere.</p><p>Madison rolls the paper carefully and tucks it inside her cookie tin. The tin clicks closed. It is warm in her hands.</p><p>\"This is most of it,\" Pip says. \"Not all. But you'll know what to say.\"</p><p>Madison nods.</p><p><em>If the reader has already played Aiden's branch and unlocked Pegasus, a small rainbow arcs over the pool for no reason. Lark looks up. \"Huh,\" she says. \"That hasn't happened before.\" Madison doesn't know what it means yet. She will.</em></p><p>Wren tugs her hand. \"Will you come back?\"</p><p>Madison kneels so she's eye-level with the smallest Sister. Wren's eyes are the color of pool water in the morning.</p><p>\"Yes,\" Madison says.</p><p>She means it.</p><p>The Sisters walk her back toward the meadow. Pip stops at the edge of the trees. \"Tell our older sister hi.\"</p><p>Madison says, \"Who's your older sister?\"</p><p>Lark says, \"The big one. The one your hotel is named for. The cove.\"</p><p>Madison stops walking.</p><p>The lake at home. <em>Their</em> lake. The one she's been swimming in every July of her life. The one her cousins all swim in. The one Aiden took his first dip in last summer with his life jacket on backwards.</p><p>That lake is family to these girls.</p><p>That lake is family to HER.</p><p>She feels something land in her chest that she's been almost-knowing for years.</p><p>She walks back to her canoe with the Map in her tin and a feeling in her chest she'll figure out later.</p>", "next": 116, "depth": "SILVER"}, "114": {"id": 114, "title": "Ask What They Need First", "html": "<p>Madison doesn't open the tin yet.</p><p>She looks at Pip and says, \"What do you NEED?\"</p><p>Pip blinks. Lark blinks. Wren stops chewing.</p><p>\"Most people,\" Pip says slowly, \"don't ask us that.\"</p><p>Lark adds, \"Most people are HUNGRY for what we have. They don't notice we might need something too.\"</p><p>Madison waits.</p><p>The Sisters look at each other in the way sisters look at each other.</p><p>Pip says, \"The other two pieces of the map. We can't reach them.\"</p><p>The first piece, the one Pip is holding, sank near the pool, easy to catch.</p><p>The other two sank farther downstream. Out past where the pool turns into a slow river. Out where a grumpy old beaver named <strong>Branch</strong> has been collecting interesting things in his lodge for two hundred years. Branch caught the other two pieces and he will not give them back. He says the river is his and what lands in the river is his.</p><p>The Sisters have asked him a hundred times. He always says no.</p><p>\"He might say yes to YOU,\" Pip says. \"He likes people who SIT.\"</p><p>Madison thinks about her own grandmother. Her grandmother also liked people who sit.</p><p>Madison says, \"Take me to him.\"</p><p>The Sisters slip into the water. Madison walks along the bank. Lark pops up every few steps to point. The pool narrows. The water starts moving. Cottonwood leaves spin past on the current.</p><p>At a bend in the river, a beaver lodge the size of a small cabin rises out of the water. Smoke comes out of a hole in the top. The smoke smells like dried mint.</p><p>Madison knocks on a stick.</p><p>A grumpy face appears. <strong>Branch</strong>. He has a small pair of spectacles on the end of his nose and a tea towel over one shoulder.</p><p>\"What.\"</p><p>Madison says, \"Hello, Branch. I'm Madison. May I come in?\"</p><p>Branch is suspicious. But Madison didn't lead with what she wanted. Branch finds this confusing in a way he likes.</p><p>\"...Fine.\"</p><p>Inside the lodge: a tiny rocking chair, a tea kettle on a stone fire, and a wall of WONDERFUL trash. A spoon. A fishing lure. A pair of sunglasses. A small ceramic pig. Two folded pieces of paper that Madison's eyes go to immediately and then, very deliberately, away from.</p><figure class=\"illus\"><img src=\"images/branch_beaver.webp\" alt=\"Ask What They Need First\" loading=\"lazy\"></figure><p>Branch pours her a thimble of tea. (For a beaver, a thimble is a normal-sized cup. For Madison, it is approximately one drop.)</p><p>She sits.</p><p>She sips her one drop of tea.</p><p>She does not ask about the papers.</p><p>She asks about the spoon.</p><p>Branch lights up. He tells her about the spoon. The spoon takes nine minutes. Then he tells her about the ceramic pig. The pig takes longer.</p><p>Forty minutes go by. (Time in The Old Roar is slower, but still, forty minutes is forty minutes. The Harbor Keeper said <em>time for four</em>. She's spending it.)</p><p>At the end of his stories, Branch is quiet for a long time. Then he says, \"You're the first person in two hundred years who didn't ask me for the papers first.\"</p><p>Madison says, \"I figured you'd tell me about them when you wanted to.\"</p><p>Branch hands her the two folded papers without ceremony.</p><p>Then he says, \"I'm coming with you.\"</p><p>Madison says, \"To the lake-up-above?\"</p><p>\"To wherever the man with the clipboards is,\" Branch says. \"I'll witness.\"</p><p>She rolls the three pieces of the Map together. Now it shows everything: the drainage, the data center, the bank fraud, the lowballed appraisal, the wrong permit Drystone filed. The whole shape of the lie.</p><p>Branch waddles to the door, picks up a small bow tie from his wall of trash, and clips it on.</p><p>\"Ready,\" he says.</p>", "next": 116, "depth": "CROWN"}, "115": {"id": 115, "title": "Notice Wren First", "html": "<p>Madison was about to open her tin.</p><p>She doesn't.</p><p>Because Wren has gone quiet.</p><p>The smallest Sister was chewing her pondweed cookie a second ago. Now she's holding it in both hands and staring at the pool.</p><p>Madison kneels. \"Wren. Hey. What's the matter?\"</p><p>Pip and Lark go still.</p><p>Wren says, in a voice so small Madison has to lean in: \"She didn't sing last night.\"</p><p>Madison says, \"Who didn't?\"</p><p>Pip says, very quickly, \"Nobody. It's nothing.\"</p><p>Lark says, \"Pip.\"</p><p>Pip closes her mouth.</p><p>Wren says, \"The lady. The one who sings.\"</p><p>Madison sits down on the bank. The wood is warm. \"Tell me.\"</p><p>The Sisters look at each other. Then Pip nods.</p><p>Lark sings, very quietly, three notes. The pool hums them back. The three notes are beautiful, clear, full, the kind of voice that carries.</p><p>\"That's HER voice,\" Wren says. \"She sings here some nights. Not all. Some. She's been singing here for as long as we've been here. We don't know who she is. The lake remembers her. We listen for her.\"</p><p>Madison's skin prickles.</p><p>Because Madison knows that voice.</p><p>She doesn't know HOW she knows it. She just does. Like the way she knows the smell of brisket smoke. Like the way she knows the sound of the C-130 a full second before it shows up over the canyon.</p><p>She HAS heard this voice. Two summers ago. A hot July night, late, after the brisket was gone and the kids were supposed to be asleep. The sound came across the water from somewhere nobody could place, somebody, somewhere, singing opera. Big, beautiful, impossible. The grown-ups had laughed about it the next morning. They'd all pretended not to know who it was. The mystery had become a family joke.</p><p>But Madison had watched her mother's face that next morning. Her mother had been very busy looking at her coffee.</p><p>Madison feels her chest do a thing.</p><p>She doesn't say anything yet.</p><p>She says: \"Why didn't she sing last night?\"</p><p>Pip says, \"We don't know. She comes when she comes. When she doesn't, the lake is quieter than it should be. Wren feels it most.\"</p><p>Wren is crying without making a sound. The tears go up her face instead of down.</p><p>Madison does the thing she does best in the whole world.</p><p>She puts an arm around the smallest Sister. She doesn't say <em>it'll be okay</em>. She doesn't say <em>don't worry</em>. She just holds her and lets her cry the wrong direction.</p><p>After a while, Pip says quietly, \"There's another piece of the map.\"</p><p>Madison says, \"I thought there were three.\"</p><p>Pip says, \"There are. But there's also a fourth. It's not on paper. It's a song. The song the lady sings. If you can hear it, you'll know what the lake itself thinks about Mr. Drystone. The lake has an opinion.\"</p><p>Lark says, \"It's not loud. But it's real.\"</p><p>Madison thinks for a second.</p><p>Then she does the only thing she can do, the thing she's actually good at.</p><p>Pip seems to know. She lifts a hand. Three flat stones rise up out of the pool, one after another, arranged in a line across the water. They are perfectly still. They are also, Madison notices, the same color as the basalt at home.</p><p>Madison steps onto the first one. It holds.</p><p>She knows the count before her head does. She has danced this same sequence a hundred times this spring; her body falls into it the way an old book falls open at the right page.</p><p>She steps to the second stone in one clean line, the way her old teacher used to drill it: head up, shoulders down, the foot finding the place before you trust it. She turns once on the second stone. She lands.</p><p>She crosses to the third stone and finishes in fourth position, arms soft, eyes closed.</p><p>She holds it.</p><p>The pool hums.</p><p>Three notes. Low. Then a long pause.</p><p>And then, from somewhere far away, maybe under the pool, maybe somewhere on the other side of the canyon, three notes come back. Sung in answer. The voice is a woman's. Operatic. Big. Beautiful. She is singing in The Old Roar tonight after all. She is answering Madison's dance the way a singer answers a question.</p><p>Wren laughs through her wrong-direction tears.</p><p>Pip presses both hands to her mouth.</p><p>Lark just listens.</p><p>The lady's song goes on for a long minute. None of them speak. Madison's eyes are wet too, though she couldn't tell you why.</p><p>When the song ends, Pip hands Madison the first piece of the map. Then she dives into the pool and comes up holding the second piece, then the third. They were here all along. The Sisters had been waiting to see if she was the right person to give them to.</p><p>She is.</p><p>The three pieces fit together cleanly. The whole Map. Everything Drystone has done, everything he plans.</p><p>\"And the song?\" Madison asks.</p><p>Pip says, \"You'll carry it. The lake will remember that you heard.\"</p><p>Madison rolls the Map. She tucks it in her tin.</p><p>The tin glows, very faintly, like firelight inside a paper lantern.</p><p>She doesn't know what she's going to tell her mom about this later.</p><p>She'll figure it out.</p>", "next": 116, "depth": "CROWN"}, "116": {"id": 116, "title": "Exit: the Sisters Wave Her Off", "html": "<p>Madison walks back toward her canoe.</p><p>The Sisters wave from the water. Their hair drips upward. Wren waves with both hands and a half-eaten pondweed cookie.</p><p>Pip calls after her: \"Tell our older sister hi.\"</p><p>Madison stops.</p><p>She turns back. \"Who's your older sister?\"</p><p>Lark says, \"The big one. The one your hotel is named for. The cove.\"</p><p>Her canoe is waiting.</p><p>She steps in.</p><p>She has the Map. She has, somewhere in her bones, the start of a feeling about chosen family that she's going to need at the dock in about an hour.</p><p>The canoe pushes off. The Sisters wave from the water.</p><p>Madison heads back toward the sound of the C-130, faint and far, somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "130": {"id": 130, "title": "Arrival on the Coulee Plains", "html": "<figure class=\"illus\"><img src=\"images/big_coulee.webp\" alt=\"Arrival on the Coulee Plains\" loading=\"lazy\"></figure><p>Carson's raft slides to a stop on a wide grass plain that goes farther than his eyes can follow. The raft has become a sturdy wooden boat on tiny wheels. He hops out. The grass is the bright kind, the kind that only grows when there's been a lot of rain.</p><p>There is a thumping coming from across the field.</p><p>Big thumping.</p><p>Carson grins before he even sees what it is.</p><p>A wooly mammoth jogs into view, chest out, trunk held high, talking to herself out loud.</p><p>\"AND BIG COULEE rounds the bend,\" she announces. \"Looking STRONG. Looking FAST. Looking like the CHAMPION she was BORN TO BE.\"</p><p>She is wearing a flower crown. The crown is too small for her head and tilts over one eye. Two baby mammoths the size of large dogs jog beside her, occasionally falling over and getting back up.</p><p>She sees Carson. She skids to a stop in a way that produces a small dust cloud.</p><p>\"CHILD,\" she says. \"Are you here for the GAMES?\"</p><p>He's alone. No Aiden to keep an eye on. No cousins to organize. Just him and a wooly mammoth in a flower crown. It is the strangest, most peaceful feeling he's had in months.</p><p>Carson opens his mouth to ask what the games are.</p><p>Big Coulee is already telling him.</p><p>She doesn't stop for breath.</p><p>She is, he realizes, the loudest creature he has ever met. He likes her immediately.</p>", "next": 131, "arrival": "carson"}, "131": {"id": 131, "title": "The Go-hard Moment", "html": "<figure class=\"illus\"><img src=\"images/carson_region.webp\" alt=\"The Go-hard Moment\" loading=\"lazy\"></figure><p>Big Coulee explains. The Long Race is in thirty minutes. She has been training for six moons. Her babies keep wandering off. She is NERVOUS. She needs a worthy opponent.</p><p>\"WILL YOU RACE ME?\"</p><p>Carson is about to say yes when Big Coulee does something he doesn't expect.</p><p>She rams him.</p><p>Not hard. Not anywhere near hard. A nudge with her flank, the kind of nudge a wooly mammoth might give a tree she's not sure is in her way. Carson is one boy and Big Coulee is roughly ten thousand pounds. He goes sprawling. Lands in the grass. Laughing.</p><p>\"GET UP,\" Big Coulee bellows, cheerfully. \"RAM ME BACK.\"</p><p>Carson stands up. He looks at Big Coulee. Then he runs at her, shoulder lowered. He puts his entire body into the shove. He hits her side at full speed.</p><p>She doesn't move. Her flower crown slips slightly.</p><p>She <em>cheers.</em></p><p>\"YES. YES. THAT is what I am TALKING about, child. Do you SEE? You can't hurt me. You couldn't hurt me if you ran at me with a TRUCK. Stop holding YOURSELF in. I have raced thirty competitors in six moons and every one of them softened it. Every one of them. They thought I would be sad if I lost. Do you know what that's like?\"</p><p>Carson does, in fact, know what that's like.</p><p>\"Today you race like you mean it. Like a champion. Not like an older cousin. Race ME. You can be polite tomorrow.\"</p><p>\"Okay.\"</p><p>Big Coulee lowers her enormous head, eye level with Carson. Her voice drops, the only quiet sentence she has said all day. <em>\"You don't have to soften today, child. People follow the loud ones because they have to. They follow you because they already wanted to. Run like you mean it.\"</em></p><p>She straightens up. \"<em>EXCELLENT.</em> Then we have a RACE. Choose your path.\"</p>", "next": 132}, "132": {"id": 132, "title": "Carson's Choice", "html": "<p>Big Coulee paws the ground.</p><p>\"How do you want to race?\" she asks. \"I am open to RULES, child. I love a rule. Make ONE.\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Say \"just race, straight to the finish line, fastest one wins,\"", "target": 133}, {"label": "Say \"race AND we gather your babies along the way, most babies at the end wins,\"", "target": 134}, {"label": "Stop and look at Tuft and Tumble, who are anxious and bumping into each other, and say \"race in twenty. Let's settle them first,\"", "target": 135}]}, "133": {"id": 133, "title": "Race Straight", "html": "<p>Carson grins. \"Just race. Straight to the finish line. Fastest wins.\"</p><p>Big Coulee's eyes light up. She rears back onto her hind legs (a thing that should not be physically possible for a wooly mammoth and yet) and trumpets so loud the grass flattens for ten feet around her.</p><p>\"YES.\"</p><p>The bird on her ear (her name is Pip-Pip; she is small and self-important and carries a tiny clipboard) flutters over and explains the rules. Two flagged poles a quarter-mile apart. Around the far pole. Back. First nose across the line wins.</p><p>Carson stretches. Big Coulee stretches. (Big Coulee's stretches involve her entire body and look like a yoga teacher trying to invent a new pose.)</p><p>Pip-Pip raises a tiny flag.</p><p>Lowers it.</p><p>\"GO.\"</p><p>Carson runs. He hasn't run this hard since the eighth-grade two-mile time trial. His lungs are burning before he gets halfway. Big Coulee is way ahead of him, thundering, narrating: \"AND BIG COULEE TAKES the EARLY LEAD, child! She is APPROACHING the far pole! She is ROUNDING it!\"</p><p>He keeps going. He's not going to win. He knows he's not going to win.</p><p>He's having the time of his life.</p><p>He rounds the far pole maybe twenty seconds behind her. She is already a quarter of the way back, her trunk pumping like a metronome, the flower crown bouncing on her head.</p><p>He sprints anyway. Full effort. No backing off.</p><p>Big Coulee crosses the line first. She rears back again, trumpets, and starts a victory lap before Carson is even close.</p><p>He finishes ten seconds behind her, gasping, hands on his knees.</p><p>Big Coulee thunders back to him. She is delighted. She picks him up in her trunk and sets him on her back, where he sits sideways and laughs because he is too tired to do anything else.</p><p>\"CHILD,\" she says. \"You ran like you MEANT it. That is rare and that is GOOD.\"</p><p>Pip-Pip presents the prize from her clipboard: a small, smooth piece of polished mammoth tusk on a leather cord. The Tusk-Charm. \"Carved from my own great-grandmother's tusk,\" Big Coulee says. \"Whoever wears this, when you stand somewhere and ask people to stand with you, they will. It works because they already wanted to. The charm just makes the asking visible.\"</p><p>Carson loops the cord around his neck. The charm is warm against his collarbone.</p><p><em>If the reader has played Madison's branch, a small spotted otter comes up to the finish line carrying a cookie. \"From the cookie-bringer,\" she says, and waddles off before Carson can ask who that is.</em></p><p>She walks him back to his boat-on-wheels. Tuft and Tumble follow her, occasionally falling over and getting back up.</p><p>\"Come back next year,\" Big Coulee says. \"I'll be in better shape. So will you. We'll do this properly.\"</p><p>Carson says, \"Deal.\"</p>", "next": 136, "depth": "SILVER"}, "134": {"id": 134, "title": "Race and Gather", "html": "<p>Carson looks at Tuft and Tumble, who are currently chewing on each other's ears.</p><p>\"Race AND we gather babies along the way,\" he says. \"Whoever gets back to the finish line with the most babies wins.\"</p><p>Big Coulee freezes.</p><p>Then she lets out a sound that is half-trumpet, half-laugh, half-cry. (Mammoths can have three halves of a sound. It's a mammoth thing.)</p><p>\"CHILD,\" she says. \"That is the BEST rule anyone has ever made. We use it FOREVER. Pip-Pip, write that down.\"</p><p>Pip-Pip, scandalized, writes it down on her clipboard.</p><p>The catch: Tuft and Tumble are not the only baby mammoths in The Old Roar. There are five more, scattered across the plain, all under three feet tall, all extremely lost. The race is on. The first to thirty babies (or to be more accurate, the first to all seven) wins.</p><p>Pip-Pip drops the flag.</p><p>Carson sprints. Big Coulee thunders. They peel off in different directions.</p><p>Carson finds the first baby in a patch of wildflowers, a small mammoth so covered in pollen she sneezes when he picks her up. He tucks her under his arm. Two more are stuck in a bramble together. He frees them. They cling to his legs and waddle behind him.</p><p>By the time he reaches the far pole, he has four babies, one under each arm, two clinging to his back. He turns. Big Coulee is coming the other way with three babies on her broad back and one in her trunk.</p><p>She sees him. She brakes hard. She trumpets, \"CHILD. YOU ARE TIED WITH ME.\"</p><p>Carson is laughing too hard to answer.</p><p>The last baby, the smallest, no bigger than a loaf of bread, is sitting in the middle of the field, very confused, eating a flower. Carson and Big Coulee both stop.</p><p>They look at each other.</p><p>\"It would be a TIE,\" Carson says.</p><p>Big Coulee narrows her eyes. \"I have NEVER tied a race.\"</p><p>\"I have NEVER won a race against a mammoth.\"</p><p>They look at the baby.</p><p>The baby eats another flower.</p><p>They both run for it. They reach it at the same second. Big Coulee scoops the baby with her trunk. Carson takes its other end. They cross the finish line together, holding the same baby, with eleven other babies clinging to them.</p><p>A tie. Pip-Pip's tiny clipboard explodes. (Not literally. But she stares at it like it has betrayed her.)</p><p>Big Coulee sets the babies down and turns to Carson. Her flower crown is over both eyes now.</p><p>\"You raced like a champion,\" she says. \"AND you played fair when you could have stolen the last baby. AND you let it tie. Do you know how rare that is, child?\"</p><p>Carson shrugs.</p><p>Big Coulee gives him the Tusk-Charm. Then she does something Pip-Pip has never seen her do: she breaks a small piece off the corner of her own tusk and adds it to the charm with a thread of grass. The charm is heavier now. It glows faintly.</p><p>\"That,\" she says, \"is so you can call me. I'll come. I'll come ANYWHERE. I have very loud lungs and I am not afraid of the man with the clipboards.\"</p><p>She bumps her forehead against his, gently. The flower crown drops over his head and stays there for a moment.</p><p>\"Take it,\" she says. \"It looks better on you anyway.\"</p><p>Carson laughs. He puts the flower crown back on her head.</p>", "next": 136, "depth": "CROWN"}, "135": {"id": 135, "title": "Settle the Babies First", "html": "<p>Carson is about to say something competitive.</p><p>Then he looks at Tuft and Tumble.</p><p>The two baby mammoths are bumping into each other. Their trunks are tangled. One of them, Tumble, he thinks, is making a small worried sound. The other is trying to nurse on Big Coulee's leg and is being gently kicked off because Big Coulee is in race mode.</p><p>Tuft and Tumble are scared. They don't want their mom to leave.</p><p>Carson doesn't know how he knows this. He just does.</p><p>He says, \"Race in twenty. Let's settle them first.\"</p><p>Big Coulee snorts. \"Child. The race is in THIRTY MINUTES. I have been TRAINING.\"</p><p>\"They're scared,\" Carson says. \"Look at them. They don't want you to go. We'll do it. They just need to know what's going to happen.\"</p><p>Big Coulee stops. She looks at her babies. She had not, in fact, noticed.</p><p>She lowers herself to the ground (slowly, mammoths take a minute to lower themselves) so her huge belly is on the grass and she is no taller than the babies. She gathers them in her trunk. Tuft and Tumble bury themselves in her side.</p><p>Carson kneels next to them.</p><p>\"Hey,\" he says. \"Hey, I'm Carson. Your mom is the best racer in The Old Roar. She has been getting ready to win this race for SIX MOONS. Did you know that?\"</p><p>The babies do not know. They blink at him.</p><p>\"I bet you're worried she'll go too far,\" Carson says. \"But she's not. The race is just to that pole and back. You'll be able to see her the whole time. I'll point so you know exactly where she is. Is that okay?\"</p><p>Tuft puts her trunk on Carson's wrist. Tumble climbs into his lap. (Tumble is not small. She is the size of a labrador. Carson catches her.)</p><p>Big Coulee watches.</p><p>Big Coulee says, in a voice Pip-Pip has never heard her use, \"Nobody ever stopped to talk to them before.\"</p><p>Carson shrugs. He has a little cousin. He knows what scared looks like.</p><p>They spend ten minutes calming the babies down. By the time they're done, Tuft and Tumble are leaning against Carson, half-asleep, breathing slow. Big Coulee is also calmer than she has been all morning.</p><p>The race goes ahead. Big Coulee runs. Carson runs. Big Coulee wins by a lot, Carson lost his prep time and his legs feel like wet noodles by the halfway mark. He finishes thirty seconds behind. He laughs the whole way.</p><p>Big Coulee thunders to him, scoops him up in her trunk, and brings him to where Tuft and Tumble are watching from the side.</p><p>The babies cheer.</p><p>Big Coulee sets Carson down. Her eyes are wet.</p><p>\"Child,\" she says. \"You gave up your race so my babies wouldn't be scared.\"</p><p>Carson shrugs again. \"It wasn't going to matter for the race. They were going to be scared the whole time and you would have run worse.\"</p><p>Big Coulee lowers herself. She presses her enormous forehead against his. Then she does it again, more deliberately. Then she lifts the Tusk-Charm off Pip-Pip's clipboard and presses it into his hand.</p><p>\"This is yours. But also.\" She nudges Tuft and Tumble forward. \"<em>These</em> are yours when you need them. Whatever comes, whoever you need to face, <em>we</em> will be there. The whole family. You looked out for mine. I will look out for yours. That is how it works.\"</p><p>She lowers her enormous head once more, eye level with him. \"Now I know your name, child. <em>Carson the Trustworthy.</em> Not because somebody decided. Because you earned it in front of me, with my own babies. People will follow you because they already wanted to. Remember that.\"</p><p>Carson can't quite speak. He's the kid who turns everything into a contest, who has to win the swim and the mini-golf and the race down to the dock. And the thing that just cracked his chest wide open wasn't winning. It was two scared babies leaning on him, breathing slow, trusting him to stay. He didn't know that was in him. It was.</p><p>Tuft puts her trunk on his shoulder. Tumble headbutts his hip gently.</p><p><em>If the reader has played Aiden's branch, a small bright shape passes overhead, a unicorn, faintly visible, with a small boy on her back. Big Coulee looks up. \"Oh,\" she says, delighted. \"He found his rider.\"</em></p><p>Big Coulee walks him back to his boat. Tuft and Tumble walk beside him, one on each side.</p>", "next": 136, "depth": "CROWN"}, "136": {"id": 136, "title": "Exit: Big Coulee Walks Him to His Raft", "html": "<p>The boat-on-wheels is waiting where he left it. The grass is bent where it sat.</p><p>Before he climbs back onto the boat-on-wheels, Big Coulee stops him.</p><p>She lowers her head one more time. Her voice is small. Just for him.</p><p>\"Child. The thing you did today, running hard, AND stopping for the babies, AND letting it tie, AND not pretending I was easier than I was, that's not just being a good competitor. That's a thing you do all the time, isn't it. At home. With the small one. The fishing kid.\"</p><p>Carson is quiet.</p><p>\"You watch out. You hype people up. You shield the little ones when nobody asked you to. You make people <em>braver</em> by being near them. That is a <em>real</em> thing, child. Most people don't know what to call it. I will tell you what it's called. It's called <em>being trustworthy.</em> And it is the most underrated thing a person can be.\"</p><p>She bumps her flower-crown against his forehead one more time.</p><p>\"Don't forget. People follow the loud ones. But they <em>trust</em> the ones like you.\"</p><p>Carson nods. He doesn't say anything. He doesn't quite know what to say. But he files what she just told him under the same heading he files everything important: things he'll think about later, after he's home, after the trip is over, after he has time to know what he thinks.</p><p>Carson climbs into the boat. He waves. Big Coulee waves back with her trunk and trumpets a goodbye so loud Pip-Pip falls off her head.</p><p>He has the Tusk-Charm in his hand. He has a feeling in his chest that he can pretty clearly identify as the kind of feeling he wants to keep.</p><p>He heads back toward the meadow, toward whoever is waiting, toward the sound of the C-130 somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "140": {"id": 140, "title": "Arrival in the Rocky Wood", "html": "<figure class=\"illus\"><img src=\"images/reid_region.webp\" alt=\"Arrival in the Rocky Wood\" loading=\"lazy\"></figure><p>Reid's raft slides up onto a beach made of small flat stones. The raft has become a long log canoe, hollowed out, the inside smooth from many hands. He steps off without looking, his feet already know.</p><p>The wood in front of him is ancient.</p><p>The trees are the size of houses. The trunks are wider than his arms could reach around three times over. The bark is so thick and so old it has its own bark. Light comes through the canopy in long slow shafts. The air smells like turned earth and old cedar and a specific cold sweetness Reid has never met before and somehow already knows.</p><p>He bends. He picks up a fallen branch. He starts whittling without deciding to.</p><p>A voice from a stump says, \"<em>FINALLY.</em>\"</p><p>Reid looks up. Calmly. He has been startled by many things in his life and reacts to each one the same way.</p><p>The stump is not a stump. It is a person. Bark for skin, leaves growing where hair should be. He is enormous, twice Reid's size, but he's sitting down so he doesn't seem scary. Just <em>large.</em></p><p>Just him. The wood is enormous around him. He is not afraid. He has been alone in big places before. He has been alone at the back dock in the dark, after everyone else has gone in, listening for the bats. He knows how to be quiet inside something quiet. Maybe more than any of the other kids, this is where he was meant to land.</p><p>\"FINALLY a visitor,\" the tree-person says. \"Wait, am I sure? I might be dreaming. Pinch me. No, don't. I'm bark, you'll hurt your fingers.\"</p><p>He laughs. The whole wood shakes a little. Birds Reid didn't notice fly out of the upper branches.</p><p>\"I'm OLD SPEAK,\" he says. \"Or that's what people called me a thousand years ago. I might have a new name now. I haven't checked. Sit, sit. <em>Visit.</em>\"</p><p>Reid sits on a root that turns out to be perfectly shaped for sitting. He keeps whittling.</p><p>Old Speak watches him for a long moment.</p><p>\"You make sticks,\" he says. \"I like sticks.\"</p>", "next": 141, "arrival": "reid"}, "141": {"id": 141, "title": "The Just-sit Moment", "html": "<figure class=\"illus\"><img src=\"images/trees_bowing.webp\" alt=\"The Just-sit Moment\" loading=\"lazy\"></figure><p>Old Speak watches Reid whittle for a while longer.</p><p>\"You're doing the thing,\" he says.</p><p>Reid looks up. \"What thing?\"</p><p>\"The <em>working</em> thing. You always do the working thing. I can tell. I was a tree before I was a person, I've watched a thousand visitors and the working ones have a posture. Shoulders forward. Hands going. Eyes already on the next problem.\"</p><p>Reid is quiet. He doesn't really know what to say. He IS doing the working thing. He doesn't know how to do other things.</p><p>Old Speak says, \"Put the stick down. Just for a minute.\"</p><p>Reid puts the stick down.</p><p>\"Now look up,\" Old Speak says.</p><p>Reid looks up. The canopy is a hundred feet above him. Light is coming through in slow shafts. A bird he can't identify is moving from branch to branch without making a sound.</p><p>\"That bird,\" Old Speak says, \"is called Listen. She's the only one of her kind. She doesn't sing. She only listens. She's been listening to this wood for two hundred years.\"</p><p>Reid watches the bird. The bird watches him back.</p><p>Old Speak says, \"I am ALSO listening. I have been listening to you since you stepped off your boat. You came in quiet. You don't take up extra room. You start working before you're asked because you don't want anyone to have to ask. That is a rare way to be, child.\"</p><p>Reid is quiet. He is used to being the one who watches, not the one who gets watched.</p><p>Old Speak says, \"And here is what most people miss about the quiet ones. They think quiet means soft. You are not soft. You see everything in a room and you say almost none of it, not because you're afraid, because you're <em>waiting</em> for the words that will land. You hold a thing until it's the right moment to set it down. That is not shyness. That is will. The strong kind, the kind that doesn't have to be loud to be made of iron.\"</p><p>Reid feels his face get warm.</p><p>Old Speak says, \"I see you. The world is loud and fast and it rushes right past the quiet ones. I'm old enough to slow down. So I'll say it plain. There is more strength in your chest than in ten men who shout. You know when to hold your tongue. You will know when to use it. That is a heart a person can build a whole life on.\"</p><p>Old Speak's voice goes quieter still. \"You are Reid the Noticer. The wood will remember that you saw, and that you knew when to speak of it. So will I.\"</p><p>Reid swallows.</p><p>Then he picks up the stick again, but slower this time.</p>", "next": 142}, "142": {"id": 142, "title": "Reid's Choice", "html": "<p>Old Speak says, \"Now then. You're here to make a STAFF. I can tell. The wood under your hand wants to become one. The wood always wants to become whatever the maker wants. That is a wood thing.\"</p><p>He gestures. Three pieces of wood lie at Reid's feet that weren't there a moment ago. Heavy maple. Light willow. A piece of dark driftwood the color of wet basalt.</p><p>\"Take one. Carve it. The staff you carve will be what you need it to be.\"</p><blockquote class=\"banner\"></blockquote><blockquote class=\"banner\"></blockquote>", "choices": [{"label": "Take the maple and start carving, clean, fast, the way you've made every stick at home", "target": 143}, {"label": "Ask Old Speak to teach you a technique you don't know yet", "target": 144}, {"label": "Ask Old Speak to tell you about the driftwood, where it came from, how old it is", "target": 145}]}, "143": {"id": 143, "title": "Take the Maple, Carve Fast", "html": "<p>Reid takes the maple. He knows maple. He's made twenty walking sticks out of maple over twenty summers. His hands know the grain and the way it splits and the way it doesn't.</p><p>He carves. Old Speak watches.</p><p>The staff takes about twenty-five minutes. It is six feet long, a little thicker at the base, smooth where his hand will hold it. He sands it with a rough stone Old Speak hands him without being asked. The staff is clean and straight and a good honest piece of work.</p><p>He stands it up. He leans on it. It holds. The wood is warm under his palm.</p><p>Old Speak nods.</p><p>\"That,\" he says, \"is a fine staff. It will not break easily. It will hold the line you want it to hold. Maple is honest. So are you.\"</p><p>He pats the staff. Then he reaches into his bark and pulls out a tiny carving, a miniature staff, the size of Reid's finger.</p><p>\"That's a memory token,\" Old Speak says. \"Carved by me, a long time ago. If you ever come back, hold it up so I know it's you. I've forgotten faces a few times. Last visitor I had, I called him by his great-great-grandfather's name. He took it well.\"</p><p>Reid pockets the tiny staff.</p><p><em>If the reader has played Carson's branch, there's a faint distant rumble from a long way off, a mammoth running on packed grass. Old Speak's leaves rustle once. \"She's a good one,\" he says. \"Loud, though.\" He does not explain.</em></p><p>Reid stands. He thanks Old Speak. He walks back toward his raft.</p><p>Old Speak waves with leafy fingers.</p><p>\"Tell me a new story next time you come,\" he calls. \"I've memorized this one already. Even though we didn't tell any.\"</p><p>Reid laughs, just a little.</p><p>He paddles away with a maple staff that will hold a bulldozer.</p>", "next": 146, "depth": "SILVER"}, "144": {"id": 144, "title": "Ask for the Technique", "html": "<p>Reid says, \"Can you teach me something I don't know yet?\"</p><p>Old Speak's whole face does something. His leaves brighten. The bark at the corners of his mouth crinkles upward.</p><p>\"<em>YES,</em>\" he says.</p><p>He shows Reid the technique. It is not what Reid expected.</p><p>The technique is not about how you cut. It is about <em>what you think</em> while you cut.</p><p>\"The wood is listening,\" Old Speak says. \"It has been listening since it was a seed. It remembers everything that ever walked past it. If you carve and you think about nothing, the wood will be nothing. If you carve and you think about WHERE you are and WHO you love and WHAT this staff is for, the wood will hold all of it. Forever. That is the technique. I cannot teach you more than that. The rest is yours.\"</p><p>Reid takes the driftwood. (He picked it without thinking. His hand went to it.)</p><p>He carves slowly. He thinks about the dock at home. He thinks about Ella jumping off the end last summer with her eyes closed and her arms straight up. He thinks about Aiden's first cast with the back-dock fishing rod, the cork bobber landing right where Reid told him to aim. He thinks about the boards under his feet that have held a thousand bare-foot summers and would like, please, to hold a thousand more.</p><p>The driftwood opens for him. He doesn't carve it so much as <em>reveal</em> it. The shape inside is already there. He just takes away the parts that aren't.</p><p>The staff is done in an hour. It is heavier than the maple would have been. It is the color of wet basalt and the grain shows three concentric rings near the top where his hand will rest, three rings, like the third plank of the dock that wobbles when you step on it.</p><p>It hums when he holds it. Low. Like a struck bell, far away.</p><p>Old Speak is very quiet for a long minute.</p><p>Then he says, \"I have not seen wood do that in seven hundred years.\"</p><p>He stands up. (Standing takes him a while. He is enormous.) He bows. Then he says, \"I am coming with you.\"</p><p>Reid blinks. \"To the lake-up-above?\"</p><p>\"To the dock that wobbles. I have not left this wood in nine hundred years. I will leave it for this. I am older than the man with the clipboards. I have stood in storms he cannot imagine. He will look me in the face and remember that he is small.\"</p><p>Reid says, \"Are you sure?\"</p><p>\"Child,\" Old Speak says, \"I am made of <em>wood.</em> I will be very dramatic. Try and stop me.\"</p><p><em>Far off, the bark of a wooly mammoth narrating her own training carries through the canopy. Old Speak's leaves rustle once. \"Loud one,\" he says, affectionately. \"Best of the racers. Don't tell her I said so.\"</em></p><p>Reid stands. Old Speak picks up the maple piece Reid didn't use and tucks it under his arm, \"for snacking later\", and follows Reid down to the beach. The canopy parts for him as he walks.</p>", "next": 146, "depth": "CROWN"}, "145": {"id": 145, "title": "Ask About the Driftwood", "html": "<p>Reid says, \"Tell me about the driftwood. Where did it come from?\"</p><p>Old Speak goes still. Then he laughs, a quiet laugh this time, not the shake-the-trees one.</p><p>\"Nobody has asked me that in a thousand years. They always ask if it's the <em>strongest</em> one. Nobody asks where it came from.\"</p><p>He picks up the driftwood. He turns it slowly.</p><p>\"This came from the FIRST TREE in The Old Roar. The first one to grow when the floods stopped roaring and the basalt cooled and there was finally enough soil for a root. It grew at the edge of what your people now call a cove. It stood there for nine hundred years. It fell in a storm. The lake took it. The lake held it for another five hundred years, water-soaking it, hardening it, weaving the grain with memory. Then the lake gave it back to me. To hold. Until the right hands came for it.\"</p><p>He sets the wood down in front of Reid.</p><p>\"You are the right hands.\"</p><p>Reid swallows. He doesn't quite believe it. But the wood is warm under his palm.</p><p>He carves it slowly. He thinks the things Old Speak taught him, <em>where you are, who you love, what this staff is for.</em> He thinks about the dock. He thinks about Ella jumping off it with her arms up. He thinks about Aiden's first cast. He thinks about the <em>third piling</em>, the one he noticed earlier this morning, the one the water has been eating out from under.</p><p>He carves THAT into the staff. Not as a picture. As a knowing.</p><p>The staff finishes itself, almost. His hands move and the shape appears. At the top, three rings. At the base, a faint mark like the curve of a shoreline. The whole thing hums when he picks it up, a low, slow hum, like a chord pulled out of a deep place.</p><p>Old Speak is openly weeping. He weeps sap. It is bright amber and very sticky.</p><p>\"You did the thing I cannot teach. You let the wood remember a <em>specific</em> place. That staff is now bonded to your dock. When you plant it at the base of the third piling, the wood will <em>root.</em> It will reach into the lake-bed. It will hold the soil in place. The water will move around it instead of under. Your dock will stand.\"</p><p>Then the wood does something Reid will remember the rest of his life.</p><p>Every tree in the rocky woodland, every single one, every trunk, every branch, every leafy hand, bends very slightly toward him. The canopy itself reorganizes. The whole forest is <em>bowing.</em> Not to the staff. To the boy who carved it.</p><p>The sunlight through the bent canopy makes new patterns on the beach where his canoe is waiting, and the patterns look exactly like the grain of the wood in his hand, scaled up a thousand times.</p><p>Old Speak says, very quietly: \"Well. They've never done that for me. They like you, child.\"</p><p>Reid doesn't trust himself to speak.</p><p>After a long moment, he says, \"Can you come with me?\"</p><p>\"I would not miss it,\" Old Speak says. \"I am old. I have wanted to see a wobbly dock survive for a very long time.\"</p><p>He stands. He bows to Reid the way ancient things bow, slowly, with their whole body.</p><p><em>If the reader has played Aiden's branch, a small bright shape passes through a high gap in the canopy, a unicorn galloping, with a small boy on her back. Old Speak watches it go. \"That child found his friend,\" he says, satisfied. \"Good. Good. Good.\"</em></p><p>Reid walks down to the beach. Old Speak follows. The wood opens for him.</p>", "next": 146, "depth": "CROWN"}, "146": {"id": 146, "title": "Exit", "html": "<p>The log canoe is where Reid left it. The Listen bird watches from the upper branches.</p><p>He has a staff. He has a tiny carved memory token in his pocket. He has, somewhere under his ribs, a feeling about being SEEN that he is still figuring out.</p><p>He paddles toward the sound of the C-130, faint and far, somewhere up in the world above.</p>", "exit": true, "next": "hub"}, "120": {"id": 120, "title": "Arrival at the Driftwood Stage", "html": "<figure class=\"illus\"><img src=\"images/driftwood_players.webp\" alt=\"Arrival at the Driftwood Stage\" loading=\"lazy\"></figure><p>Chayten's raft slides onto a grassy hill above a half-moon of water. The raft used to be a paddle board. Now it's a small driftwood boat with her initials burned into the bow. Her sandals are still wet from the dock at home. She hops off and takes the grassy slope easy, sure on her feet, the same balance she has hauling Aiden around the cove on the nose of her board without either of them going in.</p><p>Below her is the strangest amphitheater she has ever seen.</p><p>A natural bowl of grass curves down to the edge of the water. A long flat stage of pale driftwood juts out over the water like a tongue. The seats are stones, not stones placed there, <em>stones that grew there</em>, arranged in tidy rows by something that knew exactly how an audience should sit. Some of the stones are big. Some are huge. A few of them, the ones in the back, are larger than her house.</p><p>They are humming.</p><p>It's a low sound, the kind
