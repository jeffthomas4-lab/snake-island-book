p500: {
  id: 'P-500',
  type: 'always',
  title: 'Return to the Sunroom',
  text: `<p>The kids land in the sunroom one by one. The rafts come to rest. The walls of the sunroom resolve back into walls. The smell of brisket comes through the cracked door.</p>
<p>Pegasus walks in last, hooves clicking on the wood floor (if Aiden played). She is real. She is also, apparently, taller than the doorway. She ducks.</p>
<p>The kids show each other what they have. Madison's cookie tin glowing faintly. Chayten's otter mask. Carson's tusk-charm. Reid's staff (humming low). Kellen's stone. Keira's truth brush. Ella's invisible crown. Aiden's unicorn.</p>
<p><em id="ally-rollcall"></em></p>
<p>Outside, the C-130 thunders past for the second time today. The construction kickoff is in fifteen minutes.</p>
<p>They walk down to the dock together.</p>`,
  choices: [{ label: 'Walk to the dock', target: 'p502' }],
},

p502: {
  id: 'P-502',
  type: 'always',
  title: 'Drystone Mid-Speech',
  text: `<p>The dock is set up for the kickoff. Folding chairs. Bulldozer parked. Banner. Mr. Drystone at the platform with three clipboards (a fourth hidden inside his jacket).</p>
<p>"...premium server infrastructure," he is saying. "Echo-system improvement. Fiscal opportunity for the cove."</p>
<p>He sees the kids.</p>
<p>He sighs. "Kids, this is a GROWN-UP event. Run along."</p>
<p>The crowd laughs nervously. Madison steps forward. She does not run along.</p>`,
  choices: [{ label: 'BEAT 1: Madison', target: 'p510' }],
},

p510: {
  id: 'P-510 / P-511',
  type: 'beat',
  title: 'BEAT 1 — Madison',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'madison',
  beat_item: 'map',
  main: `<p>Madison opens her cookie tin on the platform railing. The tin glows. She unrolls the map.</p>
<p>"Mr. Drystone. This is a copy of your real plans. The water draw rate. The drainage path. The wrong permit you filed."</p>
<p>"Where did you GET that."</p>
<p>"From a friend who lives in the lake."</p>
<p>Drystone laughs. The crowd half-laughs with him.</p>
<p><em class="conditional ally-Branch">Branch the beaver waddles up onto the platform. Small bow tie. "I live in the lake." The crowd goes quiet.</em></p>
<p><em class="conditional item-full-map">Madison's tin is glowing brighter. The full map shows everything &mdash; including a small handwritten note in the margin about how to "manage local sentiment." The crowd stops laughing.</em></p>
<p>Some parents start listening. They had been told this was the only way. They had not been told it would mean draining the lake.</p>`,
  fallback: `<p>Madison doesn't have the map. She has a tin of cookies.</p>
<p>She walks down off the platform. She offers a cookie to each adult in the crowd. The cookies are oatmeal-chocolate-chip with a small amount of cinnamon she put in last night, sitting at her grandmother's kitchen counter listening to her mother on the phone, talking quietly about "the situation." She has heard every word every night for two weeks.</p>
<p>While the adults eat, Madison talks.</p>
<p>"My mom has been on the phone every night for two weeks. I've heard the calls. I know what the bank is asking. I know the rate. I made these cookies last night, in case it helped today."</p>
<p>"You assumed I wasn't paying attention. None of you grown-ups noticed I was listening. I was. I always am."</p>
<p>The adults are very quiet. Several are still chewing.</p>
<p>Madison hasn't won the beat with evidence. She has won it by being the one person in the cove who was actually <em>listening</em> the whole time.</p>`,
  choices: [{ label: 'BEAT 2: Chayten', target: 'p520' }],
},

p520: {
  id: 'P-520 / P-521',
  type: 'beat',
  title: 'BEAT 2 — Chayten',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'chayten',
  beat_item: 'voice',
  main: `<p>Chayten steps to the edge of the platform. She slips the otter mask out of her pocket and presses it to her face for one second. Tucks it back.</p>
<p>The crowd doesn't see the mask. They feel something change in the air.</p>
<p>"Listen to her."</p>
<p>Three words. The crowd STOPS shifting. Every eye locks on Chayten.</p>
<p>"Listen to all of us. We have something to say. It is the truth and you should hear it."</p>
<p><em class="conditional ally-Otto">Otto the otter &mdash; bandaged whiskers, velvet cape &mdash; pads onto the platform. The adults see... not quite an otter. A small dignified shape they cannot name. Drystone sees him plainly. Otto bows formally to him.</em></p>
<p><em class="conditional ally-Pickle">Pickle is perched on Chayten's shoulder. She hisses at Drystone. Drystone is the only adult who hears it.</em></p>
<p>Madison continues. The crowd is listening. Drystone tries to interrupt. The crowd looks at him with annoyance. He shuts up.</p>`,
  fallback: `<p>Chayten doesn't have the mask. So she does what she does at home when a room won't settle.</p>
<p>She walks to the small group of adults nearest the platform. She looks at one of the dads &mdash; a man she's known her whole life. "Mr. Halverson. Will you sit down? I want to tell you something."</p>
<p>He sits down. Cross-legged. On the dock.</p>
<p>She walks the crowd. One at a time. Asking each person by name. Within two minutes, every adult in the crowd is sitting on the dock, cross-legged, looking up.</p>
<p>Drystone tries to keep speaking from the platform. He looks down at twenty grown adults sitting on a dock listening to a thirteen-year-old. He sounds, suddenly, ridiculous.</p>
<p>He stops talking.</p>
<p>Chayten hasn't won the beat with magic. She has won it by knowing that grown-ups will do almost anything a calm kid asks them to do, if the kid asks them by name, one at a time.</p>`,
  choices: [{ label: 'BEAT 3: Carson', target: 'p530' }],
},

p530: {
  id: 'P-530 / P-531',
  type: 'beat',
  title: 'BEAT 3 — Carson',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'carson',
  beat_item: 'charm',
  main: `<p>Drystone has had enough. "This is RIDICULOUS. I'm starting the bulldozer." He stomps toward it.</p>
<p>Carson steps in front of it. He doesn't say anything.</p>
<p>Reid lines up beside him. Then Kellen. Then Keira. Then Ella. Then Madison and Chayten and Aiden. Pegasus shoulders in behind Aiden, head down, horn glowing.</p>
<p>Eight kids in a line in front of a bulldozer. The tusk-charm at Carson's neck glows.</p>
<p><em class="conditional ally-BigCoulee">Big Coulee thunders down the dock road, flower crown still tilted, narrating: "AND BIG COULEE arrives, looking STRONG, looking READY, looking like the AUNTIE these KIDS NEED." The dock shakes. The adults see nothing &mdash; they look around for what just made the dock shake. Drystone sees her perfectly. He has stopped walking.</em></p>
<p><em class="conditional ally-Tuft">Two baby mammoths trot forward and sit, one on either side of Carson.</em></p>
<p>"I am calling the police."</p>
<p>Carson: "Go ahead. Call them. Show them your real plans."</p>
<p>Drystone starts to dial. After a moment, he lowers the phone. He cannot, in fact, call the police on eight children in front of a bulldozer.</p>`,
  fallback: `<p>Carson is not at the front of the line. He's at the back. He has, all morning, been standing at the back of the kids &mdash; the rear guard. Nobody noticed.</p>
<p>When Drystone makes for the bulldozer, Carson moves up through the line. He puts his hand on Aiden's shoulder as he passes &mdash; a small "I see you" squeeze &mdash; then on Ella's, then on Keira's. Then he steps to the front.</p>
<p>He doesn't block the bulldozer. He turns <em>around</em> and faces the other seven kids.</p>
<p>"We do this together."</p>
<p>It is not a command. It is a reminder. He has been the cousin who reminds people of things since he was nine years old.</p>
<p>The other seven kids step forward, together. Not in a line. In a <em>clump.</em> Eight bodies arranged so none could move forward without all of them moving.</p>
<p>Carson hasn't rallied them with the charm. He has rallied them by being the one who knows how to <em>gather</em> without leading.</p>`,
  choices: [{ label: 'BEAT 4: Reid', target: 'p540' }],
},

p540: {
  id: 'P-540 / P-541',
  type: 'beat',
  title: 'BEAT 4 — Reid',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'reid',
  beat_item: 'staff',
  main: `<p>Drystone climbs into the bulldozer. Starts the engine. The kids don't move.</p>
<p>Reid steps forward, calm as he always is, and plants the staff in the dirt directly in front of the bulldozer's tracks. The staff stands on its own. The wood hums, a low slow note.</p>
<p><em class="conditional flag-DockHealing">The staff visibly takes root. The wood at its base sends pale tendrils into the soil. The kids see them. The adults cannot. Drystone can.</em></p>
<p>The bulldozer rolls forward. It hits the staff. The staff doesn't move.</p>
<p>The tracks SPIN. Smoke comes off them. The bulldozer doesn't go anywhere. Drystone revs harder. The tracks dig grooves. The staff stays exactly where it is.</p>
<p>Reid: "It's not going to move."</p>
<p>The crowd laughs. Drystone gives up after thirty seconds and turns off the engine.</p>
<p><em class="conditional ally-OldSpeak">A thicket of trees that wasn't there an hour ago is now standing at the edge of the dock. The trees lean slightly toward Drystone. The parents try to remember if those trees were always there. They cannot. Old Speak raises one bark-bristled hand. He waves.</em></p>`,
  fallback: `<p>Reid doesn't have the staff. He has a pocket knife and a piece of cottonwood he picked up on the walk down.</p>
<p>While Drystone is climbing into the bulldozer, Reid sits down. Cross-legged. On the dock. Right in front of the bulldozer's tracks. And he starts to whittle.</p>
<p>Drystone stares at him. Reid doesn't look up. He whittles. The bulldozer engine starts. Reid does not look up.</p>
<p>The bulldozer rolls forward six inches. The driver sees that the kid is not moving and is not even <em>looking.</em> The kid is just whittling.</p>
<p>You cannot run a bulldozer over a kid who is whittling. The bulldozer stops.</p>
<p>Reid keeps whittling. A full minute passes. The whole crowd watches a fourteen-year-old patiently shaping a piece of cottonwood with the calm of someone who knows the world will reorganize itself around him if he waits long enough.</p>
<p>Drystone shuts off the engine.</p>
<p>Reid looks up. He holds up a small wooden fish. He hands it to Aiden. "Here. For your pole."</p>
<p>Reid hasn't won the beat with the staff. He has won it by being exactly the kid he always is.</p>`,
  choices: [{ label: "Drystone's pushback", target: 'p550' }],
},

p550: {
  id: 'P-550',
  type: 'always',
  title: "Drystone's Pushback: The Bank Offer",
  text: `<p>Drystone climbs out of the bulldozer. He's furious. He grabs his three clipboards. He plays his ace.</p>
<p>He pulls out a fourth piece of paper &mdash; a SIGNED OFFER LETTER from the family's bank.</p>
<p>"This family is BROKE. Their dock's foundation is GONE. The bank is calling their loan. Driedmore is the ONLY buyer. We are RESCUING them."</p>
<p>Some adults in the crowd nod. Some parents close their eyes. This is the part they've been afraid of.</p>
<p>The kids freeze.</p>
<p>This is the real fight. The MONEY. The grown-ups had been told there was no other way and the grown-ups had believed it because the dock IS falling apart.</p>
<p>Drystone sees the kids' faces. He smiles a thin, mean smile. "I'm sorry, kids. Sometimes the world doesn't work out. Sometimes the GROWN-UPS have to make the hard call."</p>
<p>Aiden's bottom lip wobbles.</p>
<p>But then Drystone sees something. He has been studying property records all week.</p>
<p>He plays his second ace.</p>`,
  choices: [{ label: 'The chosen-family pivot', target: 'p551' }],
},

p551: {
  id: 'P-551',
  type: 'always',
  title: '★ The Chosen-Family Pivot ★',
  text: `<p>Drystone walks slowly along the line of kids.</p>
<p>"You know, I've been doing my homework. Four families, technically. Some of you are related. Some of you aren't. Princess &mdash;" (he gestures at Ella) "&mdash; you and the tall kid are cousins. Real cousins. But you &mdash;" (he gestures at Madison and Kellen) "&mdash; your mom is just a <em>friend</em>. Not blood. And you two &mdash;" (Aiden and Chayten) "&mdash; same thing. Your mom is a <em>friend</em> of a <em>friend</em>. Did you know that, sweetheart? Half of you have no real stake in this place. Your moms don't lose ANYTHING if the actual family sells. You're guests."</p>
<p>He turns to the parents. "Maybe the <em>blood</em> family wants to talk to the <em>guests</em> about whether they really get to weigh in. Just an idea."</p>
<p>The parents look at each other. The chosen-family moms look at the blood-family moms. There is a silence Drystone is hoping to grow.</p>
<p>Aiden whispers: "Chayten. Are we GUESTS?"</p>
<p>Chayten goes still. So does Madison. So does Kellen. The chosen-family kids look at their cousins. The cousins look back.</p>
<p>Drystone is smiling.</p>`,
  choices: [{ label: 'Take it apart', target: 'p552' }],
},

p552: {
  id: 'P-552',
  type: 'always',
  title: 'A Kid Takes It Apart',
  text: `<p>Carson is the one who moves first.</p>
<p>He doesn't say it loud. He says it the way he says things to Aiden when Aiden is scared.</p>
<p>"You don't know what family is. You also don't know what <em>belonging</em> is."</p>
<p>"Excuse me?"</p>
<p>"You looked at a property record. You think family is who's on a deed. You think belonging is who pays a mortgage. NONE of us own this place. NONE of our families own it. We're all renters. We rent the same condos every July. We have been renting them since before any of us were born. The cove doesn't belong to us. But WE belong to the cove. And that's something you can't put on a clipboard."</p>
<p>He walks down the line. He puts his hand briefly on each kid's shoulder as he passes.</p>
<p>"This is Reid. He's my cousin. We share a grandmother. Fine. But this is also Madison." (Hand on Madison's shoulder.) "She's not my cousin on paper. She's been my cousin every July since I was four. She taught me to swim. She made me cookies the summer my dog died. She is MY family. Not because of paper. Because she SHOWED UP."</p>
<p>He keeps walking. "This is Chayten. Not blood. She braided my hair when I broke my arm. This is Kellen. Not blood. He carried me on his back when I sprained my ankle. This is Aiden. He is the LITTLEST of us. He is my COUSIN in EVERY WAY THAT MATTERS. Don't you stand there and tell us who our family is."</p>
<p>He turns back to Drystone. Fourteen years old. Much smaller than Drystone. Not afraid.</p>
<p>"We chose each other. They chose us. That's stronger than blood. It's stronger because we have to do it again every summer and we ALWAYS DO."</p>
<p>Madison steps up beside him. Then Reid. Then Ella. Blood-family kids and chosen-family kids tangled together, arms over shoulders, hands held.</p>
<p>Aiden: "We are NOT guests."</p>
<p>Pegasus, behind him, makes a sound very close to a unicorn cheering.</p>
<p>Drystone's smile dies. The kids' <em>parents</em> are now also stepping closer to each other. The chosen-family moms and the blood-family moms stand shoulder to shoulder.</p>
<p>Drystone has just <em>cemented</em> them.</p>`,
  choices: [{ label: 'BEAT 5: Kellen', target: 'p560' }],
},

p560: {
  id: 'P-560 / P-561',
  type: 'beat',
  title: 'BEAT 5 — Kellen',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'kellen',
  beat_item: 'stone',
  main: `<p>Drystone tries again. "The bank offer STANDS. The family still can't AFFORD the geological work."</p>
<p>Kellen steps forward. He has been watching Drystone's posture all morning.</p>
<p>"Mr. Drystone. There's a piece of paper inside your jacket. You touch your lapel every two minutes. I've been counting. Will you take it out?"</p>
<p>"No."</p>
<p>"Okay."</p>
<p>He throws the stone. The stone skips off the wood of the dock. Bounces off a railing. Skips up the steps of Drystone's platform. Lands on Drystone's inside jacket pocket &mdash; through the FABRIC, somehow &mdash; and balances on the edge of a hidden fourth clipboard.</p>
<p>The clipboard tips out. Hits the wood. Falls open. Driedmore's internal memo about the bank. The lowballed appraisal. A list of three other small hotels Driedmore is doing the same thing to.</p>
<p><em class="conditional ally-Skim">Skim and her flock fly in like a small precision air force. They skip stones in formation onto every other piece of paper Drystone has hidden &mdash; under his hard hat, in his back pocket, taped to the underside of the bulldozer's steering wheel. Total exposure within thirty seconds.</em></p>
<p>The parents are now VERY interested. Drystone's face is the color of paper.</p>`,
  fallback: `<p>Kellen doesn't have the stone. He has the baseball that has been in his pocket since the third of July.</p>
<p>He bounces it once on the dock &mdash; <em>thock</em> &mdash; and Drystone flinches. A small flinch. But Kellen sees it. Kellen has been watching Drystone all morning. He is twelve and he has been throwing things into and out of lakes for as long as he can remember.</p>
<p>"Catch." He throws the baseball underhand. Drystone catches it. With his <em>left</em> hand. (He has been keeping his right hand free all morning to touch the inside lapel of his jacket.)</p>
<p>"Throw it back." Drystone does. Left hand again.</p>
<p>"Now throw it back with your right."</p>
<p>Drystone does. The thing inside his jacket falls slightly. The lapel shifts. The corner of a fourth clipboard becomes visible.</p>
<p>Madison's mother steps forward.</p>
<p>Kellen has not won the beat with magic. He has won it by understanding what a body looks like when it's hiding something, and setting up the simplest possible test to expose it.</p>`,
  choices: [{ label: 'BEAT 6: Keira', target: 'p570' }],
},

p570: {
  id: 'P-570 / P-571',
  type: 'beat',
  title: 'BEAT 6 — Keira',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'keira',
  beat_item: 'brush',
  main: `<p>Drystone tries to claim someone PLANTED the papers. He says the kids are LIARS.</p>
<p>Keira pulls the Truth Brush from behind her ear. Holds it up to her eye. Looks at Drystone.</p>
<p>Drystone is bright YELLOW. His clipboards are YELLOW. His permits are YELLOW. Madison's map glows BLUE.</p>
<p>"He's lying."</p>
<p>Small but everyone hears it. A grown-up: "Wait &mdash; can you see something we can't?" "Yes. He's lying. I can see it."</p>
<p>The crowd believes her. They believe her because she's clearly telling the truth herself.</p>
<p><em class="conditional flag-CliffyEcho">Drystone glances up at the basalt cliffs that ring the cove. He feels watched. The hairs on his neck stand up. He doesn't know why.</em></p>
<p><em class="conditional ally-Cliffy">Drystone glances up and sees, standing in the cove water up to his shoulders, an enormous basalt giant. The basalt giant is looking back at him. The other adults see nothing. Drystone forgets how to breathe.</em></p>`,
  fallback: `<p>Keira doesn't have the brush. She has her sketchbook.</p>
<p>She has been drawing the whole time. The whole showdown. Six pages.</p>
<p>She walks up to the platform and holds up her sketchbook. Then she flips through it, fast, like a flipbook.</p>
<p>The pages are Drystone. Drystone at the speech. Drystone when Madison started talking. Drystone when Chayten said <em>listen.</em> Drystone when the kids lined up. Drystone when he pulled out the bank offer. Drystone when he tried to peel the families apart.</p>
<p>In every drawing, Drystone's left eye is narrower than his right. <em>Every</em> drawing. It is a tell.</p>
<p>"He does this when he's lying. Look."</p>
<p>The crowd looks at Drystone. Drystone, at this exact moment, is lying. His eye is doing it. Three different adults notice. Then five. Then everyone.</p>
<p>Keira hasn't won the beat with the truth brush. She has won it by drawing what was in front of her, carefully, the same way she always does.</p>`,
  choices: [{ label: 'BEAT 7: Ella', target: 'p580' }],
},

p580: {
  id: 'P-580 / P-581',
  type: 'beat',
  title: 'BEAT 7 — Ella',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'ella',
  beat_item: 'crown',
  main: `<p>Drystone is purple. "I HAVE A PERMIT. THE PERMIT IS LEGAL. I AM PROCEEDING."</p>
<p>Ella steps in front of him. Nine years old. Smaller than him by half.</p>
<p>The invisible crown on her head becomes visible to him for one full second. He sees it. He doesn't know what he's seeing.</p>
<p>She makes her face the deciding face. "I am Queen Ella of the Bright Water. And the answer is NO."</p>
<p>Drystone's mouth opens. Closes. He cannot find a single word.</p>
<p>The crowd applauds.</p>
<p><em class="conditional ally-EggMotherChorus">The egg-mother and her chorus appear at the edge of the dock. Twelve small soft creatures hum a single low note. The note is in everyone's chest. Drystone staggers. The other adults look around for the source.</em></p>
<p><em class="conditional ally-FrogHerald">A frog in tiny royal regalia hops onto the platform. He bows. He reads, in a voice clearer than most grown-ups: "By order of Queen Marigold of the Bright Water, and Co-Queen Ella, Hotel Sun Lakes is hereby declared Protected Territory of the Realm. Any party who attempts to alter this cove will answer to the Bright Water Court." He bows again. He hops back into the lake.</em></p>`,
  fallback: `<p>Ella doesn't have a crown. She has lip gloss.</p>
<p>She pulls a small tube from her pocket. She also pulls out a small hand mirror. She does not explain why she has these. She just does. She applies the gloss carefully. She is ten years old and she does not stop applying her lip gloss to handle the most dangerous man on her dock.</p>
<p>The crowd watches her put on lip gloss.</p>
<p>Drystone: "Little girl, MOVE."</p>
<p>Ella, still working on her bottom lip: "Just a second."</p>
<p>She finishes. Caps the gloss. Pockets the mirror. Walks directly toward Drystone. She does not stop two feet away. She walks until her toes are six inches from his shoes.</p>
<p>"No."</p>
<p>The lip gloss was the message: <em>I am not afraid of you. I will finish my own business before I deal with yours.</em></p>
<p>Drystone has spent his career intimidating people who treated him as serious. He has no idea how to handle a ten-year-old who treats him as a chore.</p>
<p>He steps back. Ella's father laughs out loud: "<em>That's</em> my kid."</p>
<p>Ella has not won the beat with a crown. She has won it by being so completely Ella that no amount of Drystone could disturb her.</p>`,
  choices: [{ label: 'BEAT 8: Aiden ★', target: 'p590' }],
},

p590: {
  id: 'P-590 / P-591',
  type: 'beat',
  title: 'BEAT 8 — Aiden ★',
  text: `<p id="beat-text"></p>`,
  beat_kid: 'aiden',
  beat_item: 'pegasus',
  main: `<p>Drystone makes one last try. He is desperate. "I want PROOF this is REAL MAGIC. PROVE TO ME magic exists. Otherwise this is all a child's TANTRUM."</p>
<p>Aiden walks forward. He's been at the back the whole time, holding Pegasus's mane.</p>
<p>His BELIEF is what makes Pegasus visible to Drystone specifically. Adults can't normally see her. But when Aiden looks Drystone in the eye and BELIEVES &mdash; fully, without hedging, that there is a real unicorn standing on the dock &mdash; his belief is strong enough to make her real for Drystone. Just for Drystone. Just for that moment.</p>
<p>That is a seven-year-old's superpower. He believes harder than any adult ever could.</p>
<p>He whistles. Pegasus walks up the dock.</p>
<p>Aiden looks Drystone dead in the eye.</p>
<p>Drystone sees her. Just Drystone. A real, talking, rainbow-maned unicorn standing three feet away.</p>
<p>His clipboards drop. His hard hat falls off. His face goes white.</p>
<p>"Mr. Drystone. This is Pegasus. She's a unicorn."</p>
<p>"HI!"</p>
<p>Pegasus trots up to Drystone and sniffs him.</p>
<p>Drystone almost says "There's a unicorn." He stops. He realizes the other adults will think HE'S lost his mind. He has to choose between admitting the magic and his career.</p>
<p>He chooses his career. He whispers: "I... can't... I can't put a unicorn on a permit."</p>
<p>"We know."</p>
<p><em class="conditional ally-Hush">The Hush &mdash; a small grumpy thing with non-pointy spikes &mdash; is riding on Aiden's shoe. He looks up at Drystone and says nothing. Drystone sees him too.</em></p>
<p><em class="conditional zoo">Drystone's vision is becoming unmanageable. He sees the unicorn. The mammoth. The otter in the velvet cape. The beaver in the bow tie. The basalt giant standing in the cove water. The grumpy spike-thing on the boy's shoe. The frog herald. Twelve small egg-creatures humming. The thicket of trees that wasn't there before. The other adults see NONE of these things. Drystone has begun to make a small sound. Mostly air.</em></p>
<p>The deal is dead. Pegasus says, "LOOK AT ALL OF THEM!"</p>`,
  fallback: `<p>Aiden has no unicorn. He has the silver fish Chayten brought back for him from the Driftwood Stage.</p>
<p>He pulls it out. Holds it up.</p>
<p>"Mr. Drystone. This is a fish from a place you've never been. My sister brought it back for me from a play she was in. The play was about a brother and a sister and how the sister never stopped looking for the brother. She got to be the sister. And then she brought me this fish because she knows I like fishing. You don't have anyone who would do that for you. That's what's wrong with you."</p>
<p>The crowd goes very quiet. A seven-year-old talking about love can stop a room faster than a unicorn can.</p>
<p>Drystone tries to recover. "...kid, you don't understand the situation &mdash;"</p>
<p>"I do understand. You don't have anyone who would bring you a fish. That's why you keep counting things. People who have someone who would bring them a fish don't have to count."</p>

//==============================================================================
// STATE
//==============================================================================

let state = {
  current: 'p001',
  strategy: null,    // 'A', 'B', or 'C'
  visited_regions: [],
  current_region_returning_to: null,
  items: {},         // { map: 'base', voice: 'enhanced', ... }
  allies: [],
  flags: [],
};

function save() {
  localStorage.setItem('old-roar-v3-state', JSON.stringify(state));
}

function load() {
  const saved = localStorage.getItem('old-roar-v3-state');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) {}
  }
  render();
}

function go(target, extra) {
  const cur = SCENES[state.current];

  // Apply earnings from current passage
  if (cur && cur.earns) {
    if (cur.earns.item) {
      state.items[cur.earns.item[0]] = cur.earns.item[1];
    }
    if (cur.earns.allies) {
      cur.earns.allies.forEach(a => {
        if (!state.allies.includes(a)) state.allies.push(a);
      });
    }
    if (cur.earns.flags) {
      cur.earns.flags.forEach(f => {
        if (!state.flags.includes(f)) state.flags.push(f);
      });
    }
  }

  // Mark region complete
  if (cur && cur.region_complete) {
    if (!state.visited_regions.includes(cur.region_complete)) {
      state.visited_regions.push(cur.region_complete);
    }
  }

  // Apply strategy from p012 choices
  if (extra && extra.strategy) {
    state.strategy = extra.strategy;
  }

  // Handle 'next' target — go to region menu or showdown
  if (target === 'next') {
    const regionsNeeded = state.strategy === 'A' ? 4 : 8;
    if (state.visited_regions.length >= regionsNeeded) {
      state.current = 'p500';
    } else {
      state.current = 'region_menu';
    }
  } else if (target === 'restart') {
    restart();
    return;
  } else {
    state.current = target;
  }

  save();
  window.scrollTo(0, 0);
  render();
}

function chooseRegion(regionId) {
  const region = REGIONS.find(r => r.id === regionId);
  state.current = region.entry;
  save();
  window.scrollTo(0, 0);
  render();
}

function restart() {
  state = {
    current: 'p001',
    strategy: null,
    visited_regions: [],
    current_region_returning_to: null,
    items: {},
    allies: [],
    flags: [],
  };
  save();
  render();
}

let mapVisible = false;
function toggleMap() {
  mapVisible = !mapVisible;
  render();
}

//==============================================================================
// RENDER
//==============================================================================

function renderStateStrip() {
  const itemCount = Object.keys(state.items).length;
  const allyCount = state.allies.length;
  const flagCount = state.flags.length;

  if (itemCount === 0 && allyCount === 0 && !state.strategy) {
    return '';
  }

  let html = '<div class="state-strip">';
  if (state.strategy) {
    const stratName = { A: 'Stay Together', B: 'Split in Two', C: 'Each Goes Alone' }[state.strategy];
    html += `<div class="row"><strong>Strategy:</strong> ${stratName}</div>`;
  }
  if (itemCount > 0) {
    const itemTags = Object.entries(state.items).map(([k, v]) => {
      const cls = v === 'full' ? 'tag full' : v === 'enhanced' ? 'tag enhanced' : 'tag';
      return `<span class="${cls}">${ITEMS[k]} (${v})</span>`;
    }).join('');
    html += `<div class="row"><strong>Items (${itemCount}/8):</strong> ${itemTags}</div>`;
  }
  if (allyCount > 0) {
    const allyTags = state.allies.map(a => `<span class="tag">${ALLY_NAMES[a] || a}</span>`).join('');
    html += `<div class="row"><strong>Allies:</strong> ${allyTags}</div>`;
  }
  if (state.visited_regions.length > 0) {
    const needed = state.strategy === 'A' ? 4 : 8;
    html += `<div class="row"><strong>Regions visited:</strong> ${state.visited_regions.length}/${needed}</div>`;
  }
  html += '</div>';
  return html;
}

function renderRegionMenu() {
  const regionsNeeded = state.strategy === 'A' ? 4 : 8;
  const remaining = regionsNeeded - state.visited_regions.length;
  const capReached = state.visited_regions.length >= regionsNeeded;

  let html = `<div class="passage-id">Region Menu</div>`;
  html += `<h2 class="scene-title">Which region next?</h2>`;
  if (capReached) {
    html += `<div class="scene-text"><p>You’ve completed all ${regionsNeeded} regions for your strategy. Time to head back.</p></div>`;
    html += `<div class="choices"><button onclick="go('p500')" style="background:var(--warm);color:var(--paper);border-color:var(--warm);">To the showdown &rarr;</button></div>`;
    return html;
  }
  html += `<div class="scene-text"><p>Pick the next region to visit. ${remaining} of ${regionsNeeded} left.</p></div>`;
  html += `<div class="region-grid">`;
  REGIONS.forEach(r => {
    const visited = state.visited_regions.includes(r.id);
    html += `<button onclick="chooseRegion('${r.id}')" ${visited ? 'disabled' : ''}>
      ${r.name}
      <span class="kid">${r.kid}${visited ? ' — visited' : ''}</span>
    </button>`;
  });
  html += `</div>`;
  return html;
}

function renderBeat(scene) {
  // Decide main vs fallback
  const hasItem = state.items[scene.beat_item];
  const useMain = !!hasItem;

  let beatHtml = useMain ? scene.main : scene.fallback;

  // Process conditional inserts
  beatHtml = beatHtml.replace(/<em class="conditional ally-(\w+)">([^<]+)<\/em>/g, (m, ally, text) => {
    if (state.allies.includes(ally)) {
      return `<em class="conditional">${text}</em>`;
    }
    return '';
  });
  beatHtml = beatHtml.replace(/<em class="conditional flag-(\w+)">([^<]+)<\/em>/g, (m, flag, text) => {
    if (state.flags.includes(flag)) {
      return `<em class="conditional">${text}</em>`;
    }
    return '';
  });
  beatHtml = beatHtml.replace(/<em class="conditional item-full-(\w+)">([^<]+)<\/em>/g, (m, itemKey, text) => {
    if (state.items[itemKey] === 'full') {
      return `<em class="conditional">${text}</em>`;
    }
    return '';
  });
  // Zoo conditional: 3+ allies crossed = Drystone sees the zoo
  beatHtml = beatHtml.replace(/<em class="conditional zoo">([^<]+)<\/em>/g, (m, text) => {
    if (state.allies.length >= 3) {
      return `<em class="conditional">${text}</em>`;
    }
    return '';
  });

  const variant = useMain ? '(main version)' : '(fallback &mdash; no item)';
  return `<p style="font-size:12px;color:var(--warm);font-style:italic;margin-bottom:14px;">Showing ${variant}</p>${beatHtml}`;
}

function renderEndingRouter() {
  const itemCount = Object.keys(state.items).length;
  const kidsPlayed = state.visited_regions.length;
  const hasPegasus = !!state.items.pegasus;

  // CROWN: 8 items AND all kids played AND Pegasus
  const isCrown = itemCount >= 8 && kidsPlayed >= 8 && hasPegasus;

  let html = '<div class="passage-id">P-600</div>';
  html += '<h2 class="scene-title">Count what you brought back</h2>';
  html += `<div class="scene-text">
    <p>Items: ${itemCount}/8</p>
    <p>Regions visited: ${kidsPlayed}/8</p>
    <p>Pegasus crossed: ${hasPegasus ? 'Yes' : 'No'}</p>
    <p>Allies who crossed over: ${state.allies.length}</p>
    <hr style="margin: 16px 0; border: none; border-top: 1px solid rgba(0,0,0,0.1);">
    <p><strong>${isCrown ? 'CROWN ENDING' : 'SILVER ENDING'}</strong></p>
  </div>`;
  html += `<div class="choices"><button onclick="go('${isCrown ? 'p601' : 'p602'}')">Read the ending</button></div>`;
  return html;
}

  return `<div class="passage-id">Map View</div>

function render() {
  const main = document.getElementById('main');
  const stateDisplay = document.getElementById('state-display');

  stateDisplay.innerHTML = renderStateStrip();

  if (mapVisible) {
    main.innerHTML = renderMapView();
    return;
  }

  if (state.current === 'region_menu') {
    main.innerHTML = renderRegionMenu();
    return;
  }

  const scene = SCENES[state.current];
  if (!scene) {
    main.innerHTML = `<p>Scene not found: ${state.current}</p>
      <div class="choices"><button onclick="restart()">Restart</button></div>`;
    return;
  }

  if (scene.type === 'ending_router') {
    main.innerHTML = renderEndingRouter();
    return;
  }

  let html = '';
  if (scene.id) html += `<div class="passage-id">${scene.id}</div>`;
  if (scene.region) html += `<div class="scene-meta">${REGIONS.find(r => r.id === scene.region).name}</div>`;
  html += `<h2 class="scene-title">${scene.title}</h2>`;

  if (scene.type === 'beat') {
    html += `<div class="scene-text">${renderBeat(scene)}</div>`;
  } else {
    let sceneText = scene.text || '';
    // Wrapper variant substitution: if this scene has a variant entry and a strategy is set, swap in the right one
    if (VARIANTS[state.current] && state.strategy) {
      const variantText = VARIANTS[state.current][state.strategy];
      sceneText = sceneText.replace(
        /<em class="variant">\[[^\]]*\]<\/em>/,
        `<em class="variant">${variantText}</em>`
      );
    }
    // Ally rollcall substitution for P-500
    if (state.current === 'p500') {
      let rollcallHTML = '';
      if (state.allies.length > 0) {
        const allyDescriptions = state.allies.map(a => ALLY_NAMES[a] || a);
        rollcallHTML = `Whoever you befriended is here too — ${allyDescriptions.join(', ')} — all visible only to the kids (and, once the showdown begins, to Mr. Drystone).`;
      } else {
        rollcallHTML = 'No magical allies cross with you this time. Pegasus and the kids will have to be enough.';
      }
      sceneText = sceneText.replace(
        /<em id="ally-rollcall"><\/em>/,
        `<em>${rollcallHTML}</em>`
      );
    }
    html += `<div class="scene-text">${sceneText}</div>`;
  }

  // Choices / endings
  if (scene.type === 'ending') {
    html += `<div class="ending-banner ${scene.ending.toLowerCase()}">${scene.ending} ENDING</div>`;
  }

  if (scene.choices && scene.choices.length > 0) {
    html += `<div class="choices">`;
    scene.choices.forEach(c => {
      const sub = c.sub ? `<span class="sub">${c.sub}</span>` : '';
      const extra = c.strategy ? `, { strategy: '${c.strategy}' }` : '';
      html += `<button onclick="go('${c.target}'${extra})">${c.label}${sub}</button>`;
    });
    html += `</div>`;
  }

  main.innerHTML = html;
}

load();
</script>
</body>
</html>
