p120: {
  id: 'P-120', title: 'Arrival at the Driftwood Stage', meta: 'Chayten',
  text: `<p>Chayten's raft slides onto a grassy hill above a half-moon of water. The raft is a small driftwood boat with her initials burned into the bow.</p>
<p>Below is the strangest amphitheater she has ever seen. A natural bowl of grass curves down to a long flat stage of pale driftwood jutting over the water. The seats are stones &mdash; not stones placed there, <em>stones that grew there</em> &mdash; arranged in tidy rows. Some are bigger than her house. They are humming.</p>
<p>On the stage, a dozen otters are running in a panic. One of them &mdash; old, gray-muzzled, wearing a velvet cape and a single small bandage wrapped around his whiskers &mdash; is sitting in the middle of the stage looking absolutely calm in the way of a man whose world is ending.</p>
<p>He sees Chayten. He stands up very slowly. He says, in a voice like an entire theater season ending: "<em>You.</em> You with the EYES. Get DOWN here."</p>`,
  choices: [{ label: 'Walk down to the stage', target: 'p121' }],
},

p121: {
  id: 'P-121', title: 'The Be-a-Kid Moment', meta: 'Chayten — cared-for',
  text: `<p>Otto bows. Then he winces, because bowing tugs his bandaged whiskers.</p>
<p>"OTTO. Lead actor. Or <em>was</em>. The Stones go on in forty minutes. You will play the lead. Yes?"</p>
<p>Chayten opens her mouth. She is about to say yes, because that's what she does.</p>
<p>Otto holds up one paw. "Stop. Wait. Look at me."</p>
<p>Otto sees, very clearly, the way Chayten has been holding herself &mdash; like a chaperone at someone else's party, like a sister who has misplaced her brother for the first time in seven years.</p>
<p>"He is FINE," Otto says. "The small one. You can feel him. Yes?"</p>
<p>Chayten checks. Aiden is fine. He is also somehow riding something that is not a horse.</p>
<p>"Good. Now. You are not a sister right now. You are not a babysitter. For one hour, you are an <em>actor</em>. Do you accept the demotion?"</p>
<p>Chayten laughs. It surprises her. "Yes."</p>
<p>Otto looks at her for one more long second. "And child. Before I go. May I just sit here a moment? With you. Not to ask anything."</p>
<p>Chayten blinks. Nobody has ever asked her that.</p>
<p>She nods. Otto sits cross-legged beside her. He doesn't speak. He doesn't perform. He just sits with her the way a person sits with another person whose company is enough.</p>
<p>Ten seconds. It is the most important ten seconds Chayten has experienced in a year.</p>
<p>Otto stands. "<em>Excellent.</em> Now. The play is <em>The Tale of the Lost Brother.</em> Forty minutes. How would you like to begin?"</p>`,

p124: {
  id: 'P-124', title: 'CHOICE 2B — What\'s the play really about?', meta: 'You asked Otto',
  text: `<p>Otto goes still. The other otters stop swirling. They all turn slightly to look at him.</p>
<p>Otto sits. He pats the wood next to him. Chayten sits. He takes a long breath.</p>
<p>"It is about my brother. Not the brother I had. The brother I <em>chose</em>. He was river. I was lake. We were raised together because his mother died and mine had room. We were brothers anyway. We were not blood. We were better than blood."</p>
<p>"He was lost in a storm when we were small. The play says the sister sings him home. The truth is, I never sang him home. I just kept singing because I didn't know what else to do."</p>
<p>"I have played this play seven hundred and twelve times. Every time, I am the brother who comes back at the end. Every time, I think &mdash; <em>what if this is the time he hears me.</em>"</p>

  text: `<p>She is tiny. Half the size of the other otters. She holds a child-sized brown smock in both paws and stares at it like it might bite her.</p>

<p>"...Pickle."</p>
<p>"Pickle. Are you in the play?"</p>
<p>Pickle shakes her head. Then nods. Then shakes again. "They said I could be the brother. The little brother. But I can't, I can't go out there, my legs are &mdash; they don't &mdash;"</p>

p124a: {

leaf_123b2: {
  id: 'L-5', title: 'The Shy Otters\' Secret', meta: 'Chayten 2A2b → quiet wisdom',
  text: `<p>The two shy otters whisper one piece of advice: "When she says she'll keep singing, don't sing it loud. Sing it like a promise. To one person. Specifically."</p>

leaf_124a3: {
  id: 'L-12', title: 'For Aiden', meta: 'Chayten 2B1c → her own little brother',
  text: `<p>Chayten plays the sister as the version of herself her actual little brother is going to need someday. Every line, she imagines herself singing for Aiden.</p>
<p>The Stones don't just hum. They <em>sing back.</em> A low chorus they have not done in three hundred years.</p>
<p>Otto gives her his oldest Mask AND a tiny silver fish for Aiden &mdash; he carved it from a Stone-flake. "For the small one. From someone who knows what it is to love a brother."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['SilverFishForAiden', 'AidenAnchor'] },
  next: 'exit',
},

leaf_124b1: {
  id: 'L-13', title: 'You Were Always With Me', meta: 'Chayten 2B2a → rewritten ending',
  text: `<p>Otto goes very still. Then he whispers: "I have been playing the wrong ending for seven hundred years."</p>
<p>They rehearse the new ending. The performance is unforgettable. The Stones THUNDER. Otters in the wings carry each other out, weeping.</p>
<p>Otto gives Chayten his Mask. "I will come with you. I have not left in two hundred years. I have to thank you in front of more witnesses than this troupe."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['RewroteTheEnding'] },
  next: 'exit',
},

leaf_124b2: {
  id: 'L-14', title: 'Never Stopped Listening', meta: 'Chayten 2B2b → reframed grief',
  text: `<p>Otto repeats the line. "I never stopped listening for you." He cries. "That is what I do. That is the whole thing."</p>
<p>The performance lands hard. The Stones hum. Otto gives her his Mask. "You named the thing I have been doing. I can stop being ashamed of it now."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['NamedTheGrief'] },
  next: 'exit',
},

leaf_124b3: {
  id: 'L-15', title: 'The Love, Not the Transaction', meta: 'Chayten 2B2c → philosophical rewrite',
  text: `<p>Otto is quiet for a long time. "You're saying the singing wasn't FOR him."</p>
<p>"It was for you. To say you loved him. Whether or not he ever heard it."</p>
<p>Otto: "I have been treating love like a transaction for seven hundred years. <em>If I sing enough, he comes back.</em> No. The singing IS the love."</p>
<p>He gives her his Mask. He gives her his bandage. (Symbolic. His whiskers heal during the performance.) "Take both. Use them when you need to remind a grown-up that love isn't math."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['LoveNotMath'] },
  next: 'exit',
},

leaf_124c1: {
  id: 'L-16', title: 'You Sing Him Home', meta: 'Chayten 2C1a → swap and sing',
  text: `<p>Chayten plays the brother. Otto plays the sister, for the first time. Chayten sings him home at the end of the play.</p>
<p>Otto, in the wings of his own story, finally hears himself sung home. He sobs. The Stones hum so loud that the dock-up-above (Chayten will learn later) physically shook for thirty seconds.</p>
<p>Otto gives her his oldest Mask. "I have been waiting for someone to do that for me my whole life. Take this. Use it when someone needs to be sung home."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['SungHome'] },
  next: 'exit',
},

leaf_124c2: {
  id: 'L-17', title: 'Believe the Singing', meta: 'Chayten 2C1b → make him receive it',
  text: `<p>Chayten makes Otto promise. He promises. They play it. At the climax, Otto &mdash; in the sister role, but now WITH the brother's burden &mdash; lets himself believe Chayten's singing.</p>
<p>He BELIEVES. Tears stream. He says afterward that for one second of the play he felt his actual brother in the room.</p>
<p>He gives her his Mask. "You taught me how to receive. Take this. You'll need it at the dock."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['TaughtToReceive'] },
  next: 'exit',
},

leaf_124c3: {
  id: 'L-18', title: 'The Stones Are the Storm', meta: 'Chayten 2C1c → recast the world',
  text: `<p>The Stones become the storm. They rumble low through the play, then crescendo, then quiet. Chayten plays the brother. Otto, the sister.</p>
<p>It is the most fully-realized performance of the play in eight hundred years. The Stones afterward stand up for the first time in recorded history. They walk slowly to the back of the amphitheater and rest themselves. (Stones tire. Who knew.)</p>
<p>Otto gives her his Mask. "You used the room. That's what a real director does." He stops. "I should know. I was one."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Otto'], flags: ['StonesStood'] },
  next: 'exit',
},

leaf_125a3: {
  id: 'L-21', title: 'Just Say Your Line', meta: 'Chayten 2C2c → private rehearsal',
  text: `<p>Pickle whispers her line, just to you, in the dressing room: "I am still here, I am still here, I am still here, I never went away."</p>
<p>Then, encouraged by saying it once where no one else heard, she says: "I'll come do it on stage. If you go first."</p>
<p>She comes out. She delivers the line. The Stones THUNDER for her.</p>
<p>Otto, weeping, gives Chayten his Mask. "She has not spoken in front of an audience in three years. You unlocked her."</p>`,
  earns: { item: ['voice', 'full'], allies: ['Pickle'], flags: ['UnlockedPickle'] },
  next: 'exit',
},

leaf_125b1: {

  text: `<p>"The brother stayed small inside. She'll know."</p>

  text: `<p>"You said it's been mis-cast for forty-three years. So fix it."</p>

exit: {
  id: 'EXIT', title: 'The Troupe Sees Her Off', meta: 'Chayten — region complete',
  text: `<p>The otters line up to wave her off. The Stones hum, low and warm.</p>
<p>Chayten has the Otter Mask. She has, depending on her path, a silver fish for Aiden, an ally or two, and a feeling under her ribs that a play she helped fix was somehow also a play about her own life.</p>
<p>Her driftwood boat is waiting in the water below the stage. She steps in. She heads back toward wherever Aiden is. She always does.</p>
<p style="margin-top:32px; padding:16px; background:rgba(74,125,140,0.08); border-left:3px solid var(--water); border-radius:0 4px 4px 0; font-size:14px; line-height:1.5;"><strong>End of Chayten's region.</strong> 27 different ways through. Click "Start over" to try another. The state strip above shows what you brought back this time.</p>`,
  isEnd: true,
  choices: [],
},

}; // end SCENES

let state = { current: 'start', items: {}, allies: [], flags: [], visited: [] };
function save() { try { localStorage.setItem('chayten-demo-state', JSON.stringify(state)); } catch(e){} }
function load() { try { const s = localStorage.getItem('chayten-demo-state'); if (s) state = JSON.parse(s); } catch(e) {} render(); }
function go(target) {
  const cur = SCENES[state.current];
  if (cur && cur.earns) {
    if (cur.earns.item) state.items[cur.earns.item[0]] = cur.earns.item[1];
    if (cur.earns.allies) cur.earns.allies.forEach(a => { if (!state.allies.includes(a)) state.allies.push(a); });
    if (cur.earns.flags) cur.earns.flags.forEach(f => { if (!state.flags.includes(f)) state.flags.push(f); });
  }
  if (cur && cur.next && target === 'exit') target = cur.next;
  state.current = target;
  if (!state.visited.includes(target)) state.visited.push(target);
  save(); window.scrollTo(0, 0); render();
}
function restart() { state = { current: 'start', items: {}, allies: [], flags: [], visited: [] }; save(); render(); }
function renderState() {
  const ic = Object.keys(state.items).length, ac = state.allies.length, fc = state.flags.length;
  if (ic === 0 && ac === 0 && fc === 0) return '';
  let html = '<div class="state-strip">';
  if (ic > 0) html += `<div><strong>Earned:</strong> ${Object.entries(state.items).map(([k,v]) => `<span class="tag">${k} (${v})</span>`).join('')}</div>`;
  if (ac > 0) html += `<div><strong>Allies:</strong> ${state.allies.map(a => `<span class="tag">${a}</span>`).join('')}</div>`;
  if (fc > 0) html += `<div><strong>Carrying:</strong> ${state.flags.map(f => `<span class="tag">${f}</span>`).join('')}</div>`;
  html += '</div>';
  return html;
}
function render() {
  const main = document.getElementById('main');
  document.getElementById('state-display').innerHTML = renderState();
  const scene = SCENES[state.current];
  if (!scene) { main.innerHTML = `<p>Scene not found: ${state.current}</p>`; return; }
  let html = '';
  if (scene.id) html += `<div class="passage-id">${scene.id}</div>`;
  if (scene.meta) html += `<div class="scene-meta">${scene.meta}</div>`;
  html += `<h2 class="scene-title">${scene.title}</h2>`;
  html += `<div class="scene-text">${scene.text || ''}</div>`;
  if (scene.next && (!scene.choices || scene.choices.length === 0)) {
    html += `<div class="choices"><button onclick="go('exit')">Continue to exit</button></div>`;
  } else if (scene.choices && scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(c => { html += `<button onclick="go('${c.target}')">${c.label}${c.sub ? `<span class="sub">${c.sub}</span>` : ''}</button>`; });
    html += '</div>';
  } else if (scene.isEnd) {
    html += `<div class="choices"><button onclick="location.href='index.html?goto=showdown_intro'" style="background:#2b2419;color:#faf6ed;border-color:#2b2419;"><strong>Head to the Showdown →</strong><span class="sub" style="color:#f5c587;">End the book. Face Drystone with what you\'ve earned.</span></button><button onclick="location.href='index.html?goto=hub'">← Pick another cousin first</button><button onclick="restart()" style="opacity:0.7;font-size:13px;">Start over — try a different path in this region</button></div>`;
  }
  main.innerHTML = html;
}
load();
</script>
</body>
</html>
