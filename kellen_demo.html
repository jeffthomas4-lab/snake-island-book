  .state-strip { background: rgba(107, 142, 78, 0.08); border: 1px dashed var(--green); padding: 10px 14px; margin: 0 0 24px; font-size: 12px; border-radius: 3px; }
  .state-strip strong { color: var(--green); }
  .state-strip .tag { display: inline-block; background: rgba(107, 142, 78, 0.15); padding: 2px 7px; border-radius: 3px; margin: 0 3px 3px 0; font-size: 11px; }
  .passage-id { font-family: 'Courier New', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--warm); margin-bottom: 4px; }
  .scene-meta { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--water); margin-bottom: 6px; font-style: italic; }
  .scene-title { font-size: 28px; font-weight: normal; margin-bottom: 20px; font-style: italic; line-height: 1.25; }
  .scene-text { font-size: 17px; }
  .scene-text p { margin-bottom: 14px; }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .choices button { background: var(--paper); border: 1.5px solid var(--ink); padding: 14px 18px; text-align: left; cursor: pointer; font-family: inherit; font-size: 16px; color: var(--ink); border-radius: 5px; transition: all 0.15s ease; line-height: 1.4; }
  .choices button:hover { background: var(--ink); color: var(--paper); transform: translateX(4px); }
  .choices button .sub { display: block; font-size: 13px; color: var(--warm); margin-top: 4px; font-style: italic; }
  .choices button:hover .sub { color: #f5c587; }
  figure.illus { margin: 0 0 24px; }
  figure.illus img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 6px 24px rgba(43,36,25,0.18); }

start: {
  id: 'START', title: 'Kellen at Skip-Stone Lake',
  meta: 'A 3-deep CYOA demo for Kellen (12) — both halves, played whole',
  text: `<figure class="illus"><img src="images/kellen_region.webp" alt="Kellen at Skip-Stone Lake — Skim and the flock of blue-feathered birds, the slate scoreboard"><figcaption>Kellen at Skip-Stone Lake — Skim and the flock of blue-feathered birds, the slate scoreboard</figcaption></figure><div class="demo-note"><strong>27 ways through Kellen's region.</strong> He lands at a long flat lake where a flock of blue-feathered bird-creatures plays a CHAMPIONSHIP skipping-stone game. Skim, the lead bird, has been waiting forty years for a kid who plays with all of himself. Your three choices each branch into three more.</div>`,

p150: {
  id: 'P-150', title: 'Arrival at Skip-Stone Lake', meta: 'Kellen',
  text: `<p>Kellen's raft slides up to the edge of a long flat lake. His raft is now a sleek racing canoe with carbon-black sides. He steps onto the shore and a stone skims past his ear.</p>
<p>Bounces nine times across the water.</p>
<p>He turns. A flock of bird-creatures stand on the bank — long-legged, blue-feathered, smug. Piles of stones in front of them and a tiny scoreboard etched into a piece of slate.</p>
<p>The biggest one — white markings around her eyes — notices him. "Kid. This is a CHAMPIONSHIP game. You can watch from over there."</p>
<p>Kellen says, "I'd like to play."</p>
<p>All the birds laugh. The biggest says, "This game requires SKILL. And STRATEGY. Most kids only have one or the other. Possibly neither."</p>
<p>Kellen picks up a stone. He doesn't say anything else. He weighs it in his palm. He turns it over. He checks the flat side against his thumb.</p>
<p>The biggest bird — her name is Skim — watches him do this. "Hmm."</p>
<p>"FINE. The game is called Pattern Skip. Seven approved patterns. CHAMPIONSHIP order. You miss one, you sit out."</p>`,
  choices: [{ label: 'Listen to Skim', target: 'p151' }],
},

p151: {
  id: 'P-151', title: 'The Whole-Self Moment', meta: 'Kellen — cared-for',
  text: `<p>Skim hops over (more of a hop, wings folded behind her like a tiny field general). She holds two stones in her beak. Sets them in front of Kellen.</p>
<p>"Pick the throwing one."</p>
<p>Kellen looks. They look identical to anyone else. They are not identical to him. The one on the left is slightly flatter — better skip surface. The right is heavier — better distance but worse curve. He picks the one on the left.</p>
<p>Skim nods, once. Then she picks up the flatter stone — the one Kellen would have used — and deliberately throws it badly. Skips twice, wobbles, sinks.</p>
<p>"That's how it goes if I only use my throwing arm. If I forget the rest of me. Did you see?"</p>
<p>Kellen did see.</p>
<p>"I've been doing this forty years. You know what I see most? Kids who hide one of their halves. Athletes pretending they're not smart. Smart kids pretending they're not athletic. They think they have to pick. They think people will tease them if they're both."</p>
<p>She tilts her head at him. "You're both. I saw your hand on that stone. I saw you READ it. Don't hide it. Eyes, hands, thinking, instinct. The whole kid. Yes?"</p>
<p>Kellen is quiet longer than he expected.</p>
<p>Because here's the thing he hasn't told anyone: he has, quietly, been keeping one half tucked away. Not because anyone made him. Because if you show both at once people don't always know what to do with you. He learned that in fourth grade and got good at it.</p>
<p>He says, quietly: "It's just easier sometimes. Showing one at a time."</p>
<p>"I know. Most kids who hide a half find it easier. That's why I told you first. So you don't have to hide here."</p>
<p>"Yes," he says. He means it this time.</p>
<p>Skim hops back a step. "Prove it. One throw. Now. Anywhere on the water. But I want you to pick where it lands, in your head, BEFORE you throw."</p>
<p>Kellen looks at the lake. He picks a spot — out past the second cove, a small ring of glassy water between two ripples, no bigger than a dinner plate. He doesn't say it out loud.</p>
<p>He weighs the stone. He times his step to the next gust of wind. He throws.</p>
<p>The stone skips out — one, two, three, four — and lands in the dinner-plate of glass. Exactly. The flock turns as one. Skim makes a sound that is somewhere between a laugh and a cry.</p>
<p>"You SAW that," she says. "And you HIT it. Both halves. In one throw. <em>That</em> is what I have been waiting forty years to see."</p>
<p>Kellen picks the throwing stone. He is, for the first time in a year, all the way in his own body.</p>`,
  choices: [{ label: 'Begin the game', target: 'p152' }],
},

p152: {
  id: 'P-152', title: 'CHOICE 1 — How do you begin?', meta: 'First decision',
  text: `<p>Skim raises a tiny wing-flag. "Kid. How do you want to begin?"</p>`,
  choices: [
    { label: '"First approved pattern. Show me." Play through the seven.', target: 'p153', sub: "Honest play. Beat them at their own game." },
    { label: '"Skim — you go first. Let me watch how YOU do it."', target: 'p154', sub: "Patient. You'll learn the patterns by watching, then play them better." },
    { label: '"What happens if I invent a new pattern?"', target: 'p155', sub: "Risky. The birds might laugh. They also might not." },
  ],
},

<p>Kellen throws. The stone obeys.</p>

p154: {

  text: `<p>Skim's head tilts. The other birds make small surprised sounds. Nobody has ever asked her to demonstrate first. She likes this kid.</p>

p155: {
  id: 'P-155', title: 'CHOICE 2C — What kind of new pattern?', meta: 'You proposed an invention',
  text: `<p>The birds laugh — automatic, dismissive. Skim does not laugh.</p>
<p>"Nobody has invented a new pattern in three hundred years."</p>
<p>"Why not?"</p>
<p>"Because the SEVEN are perfect. They are HISTORICAL. They are APPROVED."</p>
<p>"By who?"</p>
<p>The birds open their mouths. Then they close them. Then they look at Skim. Skim is quiet for a long moment.</p>
<p>"I don't actually know. Nobody does. They've just always been the seven."</p>
<p>Kellen nods. "I have an idea. Three of them, actually. Pick the one you want to try."</p>`,
  choices: [
    { label: 'The MIRROR — you throw reversed of whatever she throws', target: 'p155a', sub: "Two stones, mirroring across the lake." },
    { label: 'The ECHO — same pattern, delayed; you chase her', target: 'p155b', sub: "She leads. You answer. Two-stone duet." },
    { label: 'The QUESTION-AND-ANSWER — she throws a half pattern, you complete it differently', target: 'p155c', sub: "A real dialogue. Made of stones." },
  ],
},

p153a: {

  text: `<p>You play the patterns. Clean. Honest. No flourish. The birds get quieter with each one. By the fifth pattern, the flock is taking notes.</p>

  choices: [

p153c: {

    { label: 'At normal volume — everyone hears', target: 'leaf_153c2', sub: "Let the whole flock learn your thinking." },
    { label: 'Narrate the WHY of each pattern, not the what', target: 'leaf_153c3', sub: "Reveal the meaning each pattern hides." },
  ],

p154a: {
  id: 'P-154A', title: 'CHOICE 3 — How do you apply her technique?', meta: 'You studied her hands',
  text: `<p>You watched her hand and hip. You see exactly what she does. Now it's your turn.</p>`,
  choices: [
    { label: 'Copy her exactly — same hands, same hip', target: 'leaf_154a1', sub: "Honor her by mimicry. Show you saw." },

p154b: {
  id: 'P-154B', title: 'CHOICE 3 — Where do you aim, knowing what she watches?', meta: 'You watched her eyes',
  text: `<p>You noticed where she looks before each throw — never AT the bounce point, always one bounce AHEAD. You can use that.</p>`,
  choices: [

p154c: {
  id: 'P-154C', title: 'CHOICE 3 — How do you sync your breath?', meta: 'You studied her timing',
  text: `<p>You noticed her breath. The way she exhales just before release. The way the throw rides on the exhale.</p>`,
  choices: [
    { label: 'Match her breath rhythm exactly', target: 'leaf_154c1', sub: "Become her tempo. Disappear into it." },

    { label: 'Time your release to her exact exhale moment', target: 'leaf_154c3', sub: "Throw on her breath. A shared body." },

},

  text: `<p>Skim is quiet for ten full seconds. Then she says: "Throw."</p>
<p>She picks her stone. You walk to the line together. She throws first — <em>three short, a curve right, a long, a stop.</em></p>
<p>How exactly do you mirror?</p>`,
  choices: [

    { label: 'Mirror with a beat — slight delay, then reverse', target: 'leaf_155a3', sub: "Echo first, then mirror. A two-step." },

},

p155b: {
  id: 'P-155B', title: 'CHOICE 3 — How does the Echo work?', meta: 'You proposed an echo',
  text: `<p>Skim's head tilts again. "Echo. Like a song coming back off a cliff?"</p>
<p>"Like that."</p>

p155c: {

  text: `<p>Skim's wings ruffle. "A QUESTION-AND-ANSWER. Like a — like a CONVERSATION made of stones."</p>

leaf_153a1: {
  id: 'L-1', title: 'Breathe Between Patterns', meta: 'Let the lake catch up',
  text: `<p>You pause for one full breath between each pattern. The first one. The smallest bird notices. The second one. Two more notice. By the fourth pattern the whole flock is breathing with you, chests rising and falling like a tide. Even the lake seems to inhale between throws.</p>
<p>The seventh pattern lands. You exhale. The flock exhales. There is a small silence after, the kind you only hear when nobody is rushing to fill it.</p>
<p>Skim hops over slowly. Her wings are still folded. Her voice is low.</p>
<p>"You made us BREATHE, kid. With you. Forty years of this game and I have never once heard the flock breathe with a thrower. Take this." She lays the True-Skipping Stone in your palm — a perfect slate-grey disc, cool, slightly warm where her beak held it. "Use it when the room needs to breathe. It always knows."</p>`,
  earns: { item: ['stone', 'base'], flags: ['WholeKidPlay'] }, next: 'exit',
},

leaf_153a2: {
  id: 'L-2', title: 'Eye Contact Between Patterns', meta: 'Be seen',
  text: `<p>You look up at the birds between each pattern. You meet eyes. You don't smile. You don't smirk. You just LOOK at them — calmly, honestly, like a person who isn't hiding.</p>
<p>By the fifth pattern they have stopped being birds-in-judgment and become birds-who-are-watching-a-friend. Skim gives you the stone. "You let us SEE you. Most kids hide. Take this."</p>`,
  earns: { item: ['stone', 'base'], flags: ['WholeKidPlay', 'SeenSquare'] }, next: 'exit',
},

leaf_153a3: {
  id: 'L-3', title: 'Eyes on the Water', meta: 'Lock in',
  text: `<p>You never look up. Your eyes stay on the lake. The flock leans in, trying to figure out what you see. The water is, to you, a kind of paper that's been waiting to be written on.</p>
<p>Skim's voice is quiet when she hops over. "You looked at the lake. The lake looked back. I have only seen one thrower do that before. Take the stone."</p>`,
  earns: { item: ['stone', 'base'], flags: ['WholeKidPlay', 'LakeLook'] }, next: 'exit',
},

leaf_153b1: {
  id: 'L-4', title: 'Stones Standing on Edge', meta: 'Impossible. Done anyway.',
  text: `<p>You end each pattern with the stone balanced on its edge on the shore. This is impossible. You do it seven times in a row.</p>
<p>By the third one, the flock is openly gasping. By the seventh, the smallest bird has fallen over backward.</p>
<p>Skim, when she hops over with the True-Skipping Stone, is muttering: "Edge balance. Seven for seven. Forty YEARS I have not seen — take this. Take it now before I keep it."</p>`,

leaf_153b2: {

  text: `<p>Each stone ends near a different member of the flock — a tiny offering, set down gently. By the seventh, every bird has had its own personal arrival.</p>
<p>The smallest bird, when its turn came, lit up so brightly that two larger birds applauded for it.</p>
<p>Skim shakes her head. "You gave each of them a moment. Take the stone. Take it. You earned it three patterns ago."</p>`,

},

leaf_153b3: {
  id: 'L-6', title: 'Spelling Skim\'s Name', meta: 'Calligraphy in stone-skips',
  text: `<p>Your seven landing-spots, viewed from above, spell S-K-I-M in cursive. The flock notices around landing-spot four. Around landing-spot seven, Skim is laughing harder than a small champion bird should be allowed to laugh.</p>
<p>"You SPELLED MY NAME. In SKIPPING STONES. Take the stone. Take TWO." (She gives him a backup.) "I have not been NAMED on a lake. Ever."</p>`,

leaf_153c1: {
  id: 'L-7', title: 'Quiet Narration', meta: 'A private duet',
  text: `<p>You talk just loud enough for Skim to hear. "Now I'm going to drop the wrist on the third skip. The wind is coming from the left, so the curve will catch a little extra. The stop should land just past that smooth patch."</p>
<p>By the third pattern, Skim is whispering back. "Yes. Drop deeper. Yes. There."</p>
<p>Two minds, one game. The other birds have no idea what's happening but they can FEEL it.</p>
<p>"Take the stone, kid. You and I are TEAMMATES now."</p>`,

leaf_153c2: {
  id: 'L-8', title: 'Out Loud, Everybody Hears', meta: 'Brain on the table',
  text: `<p>You narrate at full volume. The flock leans in. By the third pattern, they are taking NOTES. "Drop wrist on third skip — wind correction — curve angle increased by 12 degrees." The smallest bird is writing the fastest.</p>
<p>Skim watches you the whole time. After the seventh: "You let them HEAR your brain. Most kids hide it. You handed it to them. They will be better throwers their whole lives. Take the stone."</p>`,

leaf_153c3: {
  id: 'L-9', title: 'Narrating the WHY', meta: 'The hidden meaning of each pattern',
  text: `<p>"This first pattern — three short, two long, one stop — that's a HEARTBEAT pattern. Your sport's oldest pattern is your own pulse, isn't it?"</p>
<p>Skim freezes.</p>
<p>"Pattern two is FOOTSTEPS approaching. Pattern three is RUNNING AWAY. Pattern four is —"</p>
<p>You keep going. The flock is staring at you with their beaks open. Nobody has ever named what the seven patterns MEAN.</p>
<p>Skim, very quietly: "Kid. You just told us what our own game IS. Three hundred years and we didn't know." She hands you the full stone. And a piece of slate. "From the scoreboard. So you remember you taught US."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim'], flags: ['WholeKidPlay', 'NamedThePatterns'] }, next: 'exit',

leaf_154a2: {
  id: 'L-11', title: 'Adapt for a Taller Body', meta: 'Honest geometry',
  text: `<p>You take her technique and adjust for your body. You're taller. Your arc is longer. You lengthen the hip turn. You add a half-step. The stone behaves perfectly.</p>
<p>Skim watches. "You took my technique and made it YOURS. Most kids copy poorly. You translated. Take the stone."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'TranslatedForm'] }, next: 'exit',
},

leaf_154a3: {
  id: 'L-12', title: 'Old Plus New', meta: 'The remix',
  text: `<p>You combine her wrist-drop with the throwing motion you've used since you were eight. The result is something neither of you has seen before — a kind of HYBRID, with Skim's precision and your power.</p>
<p>Skim's beak opens slightly. "That is — that is a NEW STYLE. We will have to name it. Take the stone. AND take this." (She hands him a second small flat stone.) "From me. So I can say, when you become a famous thrower, I gave you your first."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'HybridStyle'] }, next: 'exit',
},

leaf_154b1: {
  id: 'L-13', title: 'Beat Her to the Next Bounce', meta: 'You read where she\'d look',
  text: `<p>You throw to where you saw Skim's eyes go. The stone lands exactly where she was looking — half a beat before her own throw would have arrived. She turns to you slowly.</p>
<p>"You saw where I LOOK. Not where I THREW. Where I LOOK." She gives you the stone. "Take this. You are a STRATEGIST. We don't have many of those."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'ReadHerEyes'] }, next: 'exit',
},

leaf_154b2: {
  id: 'L-14', title: 'Throw Where She Isn\'t Looking', meta: 'Surprise the champion',
  text: `<p>You throw to a spot of water Skim was deliberately ignoring — a patch of glassy water off to the right. The stone skips beautifully across it. The flock looks RIGHT, in unison, like they have to recalibrate their world.</p>
<p>Skim says, slowly, "You just showed us water we'd been pretending was off-limits. Why?"</p>
<p>"It wasn't off-limits. You just hadn't tried it."</p>
<p>Skim is quiet for a long moment. Then she gives you the stone AND a second one. "Show me three more 'off-limits' spots. The flock has STUFF to learn from you."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'NewWaterFound'] }, next: 'exit',
},

leaf_154b3: {
  id: 'L-15', title: 'Eyes Closed, Last Throw', meta: 'Trust what you learned',
  text: `<p>For the seventh pattern, you close your eyes. The flock GASPS.</p>
<p>You throw. Bounce. Bounce. Bounce. Long. Long. Stop. Perfect.</p>
<p>You open your eyes. The stone is exactly where it should be. Skim is staring at you with an expression no human has ever seen on a bird before.</p>
<p>"You. Closed. Your. Eyes." She gives you the stone. AND she perches on your shoulder. "I am coming with you. Don't argue. I have decided."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim'], flags: ['WholeKidPlay', 'EyesClosedThrow'] }, next: 'exit',
},

leaf_154c1: {
  id: 'L-16', title: 'Match Her Breath', meta: 'Disappear into her tempo',
  text: `<p>You sync your breathing to Skim's. In, out, in, out. The flock watches. By the third pattern, the whole flock is breathing with you. The lake itself seems to be exhaling between throws.</p>
<p>Skim gives you the stone, very gently. "You made us all breathe together. That is — that is RELIGIOUS, kid. Take the stone."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'BreathSync'] }, next: 'exit',
},

leaf_154c2: {
  id: 'L-17', title: 'Steps to Her Wing-Fold', meta: 'Metronome match',
  text: `<p>You take a step every time Skim folds her wings. Step, fold. Step, fold. By the fifth pattern, you and Skim are walking the same invisible rhythm, the lake keeping time underneath you.</p>
<p>Skim hands you the stone. "You took my BODY as a clock. Nobody has done that. You may keep me. Or I will keep you. We have not decided."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay', 'WingFoldStep'] }, next: 'exit',
},

leaf_154c3: {
  id: 'L-18', title: 'Throw on Her Exhale', meta: 'A shared body',
  text: `<p>You time your release to the precise moment of Skim's exhale. The stones leave your hands together. They land in mirror positions on the water.</p>
<p>It happens seven times. By the seventh, Skim is so emotional she can barely call the next pattern.</p>
<p>"Kid. We THREW. TOGETHER. Take the stone. AND take this." (She breaks off one of her own feathers and hands it to him.) "A piece of me. So I am with you when I am not with you."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim'], flags: ['WholeKidPlay', 'SkimFeather'] }, next: 'exit',
},

// LEAVES — PATH C (INVENT)

leaf_155a1: {
  id: 'L-19', title: 'The Mirror, Clean', meta: 'Straight reverse',
  text: `<p>You throw the perfect mirror. Curve left where she went right. Same number of skips. Same length. The two stones land beside each other on the same flat patch of water, mirroring across an invisible line.</p>
<p>Skim trumpets. The flock goes silent. Then the smallest bird whispers: "<em>We have eight patterns now.</em>"</p>
<p>Skim turns to you. "Kid. The Mirror is the eighth. It is named after YOU." She hands you the True-Skipping Stone, a backup, and an unspoken promise.</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented'] }, next: 'exit',
},

leaf_155a2: {
  id: 'L-20', title: 'The Double Mirror', meta: 'Reverse and flip',
  text: `<p>You mirror across BOTH axes — reverse her path AND invert the angles. The two stones make a diagonal symmetry that looks like geometry.</p>
<p>The flock is silent. One of them is openly weeping (it is the smallest one, which trips over its own tail in surprise at how moved it is).</p>
<p>Skim, voice cracking: "You made GEOMETRY out of skipping. We have eight patterns now. It is called the DOUBLE MIRROR. Or — KELLEN'S MIRROR. Yes. KELLEN'S MIRROR."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'GeometryThrow'] }, next: 'exit',
},

leaf_155a3: {
  id: 'L-21', title: 'The Delayed Mirror', meta: 'Echo, then reverse',
  text: `<p>You wait a full second after Skim's stone lands. THEN you throw. Your stone echoes her path for the first three skips — then suddenly mirrors the rest. It's a two-part pattern. Two minds in conversation.</p>
<p>Skim is breathless. "You added TIME to the mirror. Eight patterns. Or — we should call it nine, since this is its own thing." She gives you the stone and a tiny silver wing-pin. "An officer's pin. I am promoting you to OFFICER of the Skip-Stone Flock."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'OfficerPin'] }, next: 'exit',
},

leaf_155b1: {
  id: 'L-22', title: 'The Slow Echo', meta: 'Held a little longer',
  text: `<p>Skim throws. You wait. Then you throw the same pattern but slower — fewer skips, longer arc between each. The lake holds your stone in the air just a heartbeat extra.</p>
<p>Skim watches the whole thing. When your stone finally stops: "You SLOWED my pattern. You made it BREATHE. Kid. The ECHO is the eighth pattern. Take the stone."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'SlowEcho'] }, next: 'exit',
},

leaf_155b2: {
  id: 'L-23', title: 'The Urgent Echo', meta: 'Faster, like a heart catching up',
  text: `<p>Skim throws. You throw immediately after — same pattern, faster. The lake responds. Your stone catches hers at the last bounce. They land together, your stone an inch behind hers.</p>
<p>The flock claps with their wings. Skim, breathless: "You CAUGHT my pattern. You CHASED it down. That is — that is the URGENT ECHO. Eighth pattern. Take the stone, kid."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'UrgentEcho'] }, next: 'exit',
},

leaf_155b3: {
  id: 'L-24', title: 'The Echo That Surpasses', meta: 'Past the original',
  text: `<p>Skim throws. You throw — same pattern, but your final skip goes ten feet PAST hers. The flock holds its breath. Did you just OUT-CHAMPION the champion?</p>
<p>Skim watches. She does not look angry. She looks RELIEVED.</p>
<p>"Kid. I have been the longest skip on this lake for FORTY YEARS. It has been LONELY. You just BEAT me. I have wanted this." She gives you the stone, hops onto your shoulder, and announces to the flock: "We have a NEW CHAMPION. AND a new pattern. I am taking a VACATION."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'NewChampion'] }, next: 'exit',
},

leaf_155c1: {
  id: 'L-25', title: 'Answer with a Surprise', meta: 'Resolve unexpectedly',
  text: `<p>Skim throws half a pattern — three short, then a held silence. The flock expects you to finish with the obvious two-long-and-stop.</p>
<p>You throw a single LONG curve that arcs all the way around the lake and lands behind Skim. She turns slowly. The flock GASPS.</p>
<p>"You — you SURPRISED ME. The QUESTION-AND-ANSWER. Eighth pattern. Take the stone. AND take my SCOREBOARD-CHALK." (She gives him a tiny piece of slate.) "When you invent the NEXT pattern, write it on your own board."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'SurpriseResolution'] }, next: 'exit',
},

leaf_155c2: {
  id: 'L-26', title: 'Answer with Another Question', meta: 'Keep the dialogue going',
  text: `<p>Skim throws half a pattern. You finish it — and then throw a NEW half-pattern back at her. She blinks. She throws a finish to your half. You throw a new half. By the fifth round, the flock has stopped breathing.</p>
<p>You and Skim have invented a STONE CONVERSATION that lasts twelve rounds, with no winner and no end.</p>
<p>Skim, eventually: "Kid. We just had a CONVERSATION made of stones. That is the QUESTION-AND-ANSWER pattern. We can do it FOREVER. Take the stone. Take TWO. Take the flock."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock'], flags: ['WholeKidPlay', 'PatternInvented', 'StoneConversation'] }, next: 'exit',
},

leaf_155c3: {
  id: 'L-27', title: 'Invite the Smallest Bird', meta: 'Three throwers',
  text: `<p>Skim throws half a pattern. You're about to answer. You stop. You turn to the smallest bird — the one who trips over its own feet — and say, "You finish it."</p>
<p>The smallest bird FREEZES. It has never been asked to throw in a real game.</p>
<p>It picks up a stone. It wobbles to the line. It throws — wobbly, off-balance, with everything it has.</p>
<p>The stone bounces SEVEN times. Then it lands, perfectly, in the exact spot that completes Skim's pattern. The flock erupts.</p>
<p>The smallest bird is on the ground, weeping with joy. Skim is staring at YOU.</p>
<p>"Kid. You included the SMALLEST OF US. You made the QUESTION-AND-ANSWER a TRIO. We have invented something bigger than a pattern. We have invented a NEW WAY OF PLAYING. Take the stone. Take the flock. Take the smallest one's tiny silver collar — she's giving it to you."</p>
<p>The smallest one, still weeping, presses a small silver feather-ring into Kellen's palm.</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim', 'SkipStoneFlock', 'SmallestBird'], flags: ['WholeKidPlay', 'PatternInvented', 'IncludedSmallest'] }, next: 'exit',
},

exit: {
  id: 'EXIT', title: "The Flock Walks Him to His Canoe", meta: 'Kellen — region complete',
  text: `<p>The racing canoe is where Kellen left it. The stones in his pocket clack softly against each other.</p>
<p>Skim flies one loop above him, settles on the bow of his canoe like she's claimed it (if she's coming).</p>
<p>Before Kellen pushes off, Skim hops to the seat in front of him and looks him square in the face. Her voice is small. Just for him.</p>
<p>"Kid. The thing you did — playing with all of yourself, both halves out — most adults have forgotten how. They picked one half a long time ago and got stuck with it. You can teach them. Just by being you."</p>
<p>Kellen nods. Then, mostly to himself, he says it once out loud to make sure he doesn't forget:</p>
<p><em>"Played whole. It worked."</em></p>
<p>That's the line. The one he'll remember when he is fifteen and twenty and forty.</p>
<p>He pushes off. He paddles toward the sound of the C-130, faint and far, somewhere up in the world above.</p>
<p style="margin-top:32px; padding:16px; background:rgba(74,125,140,0.08); border-left:3px solid var(--water); border-radius:0 4px 4px 0; font-size:14px; line-height:1.5;"><strong>End of Kellen's region.</strong> 27 different ways through. Click "Start over" to try another.</p>`,
  isEnd: true, choices: [],
},
