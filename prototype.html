  text: `<p>The truck doors open at the same time.</p>

<p>They line up at the end of the dock. Eight kids in a row. The wood is hot. The water is so clear they can see the brown shadow of the pilings underneath.</p>

p111: {
  id: 'P-111',
  type: 'always',
  title: 'The Cared-For Moment',
  region: 'madison',
  text: `<p>"Wait. Don't sit. STAND. We have been watching you walk down the bank."</p>
<p>Madison blinks. "Why?"</p>
<p>Pip steps closer. "You're a DANCER. We can tell from how you walk. The way your feet land. The way your spine moves with your head. We have been HOPING for a dancer for a very long time."</p>
<p>Lark says, "We knew one of you would be. Pools know. We have been WAITING."</p>
<p>Madison is a little surprised. She knows she's a good dancer &mdash; her teacher has told her, her family has told her, she has the trophies and the placements in her room that say so. But she has never met an audience this hungry for a dancer. The Sisters are looking at her the way people look at something they've been hoping to see for years.</p>
<p>Wren tugs her hand. "Can we see you do something? Please? We've been thinking about it for so long."</p>
<p>Pip raises one small wet hand. Three flat stones lift from the pool and hover an inch above the surface, forming a small triangular stage just within Madison's reach. The water around them goes glassy.</p>
<p>Madison thinks for one second. Then she picks the adagio &mdash; the one her teacher built FOR her last semester. The hardest one she does in studio. The long arabesque. The turn that took her three months to clean.</p>
<p>She steps onto the first stone. Her body knows what to do.</p>
<p>She dances three measures. They are very good measures. The arabesque is exactly as long as it should be. The turn lands clean. She has danced this same sequence a hundred times. She has never danced it with this much attention from an audience.</p>
<p>The three Sisters do not clap. They do not whistle. They WATCH the way an audience that has been waiting for years watches when the wait is finally over &mdash; with their full faces, with their breath held, with the quiet that says <em>please don't let this end</em>.</p>
<p>When she steps off the last stone, the pool ripples in a pattern around the three stones that looks, faintly, like a standing ovation made of water.</p>
<p>Pip whispers: "Thank you, Madison. That was BEAUTIFUL."</p>
<p>Lark wipes a Sister-tear that goes up. "We don't get dancers. People don't dance for a pool. They dance for other people. You danced for us anyway."</p>
<p>Madison feels something specific in her chest. Not surprise &mdash; she knew she could do it. Not the warmth of being praised &mdash; she gets praised, that's familiar. Something newer than that: the warmth of having SHARED something she loves with an audience that genuinely, specifically needed to see it. Her grace went somewhere today that it has never gone before. Three small water-girls had been waiting for years for it. She brought it.</p>
<p>She sits down on the bank. Her hair drips upward, just a little. She catches sight of herself in the pool's reflection &mdash; fifteen years old, breath steady, all three Sisters still beaming at her &mdash; and laughs out loud. The laugh of someone who brought a gift and discovered the gift was exactly the right one.</p>
<p>Pip nods. "Go back to your cousins now. We will remember today for a very long time. You were exactly what we had been hoping for."</p>`,

},

p113: {
  id: 'P-113',
  type: 'path',
  title: 'PATH A — Take the Piece',
  region: 'madison',
  text: `<p>Madison opens her tin and shares fairly. One for Pip. One for Lark. Biggest for Wren, because Wren is smallest. (Wren cries with joy.) The Sisters eat the cookies the way creatures eat who have never had anything baked before.</p>
<p>When they're done, the three Sisters nod at each other in the way of people who have just received something and now have to give something back.</p>
<p>Lark slips into the pool and comes up with a small lavender stone, glowing faintly. "For you. It's a <em>quiet stone.</em> Hold it when a place is too loud. It pulls the noise into itself and gives you back about ten seconds of quiet. Only works if you got it from a sister."</p>
<p>Wren hands Madison a pondweed-and-pebble bracelet she has been making during the cookie sharing. "I MADE it." It is the saddest bracelet ever assembled. Madison says, "It's beautiful." And means it. She slips it on her wrist.</p>
<p>Pip hands her the paper. Water-warped at the edges, ink swimming a little but readable. The cove. The data center on the dry lakebed. The drainage path straight down the canyon, into the river, away forever.</p>
<p>It does NOT show the bank fraud. The other two pieces are elsewhere.</p>
<p>Madison rolls the paper. Tucks it inside her cookie tin. The tin clicks closed. Warm in her hands.</p>
<p>Pip: "This is most of it. Not all. But you'll know what to say."</p>
<p>Wren tugs her hand. "Will you come back?"</p>
<p>Madison kneels. "Yes." She means it.</p>
<p>The Sisters walk her back. Pip stops at the trees: "Tell our older sister hi."</p>
<p>Madison: "Who's your older sister?"</p>
<p>Lark: "The big one. The cove."</p>
<p>Madison stops walking. The lake at home is family to these girls. That lake is family to HER. Something lands in her chest she'll figure out later.</p>`,

p114: {

  type: 'path',
  title: 'PATH B — Ask What They Need',
  region: 'madison',
  text: `<p>Madison doesn't open the tin. "What do you NEED?"</p>
<p>Pip blinks. "Most people don't ask us that. They're HUNGRY for what we have. They don't notice we might need something too."</p>
<p>The first piece is here. The other two are downstream, in the lodge of a grumpy beaver named Branch who has been collecting interesting things for two hundred years. He won't give them back. The Sisters have asked a hundred times.</p>
<p>"He might say yes to YOU. He likes people who SIT."</p>
<p>At a bend in the river, a beaver lodge with smoke that smells like dried mint. Madison knocks. Branch appears &mdash; grumpy face, tiny spectacles, tea towel over one shoulder.</p>
<p>"What."</p>
<p>"Hello, Branch. I'm Madison. May I come in?"</p>
<p>Branch finds this confusing in a way he likes. "...Fine."</p>
<p>Inside: a tiny rocking chair, a teapot, and a wall of WONDERFUL trash &mdash; a spoon, a ceramic pig, two folded papers. Madison sips a thimble of tea. She does NOT ask about the papers. She asks about the spoon.</p>
<p>Branch lights up. The spoon takes nine minutes. The pig takes longer. Forty minutes go by.</p>
<p>At the end Branch is quiet for a long time. Then: "You're the first person in two hundred years who didn't ask me for the papers first."</p>
<p>Madison: "I figured you'd tell me about them when you wanted to."</p>
<p>Branch hands her the two papers. Then: "I'm coming with you. To wherever the man with the clipboards is. I'll witness."</p>
<p>She rolls the three pieces together. The whole shape of the lie. Branch puts on a small bow tie.</p>`,

p115: {
  id: 'P-115',
  type: 'path',
  title: 'PATH C — Notice Wren',
  region: 'madison',
  text: `<p>Madison was about to open the tin. She doesn't. Wren has gone quiet.</p>
<p>"Wren. Hey. What's the matter?"</p>
<p>Wren, voice so small Madison has to lean in: "She didn't sing last night."</p>
<p>"Who didn't?"</p>
<p>Pip, quickly: "Nobody. It's nothing." Lark: "Pip."</p>
<p>Wren: "The lady. The one who sings."</p>
<p>Lark sings three notes, very quietly. The pool hums them back. Three notes &mdash; clear, full, the kind of voice that carries.</p>
<p>"That's HER voice. She sings here some nights. We don't know who she is. The lake remembers her."</p>
<p>Madison's skin prickles. Because Madison KNOWS that voice.</p>
<p>She doesn't know HOW she knows it. She just does. She HAS heard this voice. Two summers ago. A hot July night, late, after the brisket was gone. The sound came across the water from somewhere nobody could place &mdash; somebody, somewhere, singing opera. The grown-ups had laughed about it the next morning. They'd all pretended not to know who it was.</p>
<p>But Madison had watched her mother's face that next morning. Her mother had been very busy looking at her coffee.</p>
<p>Wren is crying without making a sound. The tears go up her face.</p>
<p>Madison puts her arm around the smallest Sister. She doesn't say it'll be okay. She just holds her and lets her cry the wrong direction.</p>
<p>Pip: "There's a fourth piece of the map. It's not on paper. It's the song the lady sings. If you can hear it, you'll know what the lake itself thinks about Mr. Drystone."</p>
<p>Madison does the only thing she can do &mdash; the thing she's actually good at.</p>
<p>Pip lifts a hand. Three flat stones rise out of the pool, in a line across the water. The same color as the basalt at home.</p>
<p>Madison steps onto the first one. It holds. She hasn't danced in a year. Maybe more. But her body remembers.</p>
<p>She steps to the second stone in one clean line. Head up, shoulders down, the foot finding the place before you trust it. She turns once on the second stone. She crosses to the third and finishes in fourth position, arms soft, eyes closed.</p>
<p>The pool hums. Three notes. Low. Then a long pause.</p>
<p>And then &mdash; from somewhere far away, maybe under the pool, maybe on the other side of the canyon &mdash; three notes come back. Sung in answer. A woman's voice. Operatic. Big. Beautiful.</p>
<p>Wren laughs through her wrong-direction tears.</p>
<p>The whole Map. Everything Drystone has done. The tin glows, very faintly, like firelight inside a paper lantern.</p>`,
