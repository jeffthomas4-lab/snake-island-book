  text: `<p>The truck doors open at the same time.</p>

<p>They line up at the end of the dock. Eight kids in a row. The wood is hot. The water is so clear they can see the brown shadow of the pilings underneath.</p>

p111: {
  id: 'P-111',
  type: 'always',
  title: 'The Cared-For Moment',
  region: 'madison',
  text: `<p>"Sit DOWN. You've been holding it together for everyone for three days. We can tell."</p>
<p>Madison opens her mouth to say she's fine. Pip: "Don't." Wren tugs her hand. "Float."</p>
<p>The pool will hold you up, if you let it. The water here is the kind of water that knows what tired is.</p>
<p>Madison sits. Then lies back. Then floats.</p>
<p>For one minute &mdash; sixty whole seconds, no one counting but everyone knowing &mdash; Madison just floats. The sky is so green it isn't a sky color. Wren puts a pondweed cookie on her stomach. Wren is very proud of this gesture.</p>
<p>Nobody asks her anything. Nobody needs anything from her.</p>
<p>Then the pool does something it has not done in a hundred years. It shows her a memory it has been saving.</p>
<p>It is just a flash. Three seconds, no more. Madison sees the lake at home, from underwater &mdash; the wobbly shimmer of the surface, and above it, eight pairs of legs all in a row at the end of the dock. Eight pairs. Her cousins' legs. Her own legs. The legs bend. The legs jump. The water erupts above her with eight bodies arriving at once and the sound is the sound of <em>the trip starting,</em> the way it has every July of her whole life.</p>
<p>The memory fades.</p>
<p>Madison's eyes are wet for a reason that has nothing to do with the Sisters. The pool gave her <em>that.</em> For no reason. As a gift. Because she was floating.</p>
<p>She is fifteen years old and someone is taking care of her.</p>
<p>When she sits back up, her hair is dripping upward, just a little. Pip nods. "Okay. NOW you can be in charge again."</p>
<p>Madison laughs. A real one.</p>
<p>Pip: "We have something to tell you. About the lake-up-above. About the man with the clipboards."</p>`,
  choices: [{ label: 'Listen', target: 'p112' }],
},

p113: {
  id: 'P-113',
  type: 'path',
  title: 'PATH A — Take the Piece',
  region: 'madison',
  text: `<p>Madison opens her tin and shares fairly. One for Pip. One for Lark. Biggest for Wren, because Wren is smallest. (Wren cries with joy.) The Sisters eat the cookies the way creatures eat who have never had anything baked before.</p>
<p>When they're done, the three Sisters nod at each other in the way of people who have just received something and now have to give something back.</p>
<p>Lark slips into the pool and comes up with a small lavender stone, glowing faintly. "For you. It's a <em>quiet stone.</em> Hold it when a place is too loud. It pulls the noise into itself and gives you back about ten seconds of quiet. Only works if you got it from a sister."</p>
<p>Wren hands Madison a pondweed-and-pebble bracelet she has been making during the cookie sharing. "I MADE it." It is the saddest bracelet ever assembled. Madison says, "It's beautiful." And means it. She slips it on her wrist.</p>
<p>Pip hands her the paper. Water-warped at the edges, ink swimming a little but readable. The cove. The data center on the dry lakebed. The drainage path straight down the canyon, into the river, away forever.</p>
<p>It does NOT show the bank fraud. The other two pieces are elsewhere.</p>
<p>Madison rolls the paper. Tucks it inside her cookie tin. The tin clicks closed. Warm in her hands.</p>
<p>Pip: "This is most of it. Not all. But you'll know what to say."</p>
<p>Wren tugs her hand. "Will you come back?"</p>
<p>Madison kneels. "Yes." She means it.</p>
<p>The Sisters walk her back. Pip stops at the trees: "Tell our older sister hi."</p>
<p>Madison: "Who's your older sister?"</p>
<p>Lark: "The big one. The cove."</p>
<p>Madison stops walking. The lake at home is family to these girls. That lake is family to HER. Something lands in her chest she'll figure out later.</p>`,
  earns: { item: ['map', 'base'] },
  choices: [{ label: 'Exit', target: 'p116' }],

p114: {
  id: 'P-114',
  type: 'path',
  title: 'PATH B — Ask What They Need',
  region: 'madison',
  text: `<p>Madison doesn't open the tin. "What do you NEED?"</p>
<p>Pip blinks. "Most people don't ask us that. They're HUNGRY for what we have. They don't notice we might need something too."</p>
<p>The first piece is here. The other two are downstream, in the lodge of a grumpy beaver named Branch who has been collecting interesting things for two hundred years. He won't give them back. The Sisters have asked a hundred times.</p>
<p>"He might say yes to YOU. He likes people who SIT."</p>
<p>At a bend in the river, a beaver lodge with smoke that smells like dried mint. Madison knocks. Branch appears &mdash; grumpy face, tiny spectacles, tea towel over one shoulder.</p>
<p>"What."</p>
<p>"Hello, Branch. I'm Madison. May I come in?"</p>
<p>Branch finds this confusing in a way he likes. "...Fine."</p>
<p>Inside: a tiny rocking chair, a teapot, and a wall of WONDERFUL trash &mdash; a spoon, a ceramic pig, two folded papers. Madison sips a thimble of tea. She does NOT ask about the papers. She asks about the spoon.</p>
<p>Branch lights up. The spoon takes nine minutes. The pig takes longer. Forty minutes go by.</p>
<p>At the end Branch is quiet for a long time. Then: "You're the first person in two hundred years who didn't ask me for the papers first."</p>
<p>Madison: "I figured you'd tell me about them when you wanted to."</p>
<p>Branch hands her the two papers. Then: "I'm coming with you. To wherever the man with the clipboards is. I'll witness."</p>
<p>She rolls the three pieces together. The whole shape of the lie. Branch puts on a small bow tie.</p>`,
  earns: { item: ['map', 'enhanced'], allies: ['Branch'] },
  choices: [{ label: 'Exit', target: 'p116' }],
},

p115: {
  id: 'P-115',
  type: 'path',
  title: 'PATH C — Notice Wren',
  region: 'madison',
  text: `<p>Madison was about to open the tin. She doesn't. Wren has gone quiet.</p>
<p>"Wren. Hey. What's the matter?"</p>
<p>Wren, voice so small Madison has to lean in: "She didn't sing last night."</p>
<p>"Who didn't?"</p>
<p>Pip, quickly: "Nobody. It's nothing." Lark: "Pip."</p>
<p>Wren: "The lady. The one who sings."</p>
<p>Lark sings three notes, very quietly. The pool hums them back. Three notes &mdash; clear, full, the kind of voice that carries.</p>
<p>"That's HER voice. She sings here some nights. We don't know who she is. The lake remembers her."</p>
<p>Madison's skin prickles. Because Madison KNOWS that voice.</p>
<p>She doesn't know HOW she knows it. She just does. She HAS heard this voice. Two summers ago. A hot July night, late, after the brisket was gone. The sound came across the water from somewhere nobody could place &mdash; somebody, somewhere, singing opera. The grown-ups had laughed about it the next morning. They'd all pretended not to know who it was.</p>
<p>But Madison had watched her mother's face that next morning. Her mother had been very busy looking at her coffee.</p>
<p>Wren is crying without making a sound. The tears go up her face.</p>
<p>Madison puts her arm around the smallest Sister. She doesn't say it'll be okay. She just holds her and lets her cry the wrong direction.</p>
<p>Pip: "There's a fourth piece of the map. It's not on paper. It's the song the lady sings. If you can hear it, you'll know what the lake itself thinks about Mr. Drystone."</p>
<p>Madison does the only thing she can do &mdash; the thing she's actually good at.</p>
<p>Pip lifts a hand. Three flat stones rise out of the pool, in a line across the water. The same color as the basalt at home.</p>
<p>Madison steps onto the first one. It holds. She hasn't danced in a year. Maybe more. But her body remembers.</p>
<p>She steps to the second stone in one clean line. Head up, shoulders down, the foot finding the place before you trust it. She turns once on the second stone. She crosses to the third and finishes in fourth position, arms soft, eyes closed.</p>
<p>The pool hums. Three notes. Low. Then a long pause.</p>
<p>And then &mdash; from somewhere far away, maybe under the pool, maybe on the other side of the canyon &mdash; three notes come back. Sung in answer. A woman's voice. Operatic. Big. Beautiful.</p>
<p>Wren laughs through her wrong-direction tears.</p>
<p>The whole Map. Everything Drystone has done. The tin glows, very faintly, like firelight inside a paper lantern.</p>`,
  earns: { item: ['map', 'full'], flags: ['CanyonSinger'] },
  choices: [{ label: 'Exit', target: 'p116' }],
},

p120: {

  type: 'always',
  title: 'The Driftwood Stage',
  region: 'chayten',
  text: `<p>Chayten's raft slides onto a grassy hill above a half-moon of water. Below her, a natural amphitheater curves down to a long flat stage of pale driftwood. The seats are stones &mdash; not stones placed there, <em>stones that grew there</em> &mdash; in tidy rows. Some are bigger than her house.</p>
<p>They are humming.</p>
<em class="variant">[Variant per strategy: Aiden grabs her hand / 3 others including Aiden / alone, no Aiden]</em>
<p>On the stage, a dozen otters running in panic. One &mdash; old, gray-muzzled, wearing a velvet cape and a single small bandage wrapped around his whiskers &mdash; sits in the middle of the stage looking absolutely calm in the way of a man whose world is ending.</p>
<p>He sees Chayten. He stands very slowly. He bows. Then winces, because bowing tugs his bandaged whiskers.</p>
<p>"OTTO. Lead actor. Or <em>was</em>. The Stones go on in forty minutes. You. With the EYES. Get DOWN here."</p>`,
  choices: [{ label: 'Walk down to the stage', target: 'p121' }],
},

p121: {
  id: 'P-121',
  type: 'always',
  title: 'The Be-a-Kid Moment',
  region: 'chayten',
  text: `<p>Chayten walks down. Otto bows. (Winces.)</p>
<p>"The Stones go on in forty minutes. You have the EYES. You will play the lead. Yes?"</p>
<p>Chayten opens her mouth to say yes &mdash; saying yes is approximately ninety percent of her personality.</p>
<p>Otto holds up one paw. "Stop. Wait. Look at me."</p>
<p>Otto squints. He sees, very clearly, the way Chayten has been holding herself &mdash; like a chaperone at someone else's party, like a sister who has misplaced her brother for the first time in seven years.</p>
<p>"He is FINE."</p>
<p>"Who?"</p>
<p>"The small one. The one you're missing. <em>He is fine.</em> He is somewhere doing something brave. You can feel him."</p>
<p>Chayten checks the place where she can always feel Aiden. He is, in fact, fine. He is also, somehow, riding something that is not a horse.</p>
<p>She lets out a breath.</p>
<p>Otto: "Good. Now. You are not a sister right now. You are not an oldest. You are not a babysitter. For one hour, you are an <em>actor.</em> Do you accept the demotion?"</p>
<p>Chayten laughs. It surprises her.</p>
<p>"Yes."</p>
<p>Otto looks at her one more long second. Then he says, quietly: "And child. Before I go. May I just sit here a moment? With you. Not to ask anything."</p>
<p>Chayten blinks. Nobody has ever asked her that. Nobody has ever just <em>asked to be near her</em> without needing her to do something for them.</p>
<p>She nods. Otto sits down beside her, cross-legged otter style. He doesn't speak. He doesn't introduce his troupe. He just sits with her the way a person sits with another person whose company is enough.</p>
<p>It lasts maybe ten seconds. It is the most important ten seconds Chayten has experienced in a year.</p>
<p>Otto stands up. "<em>Excellent.</em> Now. Follow me."</p>`,

p123: {
  id: 'P-123',
  type: 'path',
  title: 'PATH A — Take the Script',
  region: 'chayten',
  text: `<p>Chayten takes the script. The paper is soft from a thousand readings. She reads fast.</p>
<p>It's about a young otter girl whose little brother was lost in a storm. She spends her life singing him home, every night, until she's old. Then she finds him. That's the ending.</p>
<p>A sad play. A beautiful play.</p>
<p>Lines down in twenty minutes. Otto fits her with the velvet cape. The Stones are humming louder now. The amphitheater is full.</p>
<p>Chayten goes on stage. She delivers the lines. She is good. Her voice carries. The Stones hum approval at the climactic line. Otters in the wings weep. Otto, off-stage, blots his eye.</p>
<p>Otto presents her with a small driftwood mask &mdash; otter-shaped, with eyes deliberately too kind. "The Otter Mask. Whoever wears it speaks with a voice the listener cannot ignore."</p>
<p>A small otter Chayten hasn't met before comes up and hands her a small silver fish. "For your brother. He likes fishing." Chayten kneels: "How did you know?" "You said his name when you got nervous."</p>
<p>It was a good show. It was not a great show. She thinks she might know why. She doesn't quite say it out loud.</p>`,

p124: {
  id: 'P-124',
  type: 'path',
  title: "PATH B — Ask What the Play Is About",
  region: 'chayten',
  text: `<p>Chayten doesn't take the script. "What's it really about?"</p>
<p>Otto goes very still. The other otters stop swirling and turn slightly to look at him. Otto sits down on the stage. He pats the wood next to him. Chayten sits.</p>
<p>"It is about my brother. Not the brother I had. The brother I <em>chose.</em> We were not born to the same mother. We were not the same kind of otter. He was river. I was lake. We were raised together. We were brothers anyway. We were not blood. We were better than blood. Do you understand?"</p>
<p>Chayten thinks of Aiden, who is her brother by blood. Then she thinks of the seven other kids at Sun Lakes. Who are her brothers and sisters in a different way. By choice. By return. By every July for as long as she can remember.</p>
<p>"Yes."</p>
<p>"He was lost in a storm when we were small. The play says the sister sings him home. The truth is, I never sang him home. I just kept singing because I didn't know what else to do. I have played this play seven hundred and twelve times. Every time I am the brother who comes back at the end. Every time, I think &mdash; <em>what if this is the time he hears me.</em>"</p>
<p>Chayten thinks for a moment. "Can I change the ending? Just one line. Instead of <em>you came home</em>, can I say <em>you were always with me</em>?"</p>
<p>Otto is quiet for a long time. "I have been playing the wrong ending for seven hundred years."</p>
<p>He hugs her. The bandaged whiskers tickle her ear.</p>
<p>The performance: beautiful. The Stones hum until the ground shakes.</p>
<p>Otto presents her with the older, more loved Otter Mask. "Mine. Now yours."</p>
<p>Then: "I will come with you to the lake-up-above. I have not left The Old Roar in two hundred years. But I'll come for this. For you."</p>`,
  earns: { item: ['voice', 'enhanced'], allies: ['Otto'] },
  choices: [{ label: 'Exit', target: 'p126' }],
},

p125: {
  id: 'P-125',
  type: 'path',
  title: 'PATH C — Notice Pickle',
  region: 'chayten',
  text: `<p>Chayten was about to take the script. But there's a small otter shaking by the wardrobe trunk.</p>
<p>Tiny. Half the size of the other otters. Holding a child-sized brown smock like it might bite her.</p>
<p>Chayten kneels. "Hey. I'm Chayten. What's your name?"</p>
<p>"...Pickle."</p>
<p>"Are you in the play?"</p>
<p>Pickle shakes her head fast. Then nods. Then shakes again. "I'm &mdash; they said I could be the <em>brother</em>. The little one. But I can't, I can't go out there, my legs don't &mdash;"</p>
<p>Chayten: "Hey. Pickle. Look at me. You don't have to be brave to be useful. You just have to show up. Will you go out there with me? We'd be on stage together. I won't let go of your paw. Not for one second. Deal?"</p>
<p>"...Deal."</p>
<p>Chayten walks back to Otto. "I'll do the play. But I want Pickle as the brother. Both halves. Or I won't do it."</p>
<p>The otters go very quiet. Otto: "I have been mis-casting that role for forty-three years." He roars at the troupe: "PICKLE IS THE BROTHER. RESET THE BLOCKING. <em>MOVE.</em>"</p>
<p>Chayten and Pickle take the stage holding paws. Chayten does not let go. Pickle delivers her lines in a tiny voice. The big Stones in the back lean forward to hear &mdash; Chayten can FEEL them lean &mdash; and when Pickle says her one big line ("I am still here, I am still here, I am still here, I never went away"), the Stones hum so deep that Chayten's chest vibrates with it.</p>
<p>Then one of the back-row Stones &mdash; the biggest one, silent for 500 years &mdash; speaks: "<strong>SHE SAW THE SMALL ONE FIRST. THAT IS A REAL THING.</strong>"</p>
<p>The whole troupe goes still. Otto whispers, "The Stones haven't <em>spoken</em> in a hundred and twenty years."</p>
<p>Pickle climbs Chayten's side and clings to her shoulder. "Can I come with you?"</p>
<p>"Yes."</p>`,

},

p131: {
  id: 'P-131',
  type: 'always',
  title: 'The Go-Hard Moment',
  region: 'carson',
  text: `<p>Big Coulee explains. The Long Race is in thirty minutes. She has been training for six moons. Her babies keep wandering off. She is NERVOUS. She needs a worthy opponent.</p>
<p>"WILL YOU RACE ME?"</p>
<p>Carson is about to say yes when Big Coulee does something he doesn't expect. She <em>rams</em> him. Not hard — a nudge with her flank. He is a hundred and twenty pounds and she is roughly ten thousand. He goes sprawling. Lands in the grass. Laughing.</p>
<p>"GET UP. RAM ME BACK."</p>
<p>Carson stands. He runs at her, shoulder lowered, full speed. He hits her side. She doesn't move. Her flower crown slips slightly.</p>
<p>She <em>cheers.</em></p>
<p>"YES. YES. THAT is what I am TALKING about, child. Do you SEE? You can't hurt me. I have raced thirty competitors in six moons and every one of them softened it. They thought I would be sad if I lost. Do you know what that's like?"</p>
<p>Carson does, in fact, know what that's like.</p>
<p>"Today you race like you mean it. Like a champion. Not like an older cousin. Race ME. You can be polite tomorrow."</p>
<p>Carson grins. He has not been told to stop softening in a long time. "Okay."</p>`,

  region: 'carson',
  text: `<p>"Just race. Fastest wins."</p>

  region: 'carson',
  text: `<p>"Race AND we gather babies along the way. Whoever gets back with the most babies wins."</p>

p135: {
  id: 'P-135',
  type: 'path',
  title: 'PATH C — Settle the Babies First',
  region: 'carson',
  text: `<p>Carson looks at Tuft and Tumble. Their trunks are tangled. Tumble is making a small worried sound. They don't want their mom to leave.</p>
<p>He doesn't know how he knows this. He just does.</p>
<p>"Race in twenty. Let's settle them first."</p>
<p>Big Coulee snorts. "The race is in THIRTY MINUTES."</p>
<p>"They're scared. We'll do it. They just need to know what's going to happen."</p>
<p>Big Coulee looks at her babies. She had not noticed.</p>
<p>She lowers herself slowly. Carson kneels next to them. "Hey. I'm Carson. Your mom is the best racer in The Old Roar. She has been getting ready for SIX MOONS. The race is just to that pole and back. You'll see her the whole time. I'll point so you know exactly where she is."</p>
<p>Tuft puts her trunk on Carson's wrist. Tumble climbs into his lap.</p>
<p>Big Coulee watches. "Nobody ever stopped to talk to them before."</p>
<p>Carson shrugs. He has a seven-year-old cousin.</p>
<p>Ten minutes. The babies are leaning against him, half-asleep. Big Coulee is calmer too.</p>
<p>The race goes ahead. Big Coulee wins by a lot &mdash; Carson lost his prep time. He laughs the whole way.</p>
<p>Big Coulee scoops him up. Her eyes are wet.</p>
<p>"You gave up your race so my babies wouldn't be scared." She presses the Tusk-Charm into his hand. "This is yours. But also &mdash; <em>these</em> are yours when you need them. Whatever comes, <em>we</em> will be there. The whole family. You looked out for mine. I will look out for yours."</p>`,
  earns: { item: ['charm', 'full'], allies: ['BigCoulee', 'Tuft', 'Tumble'], flags: ['ChampionAndFriend'] },
  choices: [{ label: 'Exit', target: 'p136' }],
},

p136: {
  id: 'P-136',
  type: 'exit',
  title: 'Big Coulee Walks Him to His Raft',
  region: 'carson',
  text: `<p>Before he climbs onto the boat-on-wheels, Big Coulee stops him. She lowers her head one more time. Her voice is small. Just for him.</p>
<p>"Child. The thing you did today — running hard, AND stopping for the babies, AND letting it tie, AND not pretending I was easier than I was — that's not just being a good competitor. That's a thing you do all the time, isn't it. At home. With the small one. The fishing kid."</p>
<p>Carson is quiet.</p>
<p>"You watch out. You hype people up. You shield the little ones when nobody asked you to. You make people <em>braver</em> by being near them. That is a <em>real</em> thing, child. It's called <em>being trustworthy.</em> And it is the most underrated thing a person can be."</p>
<p>She bumps her flower-crown against his forehead. "Don't forget. People follow the loud ones. But they <em>trust</em> the ones like you."</p>
<p>Carson nods. He doesn't say anything. He files what she just told him under things he'll think about later.</p>
<p>The boat-on-wheels is waiting where he left it.</p>`,
  region_complete: 'carson',
  choices: [{ label: 'Continue', target: 'next' }],
},

p140: {
  id: 'P-140',
  type: 'always',
  title: "Old Speak's Wood",
  region: 'reid',
  text: `<p>Reid's raft slides up onto a beach of small flat stones. The raft is a long log canoe now, hollowed out, smooth inside. He steps off without looking.</p>
<p>The wood in front of him is ancient. Trees the size of houses. Bark so thick and so old it has its own bark. The air smells like turned earth and old cedar and a specific cold sweetness Reid has never met before and somehow already knows.</p>
<p>He bends. Picks up a fallen branch. Starts whittling without deciding to.</p>
<p>A voice from a stump: "<em>FINALLY.</em>"</p>
<p>Reid looks up. Calmly. The stump is not a stump. It is a person. Bark for skin, leaves growing where hair should be. Twice Reid's size.</p>
<em class="variant">[Variant per strategy]</em>
<p>"I'm OLD SPEAK. Or that's what people called me a thousand years ago. I might have a new name now. I haven't checked. Sit, sit. <em>Visit.</em>"</p>
<p>Reid sits on a root that turns out to be perfectly shaped for sitting. He keeps whittling. Old Speak watches him for a long moment.</p>
<p>"You make sticks. I like sticks."</p>`,
  choices: [{ label: 'Settle in', target: 'p141' }],
},

p141: {
  id: 'P-141',
  type: 'always',
  title: 'The Just-Sit Moment',
  region: 'reid',
  text: `<p>"You're doing the thing."</p>
<p>Reid looks up. "What thing?"</p>
<p>"The <em>working</em> thing. You always do the working thing. I can tell. I was a tree before I was a person &mdash; I've watched a thousand visitors and the working ones have a posture. Shoulders forward. Hands going. Eyes already on the next problem."</p>
<p>"Put the stick down. Just for a minute."</p>
<p>Reid puts it down.</p>
<p>"Now look up."</p>
<p>Reid looks up. The canopy is a hundred feet above him. Light coming through in slow shafts. A bird he can't identify is moving from branch to branch without making a sound.</p>
<p>"That bird is called Listen. She's the only one of her kind. She doesn't sing. She only listens. She's been listening to this wood for two hundred years."</p>
<p>"I am ALSO listening. I have been listening to you since you stepped off your boat. You came in quiet. You don't take up extra room. You start working before you're asked because you don't want anyone to have to ask. That is a rare way to be, child."</p>
<p>Reid's face gets warm.</p>
<p>"I see you. Most don't. I just wanted to say so."</p>
<p>Reid swallows. Then picks up the stick again, but slower this time.</p>`,
  choices: [{ label: 'Choose what to carve', target: 'p142' }],
},

p142: {
  id: 'P-142',
  type: 'decision',
  title: "Reid's Choice",
  region: 'reid',
  text: `<p>Three pieces of wood at his feet: heavy maple, light willow, dark driftwood the color of wet basalt. "Take one. Carve it. The staff you carve will be what you need it to be."</p>`,

p143: {
  id: 'P-143',
  type: 'path',
  title: 'PATH A — The Maple',
  region: 'reid',
  text: `<p>Reid takes the maple. He knows maple. He's made twenty walking sticks out of maple over twenty summers. His hands know the grain.</p>
<p>The staff takes about twenty-five minutes. Six feet long, thicker at the base, smooth where his hand will hold it. Clean and straight and a good honest piece of work.</p>
<p>He leans on it. It holds. The wood is warm under his palm.</p>
<p>Old Speak nods. "Fine staff. Will not break easily. Will hold the line you want it to hold. Maple is honest. So are you."</p>
<p>He reaches into his bark and pulls out a tiny carving &mdash; a miniature staff, the size of Reid's finger. "Memory token. If you ever come back, hold it up so I know it's you."</p>
<p>Reid pockets it. Stands. Thanks Old Speak. Walks back toward his raft.</p>
<p>"Tell me a new story next time you come. I've memorized this one already. Even though we didn't tell any."</p>
<p>Reid laughs, just a little.</p>`,
  earns: { item: ['staff', 'base'] },
  choices: [{ label: 'Exit', target: 'p146' }],
},

p144: {
  id: 'P-144',
  type: 'path',
  title: 'PATH B — Ask for the Technique',
  region: 'reid',
  text: `<p>"Can you teach me something I don't know yet?"</p>
<p>Old Speak's whole face does something. His leaves brighten. "<em>YES.</em>"</p>
<p>"The wood is listening. It has been listening since it was a seed. It remembers everything that ever walked past it. If you carve and you think about nothing, the wood will be nothing. If you carve and you think about WHERE you are and WHO you love and WHAT this staff is for &mdash; the wood will hold all of it. Forever."</p>
<p>Reid takes the driftwood. He picked it without thinking. His hand went to it.</p>
<p>He carves slowly. He thinks about the dock at home. He thinks about Ella jumping off the end last summer with her eyes closed and her arms straight up. He thinks about Aiden's first cast.</p>
<p>The driftwood opens for him. He doesn't carve it so much as <em>reveal</em> it. The shape inside is already there.</p>
<p>The staff is done in an hour. Heavier than the maple. Color of wet basalt. The grain shows three concentric rings near the top where his hand will rest.</p>
<p>It hums when he holds it. Low. Like a struck bell, far away.</p>
<p>Old Speak is very quiet. "I have not seen wood do that in seven hundred years."</p>
<p>He stands. Bows. "I am coming with you. To the dock that wobbles. I have not left this wood in nine hundred years. I will leave it for this. I am older than the man with the clipboards."</p>
<p>"Are you sure?"</p>
<p>"Child, I am made of <em>wood.</em> I will be very dramatic. Try and stop me."</p>`,
  earns: { item: ['staff', 'enhanced'], allies: ['OldSpeak'] },
  choices: [{ label: 'Exit', target: 'p146' }],
},

p145: {
  id: 'P-145',
  type: 'path',
  title: 'PATH C — Ask About the Driftwood',
  region: 'reid',
  text: `<p>"Tell me about the driftwood. Where did it come from?"</p>
<p>Old Speak goes still. Then laughs quietly. "Nobody has asked me that in a thousand years. They always ask if it's the <em>strongest</em>. Nobody asks where it came from."</p>
<p>"This came from the FIRST TREE in The Old Roar. The first one to grow when the floods stopped roaring and the basalt cooled and there was finally enough soil for a root. It grew at the edge of what your people now call a cove. It stood there for nine hundred years. It fell in a storm. The lake took it. Held it for another five hundred years. Then the lake gave it back to me. To hold. Until the right hands came for it."</p>
<p>"You are the right hands."</p>
<p>Reid swallows. He doesn't quite believe it. But the wood is warm under his palm.</p>
<p>He carves slowly. He thinks the things Old Speak taught him &mdash; <em>where you are, who you love, what this staff is for.</em> He thinks about the dock. About the <em>third piling,</em> the one he noticed earlier this morning, the one the water has been eating out from under.</p>
<p>He carves THAT into the staff. Not as a picture. As a knowing.</p>
<p>At the top, three rings. At the base, a faint mark like the curve of a shoreline. The whole thing hums when he picks it up &mdash; a low, slow hum, like a chord pulled out of a deep place.</p>
<p>Old Speak is openly weeping. He weeps sap. It is bright amber and very sticky.</p>
<p>"You did the thing I cannot teach. That staff is now bonded to your dock. When you plant it at the base of the third piling, the wood will <em>root.</em> Your dock will stand."</p>
<p>Then the wood does something Reid will remember the rest of his life.</p>
<p>Every tree in the rocky woodland &mdash; every single one &mdash; bends very slightly toward him. The canopy itself reorganizes. The whole forest is <em>bowing.</em> Not to the staff. To the boy who carved it.</p>
<p>Old Speak says, very quietly: "Well. They've never done that for me. They like you, child."</p>
<p>Reid doesn't trust himself to speak.</p>
<p>"Can you come with me?"</p>
<p>"I would not miss it."</p>`,
  earns: { item: ['staff', 'full'], allies: ['OldSpeak'], flags: ['DockHealing'] },
  choices: [{ label: 'Exit', target: 'p146' }],
},

p150: {
  id: 'P-150',
  type: 'always',
  title: 'Skip-Stone Lake',
  region: 'kellen',
  text: `<p>Kellen's raft slides up to the edge of a long flat lake. His raft is now a sleek racing canoe with carbon-black sides. He steps onto the shore and a stone skims past his ear. Bounces nine times across the water.</p>
<p>He turns. A flock of bird-creatures &mdash; long-legged, blue-feathered, smug &mdash; on the bank with piles of stones and a tiny scoreboard etched into slate.</p>
<p>The biggest one notices him. "Kid. This is a CHAMPIONSHIP game. You can watch from over there."</p>
<em class="variant">[Variant per strategy]</em>
<p>Kellen: "I'd like to play."</p>
<p>All the birds laugh.</p>
<p>"This game requires SKILL. And STRATEGY. Most kids only have one or the other. Possibly neither."</p>
<p>"I'll take that bet."</p>
<p>The bird looks intrigued. Kellen picks up a stone. Weighs it. Turns it over. Checks the flat side against his thumb. The biggest bird (her name is Skim) watches him do this.</p>
<p>"Hmm."</p>`,
  choices: [{ label: 'Skim sets the rules', target: 'p151' }],
},

p151: {
  id: 'P-151',
  type: 'always',
  title: 'The Whole-Self Moment',
  region: 'kellen',
  text: `<p>Skim hops over (more of a hop, wings folded like a tiny field general). She holds two stones in her beak. She sets them in front of Kellen.</p>
<p>"Pick the throwing one."</p>
<p>Kellen looks at them. They look identical to anyone else. They are not identical to him. The one on the left is slightly flatter on the bottom — better skip surface. The one on the right is heavier — better distance, worse curve.</p>
<p>He picks the one on the left.</p>
<p>Skim nods, once. She picks up the heavier stone and skips it across the lake. Nine bounces, then a curve, then a stop. Without looking.</p>
<p>Then she does something weird. She picks up the <em>flatter</em> stone — the one Kellen would have used — and deliberately throws it badly. Skips twice, wobbles, sinks.</p>
<p>She turns to him. "That's how it goes if I only use my throwing arm. If I forget the rest of me. Did you see?"</p>
<p>Kellen did see.</p>
<p>"I've been doing this for forty years. You know what I see most? Kids who hide one of their halves. They think they have to pick."</p>
<p>"You're both. I saw your hand on that stone. I saw you read it. Don't hide it. Eyes, hands, thinking, instinct. The whole kid. Yes?"</p>
<p>Kellen is quiet for a longer time than he expected to be. Because here's the thing he hasn't told anyone: he has been afraid. Not big afraid. Small afraid. The kind of afraid where you laugh first so nobody can laugh at you. He has been doing this since fourth grade and he has gotten good at it.</p>
<p>Skim is the first creature in a year who has looked at him and seen <em>both</em> halves and decided the both was the good part.</p>
<p>"I get scared people will tease me."</p>
<p>Skim nods like she expected this. "I know. That's why I told you first. So you don't have to hide here."</p>
<p>Kellen swallows. "Yes." He means it this time.</p>
<p>He picks the throwing stone. He is, for the first time in a year, all the way in his own body.</p>`,
  choices: [{ label: 'Begin', target: 'p152' }],
},

p152: {
  id: 'P-152',
  type: 'decision',

p153: {
  id: 'P-153',
  type: 'path',
  title: 'PATH A — Play the Seven Patterns',
  region: 'kellen',
  text: `<p>"First approved pattern. Show me."</p>
<p>Skim calls it: <em>three short, two long, one stop.</em> Kellen throws. The stone obeys.</p>
<p>Second. Third. Fourth. Fifth. Sixth.</p>
<p>By the seventh, the birds are no longer laughing. One is taking notes on a slate with a tiny pencil. Two others have their heads tilted in the same direction.</p>
<p>Kellen plays clean. He doesn't show off. He doesn't add anything that wasn't asked for. He just <em>does the patterns,</em> one after another.</p>
<p>The bank is silent when he finishes.</p>
<p>Skim hops over. "This stone always skips true. It does what you tell it. Skip on water, dirt, paper, glass &mdash; anything flat enough to bounce off of. Don't waste it. Throw it when it matters."</p>
<p>"And kid &mdash; you played with your WHOLE self. You didn't pretend either half wasn't there. That is rare."</p>
<p>"I'll try not to forget."</p>`,
  earns: { item: ['stone', 'base'], flags: ['WholeKidPlay'] },
  choices: [{ label: 'Exit', target: 'p156' }],
},

p154: {
  id: 'P-154',
  type: 'path',
  title: 'PATH B — Ask Skim to Go First',
  region: 'kellen',
  text: `<p>"Skim. You go first. Let me watch."</p>
<p>Skim's head tilts. The other birds make small surprised sounds. Skim has been lead thrower for forty years and nobody has ever asked her to demonstrate first.</p>
<p>She likes this kid.</p>
<p>She throws. Pattern one. Pattern two. Kellen watches her hand. Her hip. Where her eyes land before she throws.</p>
<p>By pattern four she stops and looks at him sharply. "You're learning faster than I'm teaching."</p>
<p>"You're a good teacher."</p>
<p>"I am NOT a teacher. I am a CHAMPION."</p>
<p>"Then you're a champion who can also teach."</p>
<p>Skim is quiet. Then she does something she hasn't done in front of the flock in twenty years: she compliments a thrower out loud. "Kid. Throw the patterns. All seven. <em>Your</em> way."</p>
<p>Kellen executes cleanly. The seventh pattern he places the stone on its edge on the shore. The flock falls silent.</p>
<p>Skim lays her stone at his feet. "I have given this to four throwers in forty years. Two used it well. Two lost it. You will use it well."</p>
<p>"And kid &mdash; the next time you go to that man with the clipboards &mdash; I'll come too. If you want me."</p>
<p>"I want you."</p>`,
  earns: { item: ['stone', 'enhanced'], allies: ['Skim'], flags: ['WholeKidPlay'] },
  choices: [{ label: 'Exit', target: 'p156' }],
},

p155: {
  id: 'P-155',
  type: 'path',
  title: 'PATH C — Invent a Pattern',
  region: 'kellen',
  text: `<p>"What happens if I invent a new pattern?"</p>
<p>The birds laugh. Skim does not. "Nobody has invented a new pattern in three hundred years."</p>
<p>"Why not?"</p>
<p>"Because the SEVEN are perfect. They are HISTORICAL. They are APPROVED."</p>
<p>"By who?"</p>
<p>The birds open their mouths. Close them. Look at each other. Look at Skim.</p>
<p>Skim is quiet for a long moment. "I don't actually know. Nobody does."</p>
<p>"I'm going to call it <em>the mirror.</em> You throw a pattern. I throw a pattern that mirrors it. Whatever you do, I do reversed. We make a pattern together that neither of us could make alone. You game?"</p>
<p>Skim doesn't move for ten seconds. "Throw."</p>
<p>Skim throws first. Three short, a curve right, a long, a stop. Kellen throws second. Three short, a curve LEFT, a long, a stop. The stones land beside each other, mirroring across an invisible line.</p>
<p>Skim trumpets &mdash; for a small bird, she has enormous lungs. The flock goes absolutely silent.</p>
<p>They throw it again. Harder pattern. Mirror. Again. Again. By the fourth round, Kellen is laughing out loud.</p>
<p>The smallest bird says quietly: "<em>We have eight patterns now.</em>"</p>
<p>Skim with the gravity of a coronation: "Kid. We have <em>eight</em> patterns now. The Mirror is the eighth. It is named after you."</p>
<p>Kellen blushes red to the tips of his ears.</p>
<p>Skim gives him the True-Skipping Stone. Then a second one. "From me. Personally. For when you need a backup. When you go back to that man with the clipboards &mdash; I'm coming. <em>We're</em> coming. Whole flock."</p>`,
  earns: { item: ['stone', 'full'], allies: ['Skim'], flags: ['WholeKidPlay', 'PatternInvented'] },
  choices: [{ label: 'Exit', target: 'p156' }],
},

p156: {
  id: 'P-156',
  type: 'exit',
  title: 'Exit',
  region: 'kellen',
  text: `<p>The racing canoe is where Kellen left it. The stones in his pocket clack softly. The smallest bird circles back to wave once.</p>
<p>As Kellen paddles, he says it out loud once, to make sure he doesn't forget:</p>
<p><em>"Played whole. It worked."</em></p>
<p>That's the line. The line he is going to remember when he is fifteen, and twenty, and forty.</p>`,

p160: {
  id: 'P-160',
  type: 'always',
  title: 'The Painted Cliff',
  region: 'keira',
  text: `<p>Keira's raft slides up to the foot of an enormous cliff. Her raft is now a flat wooden raft with a small easel bolted to it, brushes in a leather holder, and paints in glass jars. The colors are colors she doesn't have names for. She wants names for them immediately.</p>
<p>The cliff is gigantic. Black basalt, columns rising hundreds of feet up. Perfectly hexagonal.</p>
<p>She tilts her head. The cliff has a face. She tilts the other way. The cliff is <em>breathing.</em></p>
<em class="variant">[Variant per strategy]</em>
<p>She can hear something. A small sound. Like... snoring? But the snore is <em>colored.</em> Pale blue with flecks of orange.</p>
<p>A voice: "You're not supposed to be able to see that. I'm UP HERE. Third column from the left."</p>
<p>The third column has eyes. The eyes are closed. The cliff is asleep.</p>
<p>"Could you do me a favor? I would very much like to wake up."</p>
<p>"How?"</p>
<p>"I don't know. I've been trying for centuries. Maybe a fresh perspective."</p>
<p>He yawns. The yawn is purple.</p>`,
  choices: [{ label: 'Open the paints', target: 'p161' }],
},

p161: {
  id: 'P-161',
  type: 'always',
  title: 'The Both-at-Once Moment',
  region: 'keira',
  text: `<p>Before Keira even picks up a brush, the cliff opens one eye a crack. Closes it.</p>
<p>"Huh."</p>
<p>"What?"</p>
<p>"You have an artist's eye. I can see it. But you ALSO have a climber's body. Tall for your age. Strong shoulders. I can see THAT too. Most visitors are one or the other. You're both. All the way down."</p>
<p>Keira shrugs. "I just like to do everything."</p>
<p>"That is RARE. Most of the world makes you pick. Most of the world tells the artist to stop climbing and the climber to stop painting. <em>You haven't picked.</em> I can tell. Don't ever pick."</p>
<p>She is ten years old. People have been telling her she's <em>good for an artist</em> or <em>good for her age</em> her whole life. Nobody has ever told her she gets to be everything she is all at once.</p>
<p>"Okay."</p>
<p>"Good. Now. Please paint me awake. I have been BORED for two hundred of the last five hundred years and I would like to see the sky again."</p>
<p>He yawns purple. The paints in the jars <em>move</em> when she opens them. They lean toward her.</p>`,
  choices: [{ label: 'Begin', target: 'p162' }],
},

p163: {
  id: 'P-163',
  type: 'path',
  title: 'PATH A — Just Paint',
  region: 'keira',
  text: `<p>Keira picks up the orange. The orange leaps out of the jar. She catches it with the brush. It is <em>eager.</em></p>
<p>She paints. Fast. The way she paints when nobody is watching &mdash; wide strokes, no plan. The orange leads. The blue follows.</p>
<p>The cliff is purring now. Each stroke wakes him a little more. She gets to his eyes &mdash; thirty feet up. She climbs.</p>
<p>She finds the seams. She studies the cracks. She goes up. The mouse with spectacles (the official biographer of the cliff) watches her with both paws over its mouth.</p>
<p>She reaches Cliffy's eye. Paints a small ring of color. "Okay. Open."</p>
<p>Cliffy opens his eyes. The whole cliff face smiles.</p>
<p>She climbs down. Cliffy reaches into his basalt chest and pulls out a small brush, wood with a tip made of light. "Truth Brush. You don't paint with it. You look through it. Anything hidden becomes visible. Lies turn yellow. Truth glows blue."</p>
<p>The mouse writes the climb into the cliff's history book.</p>`,
  earns: { item: ['brush', 'base'] },
  choices: [{ label: 'Exit', target: 'p166' }],
},

p164: {
  id: 'P-164',
  type: 'path',
  title: 'PATH B — Ask What He Wants',
  region: 'keira',
  text: `<p>"What do you want to be painted AS?"</p>
<p>Cliffy is quiet for a very long time. "Nobody has ever asked me that."</p>
<p>She waits.</p>
<p>"I don't think I know what I look like. I've been asleep so long. What does the world look like now? What's NEW?"</p>
<p>Keira leans against him. He is cool and steady. She thinks.</p>
<p>"What about... kindness? What does kindness look like? I'll paint that."</p>
<p>Cliffy goes very still. "I haven't thought about that in five hundred years. I... I think kindness looks like... one hand reaching toward another hand. Yes?"</p>
<p>She paints. Up his basalt forearm, a long curving stroke of warm gold &mdash; a hand. Up his other forearm, the other hand, reaching. So the fingertips don't quite touch. They are reaching, always reaching, never finishing the reach. The reach is the thing.</p>
<p>Cliffy is crying. Pale blue paint. It drips down his basalt face and pools at his feet.</p>
<p>"That is the most beautiful thing that has ever been on me."</p>
<p>She climbs to his eyes. He opens them. He looks down at the hands on his arms. He cries again.</p>
<p>He gives her a Truth Brush, older, more worn. "This was my mother's. She was a cliff too. You earned it."</p>
<p>"I cannot leave this place. I am stone in this ground. But &mdash; if you call my name from somewhere with stone, my <em>attention</em> will travel. The basalt around your home will notice. The man with the clipboards &mdash; he won't see me. But he will feel watched."</p>`,
  earns: { item: ['brush', 'enhanced'], flags: ['CliffyEcho'] },
  choices: [{ label: 'Exit', target: 'p166' }],
},

p165: {
  id: 'P-165',
  type: 'path',
  title: 'PATH C — Climb First',
  region: 'keira',
  text: `<p>"I'm going to climb up first. I want to see what you've been dreaming."</p>
<p>Cliffy: "Climb me? CLIMB me? No one climbs me. I am a CLIFF. I am hundreds of feet tall."</p>
<p>Keira is already climbing.</p>
<p>She finds the seams. The basalt is forgiving. She climbs steadily. Fifty feet. A hundred. Two hundred. Three hundred. The mouse with spectacles is biting his tiny knuckles.</p>
<p>She gets to a ledge near his eyes. She sits. She catches her breath. The view from up here is not the view from below.</p>
<p>She can see what Cliffy has been dreaming. The canyon &mdash; the whole canyon &mdash; has color <em>in the rock.</em> Veins of blue. Veins of orange. Streaks of green where the basalt should be black. The color is <em>there,</em> under the surface, invisible from the ground.</p>
<p>"Oh," she says. "Oh."</p>
<p>"You see them."</p>
<p>"You're SO COLORFUL."</p>
<p>"I forgot. For so long I was just black rock to everyone. I forgot the color was still in me."</p>
<p>She paints around his eyes &mdash; using <em>his</em> colors, the ones he forgot. Blue. Orange. Green.</p>
<p>"Open."</p>
<p>The canyon WAKES.</p>
<p>Color floods up the cliff face. Every basalt column from the water to the sky lights up &mdash; blue veins, orange streaks, green ribbons. The whole canyon, both walls, miles of basalt, turns colored at once. <em>It is enormous.</em></p>
<p>And then she sees something nobody else will ever see.</p>
<p>For one second &mdash; just one &mdash; there is a <em>face</em> in the canyon wall opposite. Made of veins. Blue and orange. A woman's face, the basalt arranged like cheekbones, the orange streaks shaped like an open mouth. The face is singing. Keira can't hear it from this far, but she can see the shape of the singing &mdash; the mouth open, the throat working, the face full of the joy of a person who didn't know anyone was listening.</p>
<p>The face fades into ordinary colored rock.</p>
<p>Keira does not tell anyone. She knows already that this was meant for her. Someday &mdash; maybe at home, maybe many summers from now &mdash; she will hear that face singing for real. She will know who it is. She will not say.</p>
<p>Cliffy raises a hand to his face and feels his own colored cheekbones.</p>
<p>"You woke up the WHOLE CANYON."</p>
<p>"You were already this colorful. I just looked."</p>
<p>He carries her down, hand the size of a small house. He gives her a Truth Brush brighter than the others. "I am COMING with you. I am going to walk to the lake-up-above. I am a CLIFF. This will take many hours. I do not care. I am coming."</p>`,
  earns: { item: ['brush', 'full'], allies: ['Cliffy'], flags: ['CanyonWokeColor'] },
  choices: [{ label: 'Exit', target: 'p166' }],
},

p170: {
  id: 'P-170',
  type: 'always',
  title: 'The Bright Water Court',
  region: 'ella',
  text: `<p>Ella's raft slides up onto a moss circle. The raft is now a small wooden boat with golden trim and a velvet seat. She steps off, very carefully, because the gold trim catches the sun.</p>
<p>A frog in a tiny crown bows. "Princess."</p>
<p>"Princess?"</p>
<p>"Your boat has GOLDEN TRIM. Only royalty have golden trim. We've been EXPECTING you."</p>
<em class="variant">[Variant per strategy]</em>
<p>She follows the frog. A tiny throne of mossy stone. On it sits a girl Ella's age, wearing a crown that is slipping over one eye. Her knuckles are white on the arms of the throne.</p>
<p>The frog announces: "Princess Ella, daughter of the Lake-Up-Above, attending Her Majesty Queen Marigold of the Bright Water."</p>
<p>Marigold looks up. Very stressed. "Hi. I've been queen for one week and I am pretty sure I am BAD at it. Please help."</p>
<p>The frogs erupt into argument. They are arguing about whether the new princess should sit on the throne. Each frog has a different opinion. Each frog is LOUD.</p>
<p>Marigold whispers, "They argue about EVERYTHING."</p>
<p>Ella has two older cousins who do this. She knows exactly how to handle it.</p>`,
  choices: [{ label: 'Sit on the throne', target: 'p171' }],
},

p171: {
  id: 'P-171',
  type: 'always',
  title: 'The Not-the-Dress Moment',
  region: 'ella',
  text: `<p>Marigold scoots over. There's room for two. Ella sits.</p>
<p>Then Marigold does something Ella doesn't expect. Marigold takes off her crown.</p>
<p>She holds it out in her cupped hands. She is just a frightened girl with stringy hair and a too-big robe. She does not look like a queen.</p>
<p>Marigold puts the crown back on. Now she looks like a queen again. Then she takes Ella's hand and puts it on the crown on her head.</p>
<p>"Feel that?"</p>
<p>Ella feels the crown. It is warm. It is just metal.</p>
<p>"That's all it is. Metal and shine. It's not what makes the queen. Watch."</p>
<p>She takes the crown off again. She sets it on a frog's head. The frog looks ridiculous.</p>
<p>The frog does not act ridiculous. The frog stands up straighter. Clears his throat. The other frogs stop arguing for a second. "...we should — order? Maybe?"</p>
<p>It works for about three seconds before the frogs erupt back into argument.</p>
<p>Marigold takes the crown back. "See? It almost worked. The crown does <em>some</em> of the work. But only some. The rest is whether the person under it <em>decided.</em>"</p>
<p>She looks at Ella. "I think <em>you</em> decide. That's why I knew you were a princess before you stepped off your boat."</p>
<p>Ella sits up straighter.</p>
<p>"The fox is coming. Now you'll see."</p>`,
  choices: [{ label: 'The doors slam open', target: 'p172' }],
},

p172: {
  id: 'P-172',
  type: 'decision',
  title: "Ella's Choice",
  region: 'ella',
  text: `<p>The double-doors of the court (two large lily pads on hinges) slam open. A fox-creature strides in. Much bigger than the frogs. Carrying a scroll. Confident.</p>
<p>Behind him, hiding under a fern: a tiny water-creature with a clutch of small eggs at her feet. The egg-mother. She is shaking.</p>
<p>Marigold: "Oh no."</p>`,
  choices: [
    { label: "PATH A: Take the throne, give Marigold advice.", target: 'p173', sub: "Play princess. Help with words. Crown (base)." },

    { label: "PATH C: \"You don't have to do this alone &mdash; I'll be queen WITH you.\"", target: 'p175', sub: "Play friend. Crown (full) + alliance + frog herald." },
  ],
},

p173: {
  id: 'P-173',
  type: 'path',
  title: 'PATH A — Give Advice',
  region: 'ella',
  text: `<p>Ella takes the throne. She whispers advice. Marigold listens. The fox unrolls his scroll. Marigold counters &mdash; using Ella's words &mdash; and the fox's claims wobble. The court frogs jump back and forth, taking notes.</p>
<p>Ella spots a forged seal at the bottom of his scroll. The fox loses his bid. Bows out grumpily. The egg-mother is safe.</p>
<p>Marigold thanks her with both hands clasped. "It's our court tradition. The queen always carries two crowns &mdash; one to give, when the right person comes. You are the right person."</p>
<p>The crown becomes invisible the moment it's settled &mdash; only Ella can see it (and Marigold, and anyone who deserves to).</p>
<p>"Now you're a Queen of the Bright Water too. If you ever need us, call my name. We will hear it across worlds."</p>`,
  earns: { item: ['crown', 'base'] },
  choices: [{ label: 'Exit', target: 'p176' }],
},

p174: {
  id: 'P-174',
  type: 'path',
  title: 'PATH B — Step Between',
  region: 'ella',
  text: `<p>Ella stands. Walks down the throne steps. Steps between the fox and the fern. She is ten years old. Four feet tall. The fox is twice her size.</p>
<p>The fox tilts his head. "Move along, little princess. The grown-ups are talking."</p>
<p>Ella does not move. "You will NOT take her home."</p>
<p>Three things happen at once.</p>
<p>The water in the moss circle goes flat. Not still — <em>flat,</em> like a lid was pressed onto it from above.</p>
<p>The frogs in the court — every last one — stop arguing. They all turn at the same time and face Ella. They are no longer her audience. They are now her <em>court.</em></p>
<p>And the egg-mother under the fern, who has been afraid all morning, takes the smallest deep breath she has taken in days. It is the breath of a creature who has just heard somebody, <em>finally,</em> say the thing she could not say for herself.</p>
<p>The fox starts to laugh. The laugh stops in his throat because Ella is <em>not blinking back</em> and because everything in the room has just decided to be on her side.</p>
<p>"Princess, the scroll is LEGAL. It is signed. It is BINDING."</p>
<p>"Show me where it's signed."</p>
<p>The fox shows her. Ella looks. She has a seven-year-old cousin who forges his name on permission slips. She knows exactly what forged ink looks like &mdash; the way the pen lingers at the start of the curve, the way the loops are too perfect.</p>
<p>"This is a fake. The signature was added later. The ink sits ON TOP of the seal instead of UNDER it. He drew it after the seal was already pressed."</p>
<p>The frogs lean in. They all see it now.</p>
<p>"You will leave. You will not come back. If you do, the Bright Water Court will know, and I will know, and we will FIND you."</p>
<p>The fox bows. Drops the scroll. Leaves so fast his tail bumps a frog in the head.</p>
<p>The egg-mother bows so low her forehead touches the moss. "Princess. Thank you. If you ever need us &mdash; the whole egg-chorus and I will sing for you. We sing one note all at once. People stop and listen."</p>
<p>Marigold: "You are no longer a guest. You are a Queen of the Bright Water." Second crown. The full strength of the court is hers.</p>`,
  earns: { item: ['crown', 'enhanced'], allies: ['FrogHerald', 'EggMotherChorus'], flags: ['CourageNotCrown'] },
  choices: [{ label: 'Exit', target: 'p176' }],
},

p175: {
  id: 'P-175',
  type: 'path',
  title: 'PATH C — Co-Rule',
  region: 'ella',
  text: `<p>Before the fox can finish bowing, Ella turns to Marigold. "You don't have to do this alone."</p>
<p>"I'll be queen WITH you. Both of us. Two queens. The fox can't talk circles around two of us at once."</p>
<p>Marigold blinks. Her crown slides further. "...Can you DO that?"</p>
<p>"Why not. It's your court. You make the rule."</p>
<p>Marigold sits up straight for the first time all day. She announces in a new voice: "<em>Court of the Bright Water. From this hour forward, Princess Ella is named Co-Queen. We rule together.</em>"</p>
<p>The frogs go absolutely silent. Then erupt in argument. (One faints from excitement.)</p>
<p>The fox tries to interrupt. Both queens turn to him at once. The fox stops talking.</p>
<p>They handle the case together &mdash; tag-team. Marigold knows the law. Ella knows the lying. The fox crumples and bows out faster than he came in.</p>
<p>Marigold turns to Ella. Smiling. "That was the best court session in the history of the Bright Water."</p>
<p>She reaches under the throne. Wooden box. The second crown. She places it on Ella's head. Ella places her own (a Sun Lakes hair ornament) onto Marigold's. They've traded.</p>
<p>"I declare the Bright Water Court allied to Hotel Sun Lakes. Forever. Any threat to the cove is a threat to us." To the herald: "<em>Go. To the lake-up-above. Bring the alliance proclamation. Stand with Co-Queen Ella when she needs you.</em>"</p>
<p>The herald produces a tiny scroll, bows three times, hops off into a small pool.</p>`,
  earns: { item: ['crown', 'full'], allies: ['FrogHerald', 'EggMotherChorus'], flags: ['CourageNotCrown', 'BrightWaterAlliance'] },
  choices: [{ label: 'Exit', target: 'p176' }],
},

p176: {
  id: 'P-176',
  type: 'exit',
  title: 'Exit',
  region: 'ella',
  text: `<p>The boat with gold trim is in the rushes. She has the Crown. On her head, a weight that feels less like decoration and more like <em>deciding.</em></p>
<p>She practices it as she pushes off — the deciding face. She tries it once in the reflection of the water. There it is. She did not have it this morning. She has it now.</p>
<p>She is ten years old. <em>She knows what her face is.</em></p>
<p>That's the line she'll remember. No one can take that from her now.</p>`,
  region_complete: 'ella',
  choices: [{ label: 'Continue', target: 'next' }],
},

p180: {
  id: 'P-180',
  type: 'always',
  title: 'The Unicorn Meadow',
  region: 'aiden',
  text: `<p>Aiden's raft is the unicorn raft. He climbed onto it in the sunroom and now he's flying.</p>
<p>The big inflatable unicorn used to be plastic. Now she's real. Her mane is rainbow. Her hooves don't quite touch the ground.</p>
<p>She turns her big head and looks at Aiden over her shoulder. "LOOK AT THIS!" (She points with her horn at a cloud shaped like a fish.)</p>
<p>"Yeah!"</p>
<p>"AND LOOK AT THIS!" (Now a rainbow growing sideways.)</p>
<p>"Wow!"</p>
<p>She lands in a meadow. The grass is greener than grass should be. Aiden slides off.</p>
<em class="variant">[Variant per strategy]</em>
<p>"I have been waiting for a rider for two hundred years. Did you know that? Because no one else FIT. The riders were too BIG. Or too TALL. Or too OLD. Or they didn't believe in unicorns enough. And then today I felt a small boy climbing onto me in a sunroom and I thought &mdash; <em>OH. There he is.</em>"</p>
<p>She tells him her name. She has never said it out loud before. "Pegasus."</p>
<p>"But Pegasus is a HORSE not a UNICORN."</p>
<p>"I picked it MYSELF."</p>
<p>Aiden laughs. Pegasus is delighted.</p>`,
  choices: [{ label: 'Sit down to talk', target: 'p181' }],
},

p181: {
  id: 'P-181',
  type: 'always',
  title: 'The Exactly-Right Moment',
  region: 'aiden',
  text: `<p>Pegasus gets serious. As serious as a unicorn whose mane is currently changing color can be.</p>
<p>"Aiden. I need to tell you a thing. Sit down."</p>
<p>Aiden sits.</p>
<p>"You are EXACTLY RIGHT."</p>
<p>"For what?"</p>
<p>"For ME. For this. For everything that is happening today. You are not too small. You are not too young. You are not too anything. You are the <em>exact right person</em> for what we are about to do. Most of the world is going to tell you you are too little to matter. The world is going to be WRONG about that for the rest of your life. I want you to know &mdash; right now, before anything happens &mdash; that the world is wrong. <em>I picked you.</em> Out of everyone. Because you fit."</p>
<p>Aiden's chin wobbles. Then Pegasus boops his nose with her horn. The horn is warm and slightly tickly. Aiden laughs.</p>
<p>"Now. There's a problem in The Old Roar. A baby otter fell into a magic hole. Only a unicorn can save her. But I am too YOUNG to save her by myself. I need a rider. Will you ride with me?"</p>
<p>Aiden doesn't even hesitate.</p>
<p>"Yes."</p>`,
  choices: [{ label: 'Pick a direction', target: 'p182' }],
},

  type: 'decision',
  title: "Aiden's Choice",
  region: 'aiden',
  text: `<p>"The hole is in one of THREE places. I know it's in one of them. I don't know which. Which way?"</p>`,

p183: {
  id: 'P-183',
  type: 'path',
  title: 'PATH A — Meadow of Bells',
  region: 'aiden',
  text: `<p>The Meadow of Bells is exactly what it sounds like: every flower is a tiny bell. When the wind blows, the meadow rings. Aiden gasps because it is beautiful.</p>
<p>The magic hole is under a large bell-flower. The flower lifts itself out of the way for Pegasus. They dive. The hole opens into a glittering cave.</p>
<p>Ripple is in the middle, three weeks old, scared, small enough to fit in Aiden's two hands. She's been crying for hours.</p>
<p>Aiden kneels. "Hi. I'm Aiden. We came to get you."</p>
<p>Ripple sniffs his hand. Then climbs into his pocket.</p>
<p>Pegasus uses her horn to glow. One door glows back. That's the way.</p>
<p>They surface. Ripple's mother is waiting &mdash; frantic, then sobbing. She touches her nose to Aiden's.</p>
<p>"Will you come home with me?"</p>
<p>"Yes."</p>
<p>"Will it be scary?"</p>
<p>"Yes. But you'll be there."</p>
<p>They fly home. "LOOK AT THIS!" (a cloud that looks like a sandwich). Aiden laughs all the way.</p>`,
  earns: { item: ['pegasus', 'base'] },
  choices: [{ label: 'Exit', target: 'p186' }],
},

p184: {
  id: 'P-184',
  type: 'path',
  title: 'PATH B — The Cliffside',
  region: 'aiden',
  text: `<p>The cliffside. Steep, basalt, dark. Harder to reach. Four doors in the cave. A very small, very grumpy creature sits in front of one. Size of a kitten. Sad more than scary.</p>
<p>"Don't go through my door. I LIVE here. I have been here for FIVE HUNDRED YEARS and nobody has ever just SAT WITH ME."</p>
<p>Aiden sits. "I'll sit with you."</p>
<p>Hush climbs into his lap. Buries his small grumpy face against Aiden's chest.</p>
<p>Then Pegasus says something Aiden didn't expect.</p>
<p>"Aiden. The Hush is bound to this cave. If he leaves, the door seals forever. No lost creature will ever be found again. <em>Unless</em> a unicorn stays in his place. Magic for magic. He could come with you, but only if I stay."</p>
<p>Aiden looks at Pegasus. He has wanted her to come home for an hour. He has not let himself think about anything else.</p>
<p>He thinks for a long minute. Then: "Pegasus, you said being exactly right means I have to not be selfish today."</p>
<p>Pegasus closes her eyes.</p>
<p>"But &mdash; can I think for one more second?" He looks at Hush. "Hush. Could you come for ONE DAY? Just one? To help us at the dock? Then come back?"</p>
<p>Hush sits up. He looks at Pegasus. Pegasus looks <em>delighted.</em></p>
<p>"One day is forty-eight hours less than five hundred years," Hush says. "I can do one day."</p>
<p>Pegasus: "Magic permits a visit. Not a move."</p>
<p>Hush attaches to Aiden's shoulder. He has gone from sad-grumpy to <em>brave</em> in the space of about three minutes. He sits up straighter on Aiden's shoulder than he has sat in five centuries. "Look," he whispers, awed at himself. "I am — I am DOING things. I never DO things. You made me do things."</p>
<p>Aiden says, matter-of-factly: "You did. You were always going to. You just needed someone to ask."</p>
<p>Pegasus bumps Aiden's forehead with her horn. "You found the third option. Most adults can't. Most children can. You just did. And look — you made him brave just by treating him like he already was."</p>
<p>Aiden grins. He didn't think he had made anyone brave. But he had.</p>`,
  earns: { item: ['pegasus', 'base'], allies: ['Hush'], flags: ['HushAtShowdown', 'AidenFoundThirdOption'] },
  choices: [{ label: 'Exit', target: 'p186' }],
},

p185: {
  id: 'P-185',
  type: 'path',
  title: "PATH C — The River's Bend",
  region: 'aiden',
  text: `<p>The river is wide and warm. The otters have been waiting. Tea party on a flat rock. Driftwood table. Thimble-sized teapot. Ripple's mother is there &mdash; calm.</p>
<p>The head otter introduces herself as Aunt Stream. "Child. Before we begin: the rescue is not free. To open the hole, someone has to give the river something that matters."</p>
<p>Aiden sets his tea down. "What do I have that matters?"</p>
<p>"You have the unicorn."</p>
<p>Aiden's chin starts to wobble.</p>
<p>"Not her staying. The river takes a <em>promise.</em> Unicorns belong to the whole world, not to one boy. If you bring her home, you have to promise she gets to come back. Not just to visit. <em>Back</em> &mdash; when the work at your lake is done. She does not stay with you forever."</p>
<p>Aiden looks at Pegasus. Pegasus is looking back at him. He thinks about this for a long time.</p>
<p>"I will promise."</p>
<p>"Aiden &mdash;"</p>
<p>"It's right. You belong to everyone. You're a UNICORN. You waited two hundred years for me. I can wait some years for somebody else to need you next."</p>
<p>Pegasus puts her horn against his forehead. Her eyes are wet.</p>
<p>"The river accepts."</p>
<p>Aunt Stream gets quieter. "While we have you. Do you ever hear singing? At night? At your lake-up-above?"</p>
<p>Aiden thinks. "Yes. Two summers ago. A LADY was singing. Mom said it was nobody."</p>
<p>"It was <em>somebody.</em> Your mother is shyer than she pretends. Pass it on, but gently. The singer should know we heard her. When the time is right. Not yet."</p>
<p>On the way home, Pegasus says: "You did the bravest thing of all eight of you today. You let me go before I went."</p>
<p>Aiden, quietly: "I didn't let you go. I let you visit other people. That's different."</p>
<p>Pegasus laughs the loudest unicorn laugh in two hundred years.</p>`,
  earns: { item: ['pegasus', 'base'], flags: ['CanyonSingerOttersConfirm', 'MotherIsTheSinger', 'AidenMadeThePromise'] },
  choices: [{ label: 'Exit', target: 'p186' }],
},
